<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dawnBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#030b18"/>
      <stop offset="70%"  stop-color="#061224"/>
      <stop offset="100%" stop-color="#0a1e38"/>
    </linearGradient>
    <radialGradient id="dawnLight" cx="80%" cy="8%" r="50%">
      <stop offset="0%"   stop-color="#4ECDC4" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#dawnBg)"/>
  <!-- Dawn light — emphasis, contrast -->
  <ellipse cx="290" cy="18" rx="80" ry="50" fill="url(#dawnLight)"/>
  <circle cx="290" cy="10" r="8"  fill="#4ECDC4" opacity=".4"/>
  <circle cx="290" cy="10" r="4"  fill="#4ECDC4" opacity=".7"/>
  <!-- Ground -->
  <rect x="0" y="155" width="300" height="45" fill="#061224"/>
  <rect x="0" y="153" width="300" height="3"  fill="#0d2340" opacity=".5"/>
  <!-- Road/path — movement: leads toward pit, perspective -->
  <path d="M0 200 Q80 160 150 155 Q220 160 300 200"
        fill="none" stroke="#0d2340" stroke-width="3" opacity=".5"/>
  <!-- Motion lines — movement, rhythm: king running -->
  <line x1="200" y1="90"  x2="240" y2="86"  stroke="#4ECDC4" stroke-width="1.5" opacity=".3" stroke-dasharray="6,4"/>
  <line x1="200" y1="100" x2="248" y2="96"  stroke="#4ECDC4" stroke-width="1"   opacity=".2" stroke-dasharray="6,4"/>
  <line x1="200" y1="110" x2="244" y2="108" stroke="#4ECDC4" stroke-width="1.5" opacity=".3" stroke-dasharray="6,4"/>
  <!-- Running figure: Darius — emphasis, movement: leaning forward, diagonal -->
  <!-- Trailing robe — movement: swept back by speed -->
  <path d="M200 115 Q220 125 250 135 Q270 138 280 130"
        fill="#2a6e5a" stroke="#0A0812" stroke-width="2" opacity=".7"/>
  <!-- Body torso, angled forward -->
  <rect x="142" y="90"  width="60"  height="50"
        fill="#2a6e5a" stroke="#0A0812" stroke-width="2.5"
        transform="rotate(-10 172 115)"/>
  <!-- Legs running — variety: stride -->
  <line x1="160" y1="140" x2="132" y2="165" stroke="#2a6e5a" stroke-width="12" stroke-linecap="round"/>
  <line x1="178" y1="140" x2="198" y2="158" stroke="#2a6e5a" stroke-width="12" stroke-linecap="round"/>
  <!-- Head — hierarchy -->
  <circle cx="152" cy="72"  r="26" fill="#D4B896" stroke="#0A0812" stroke-width="3.5"/>
  <path d="M126 64 Q152 48 178 64" fill="none" stroke="#8a6a3a" stroke-width="9" stroke-linecap="round"/>
  <!-- Eyes wide open — variety: urgency -->
  <circle cx="144" cy="70"  r="4"  fill="#0A0812"/>
  <circle cx="160" cy="70"  r="4"  fill="#0A0812"/>
  <circle cx="145" cy="69"  r="1.5" fill="white" opacity=".7"/>
  <circle cx="161" cy="69"  r="1.5" fill="white" opacity=".7"/>
  <!-- Outstretched arm reaching forward — movement: pointing to den -->
  <path d="M142 100 Q116 88 90 80" fill="none" stroke="#D4B896" stroke-width="12" stroke-linecap="round"/>
  <circle cx="87"  cy="78"  r="7" fill="#D4B896" stroke="#0A0812" stroke-width="2"/>
</svg>
