<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dariusGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%"   stop-color="#4ECDC4" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="#061224"/>
  <!-- Ground -->
  <rect x="0" y="157" width="300" height="43" fill="#030b18"/>
  <rect x="0" y="155" width="300" height="3" fill="#0d2340" opacity=".5"/>
  <!-- Floor tiles — pattern -->
  <line x1="75"  y1="155" x2="75"  y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="150" y1="155" x2="150" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="225" y1="155" x2="225" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <!-- Column partial — hierarchy: places scene in palace -->
  <rect x="0"   y="30" width="18" height="128" fill="#1b4965" stroke="#0A0812" stroke-width="2" opacity=".8"/>
  <rect x="272" y="30" width="28" height="128" fill="#1b4965" stroke="#0A0812" stroke-width="2" opacity=".6"/>
  <!-- Anguish glow — emphasis: emotional atmosphere -->
  <ellipse cx="150" cy="100" rx="90" ry="70" fill="url(#dariusGlow)"/>
  <!-- Darius figure — emphasis: centred, expressive -->
  <!-- Body -->
  <rect x="118" y="105" width="64" height="50" fill="#2a6e5a" stroke="#0A0812" stroke-width="3"/>
  <path d="M118 105 L94 157" stroke="#2a6e5a" stroke-width="11" stroke-linecap="round"/>
  <path d="M182 105 L206 157" stroke="#2a6e5a" stroke-width="11" stroke-linecap="round"/>
  <!-- Head — proportion: large, expressive -->
  <circle cx="150" cy="72"  r="30" fill="#D4B896" stroke="#0A0812" stroke-width="3.5"/>
  <!-- Crown/hair — hierarchy: king marker -->
  <path d="M120 62 Q135 48 150 56 Q165 48 180 62" fill="none" stroke="#8a6a3a" stroke-width="11" stroke-linecap="round"/>
  <path d="M122 56 Q136 42 150 50 Q164 42 178 56" fill="none" stroke="#FFD84D" stroke-width="4" opacity=".4"/>
  <!-- Eyes — anguish expression: wide, worried -->
  <circle cx="140" cy="70"  r="5"  fill="#0A0812"/>
  <circle cx="160" cy="70"  r="5"  fill="#0A0812"/>
  <circle cx="141" cy="69"  r="2"  fill="white" opacity=".6"/>
  <circle cx="161" cy="69"  r="2"  fill="white" opacity=".6"/>
  <!-- Brow lines — variety: expressive worry -->
  <path d="M130 62 Q136 56 142 62" fill="none" stroke="#0A0812" stroke-width="2.5"/>
  <path d="M158 62 Q164 56 170 62" fill="none" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Mouth open in distress — variety -->
  <path d="M138 84 Q150 94 162 84" fill="#0A0812" stroke="#0A0812" stroke-width="2"/>
  <!-- Hands raised to head — movement, balance -->
  <path d="M118 110 Q96 90 80 78"  fill="none" stroke="#D4B896" stroke-width="12" stroke-linecap="round"/>
  <path d="M182 110 Q204 90 220 78" fill="none" stroke="#D4B896" stroke-width="12" stroke-linecap="round"/>
</svg>
