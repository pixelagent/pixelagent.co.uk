<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="prayGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%"   stop-color="#FFD84D" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="#1e0f0a"/>
  <!-- Night sky — white space -->
  <circle cx="220" cy="22" r="10" fill="#FFD84D" opacity=".12"/>
  <circle cx="220" cy="22" r="6"  fill="#FFD84D" opacity=".2"/>
  <circle cx="220" cy="22" r="3"  fill="#FFD84D" opacity=".9"/>
  <!-- Stars — rhythm -->
  <circle cx="30"  cy="14" r="1.2" fill="white" opacity=".7"/>
  <circle cx="70"  cy="8"  r="1"   fill="white" opacity=".6"/>
  <circle cx="110" cy="18" r="1.5" fill="white" opacity=".5"/>
  <circle cx="160" cy="10" r="1"   fill="white" opacity=".6"/>
  <circle cx="260" cy="18" r="1.2" fill="white" opacity=".5"/>
  <circle cx="280" cy="8"  r="1"   fill="white" opacity=".4"/>
  <!-- Ground — proportion -->
  <rect x="0" y="155" width="300" height="45" fill="#1a0e06"/>
  <rect x="0" y="153" width="300" height="3"  fill="#3a1e08" opacity=".5"/>
  <!-- Kneeling figure — emphasis, hierarchy: single subject, centred-left for white space -->
  <!-- Prayer glow -->
  <ellipse cx="120" cy="110" rx="55" ry="50" fill="url(#prayGlow)"/>
  <!-- Torso/robe kneeling -->
  <rect x="90" y="100" width="60" height="55" fill="#3a5a8c" stroke="#0A0812" stroke-width="2.5" rx="4"/>
  <!-- Head -->
  <circle cx="120" cy="82" r="20" fill="#C8956C" stroke="#0A0812" stroke-width="3"/>
  <path d="M100 74 Q120 60 140 74" fill="none" stroke="#2a1a0a" stroke-width="7" stroke-linecap="round"/>
  <!-- Eyes closed — variety -->
  <path d="M112 82 Q116 80 120 82" fill="none" stroke="#0A0812" stroke-width="2"/>
  <path d="M120 82 Q124 80 128 82" fill="none" stroke="#0A0812" stroke-width="2"/>
  <!-- Arms outstretched forward — movement, proportion -->
  <path d="M90 110 Q60 118 44 128" fill="none" stroke="#C8956C" stroke-width="10" stroke-linecap="round"/>
  <path d="M150 110 Q176 118 192 128" fill="none" stroke="#C8956C" stroke-width="10" stroke-linecap="round"/>
  <!-- Knees on ground — balance -->
  <ellipse cx="100" cy="156" rx="14" ry="6" fill="#3a5a8c" stroke="#0A0812" stroke-width="2"/>
  <ellipse cx="138" cy="156" rx="14" ry="6" fill="#3a5a8c" stroke="#0A0812" stroke-width="2"/>
  <!-- Rising light beam — movement, contrast: bright on dark, draws eye upward -->
  <line x1="120" y1="62" x2="120" y2="12" stroke="#FFD84D" stroke-width="2.5" stroke-dasharray="5,4" opacity=".7"/>
  <line x1="116" y1="56" x2="108" y2="20" stroke="#FFD84D" stroke-width="1"   stroke-dasharray="3,5" opacity=".4"/>
  <line x1="124" y1="56" x2="132" y2="20" stroke="#FFD84D" stroke-width="1"   stroke-dasharray="3,5" opacity=".4"/>
  <!-- Right side: open space — white space, balance -->
  <rect x="222" y="40" width="50" height="80" fill="#2a1808" stroke="#0A0812" stroke-width="1.5" opacity=".5"/>
  <rect x="228" y="46" width="8"  height="12" fill="#FFD84D" opacity=".3"/>
  <rect x="242" y="46" width="8"  height="12" fill="#FFD84D" opacity=".2"/>
</svg>
