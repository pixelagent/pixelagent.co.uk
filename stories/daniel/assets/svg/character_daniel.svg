  <path d="M72 44 Q66 50 70 56" fill="none" stroke="#a0704a" stroke-width="2" opacity=".4"/>
  <!-- Eyes — emphasis: alert, determined -->
  <circle cx="40" cy="42" r="4.5" fill="#0A0812"/>
  <circle cx="60" cy="42" r="4.5" fill="#0A0812"/>
  <circle cx="41" cy="41" r="1.5" fill="white" opacity=".6"/>
  <circle cx="61" cy="41" r="1.5" fill="white" opacity=".6"/>
  <!-- Slight smile — variety: calm confidence -->
  <path d="M41 56 Q50 63 59 56" fill="none" stroke="#0A0812" stroke-width="2.5" stroke-linecap="round"/>
</svg>
