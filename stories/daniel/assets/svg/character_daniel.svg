  <path d="M44 78 L50 100 L56 78" fill="#FFD84D" stroke="#0A0812" stroke-width="2"/>
  <!-- Robe folds — rhythm, variety -->
  <line x1="36" y1="80" x2="32" y2="100" stroke="#0A0812" stroke-width="1" opacity=".4"/>
  <line x1="64" y1="80" x2="68" y2="100" stroke="#0A0812" stroke-width="1" opacity=".4"/>
  <!-- Shoulders/neck collar — hierarchy, proportion -->
  <path d="M28 68 Q50 60 72 68 L72 78 Q50 72 28 78 Z" fill="#4a6a9c" stroke="#0A0812" stroke-width="2"/>
  <!-- Head — emphasis: centred, large -->
