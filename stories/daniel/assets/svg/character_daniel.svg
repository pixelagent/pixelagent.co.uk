  <!-- Hair — variety: dark, swept back -->
  <path d="M22 36 Q50 14 78 36" fill="none" stroke="#1a0e04" stroke-width="10" stroke-linecap="round"/>
  <!-- Cheekbone shadow — proportion, depth -->
