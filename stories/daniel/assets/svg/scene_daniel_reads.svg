<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="readGlow" cx="70%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#B98CFF" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#B98CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="#160a14"/>
  <!-- Ground -->
  <rect x="0" y="158" width="300" height="42" fill="#0a0510"/>
  <rect x="0" y="156" width="300" height="3"  fill="#2a0e28" opacity=".5"/>
  <!-- Wall panel with inscription — hierarchy: occupies left half, tall -->
  <rect x="14"  y="14"  width="148" height="134" fill="#1e0a1e" stroke="#B98CFF" stroke-width="2.5" rx="3"/>
  <rect x="20"  y="20"  width="136" height="122" fill="none"   stroke="#B98CFF" stroke-width="1" opacity=".3"/>
  <!-- Stone block lines — pattern -->
  <line x1="14" y1="56"  x2="162" y2="56"  stroke="#0A0812" stroke-width="1.5" opacity=".4"/>
  <line x1="14" y1="98"  x2="162" y2="98"  stroke="#0A0812" stroke-width="1.5" opacity=".4"/>
  <line x1="14" y1="108" x2="162" y2="108" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <!-- Writing glows -->
  <ellipse cx="88" cy="80" rx="60" ry="50" fill="url(#readGlow)"/>
  <!-- The three words — contrast: gold on dark -->
  <text x="88" y="52"  font-size="20" fill="#FFD84D" text-anchor="middle" font-family="serif" font-weight="bold">מְנֵא</text>
  <text x="88" y="86"  font-size="20" fill="#FFD84D" text-anchor="middle" font-family="serif" font-weight="bold">תְּקֵל</text>
  <text x="88" y="120" font-size="20" fill="#FFD84D" text-anchor="middle" font-family="serif" font-weight="bold">פְּרֵס</text>
  <!-- Daniel — emphasis: right side, proportionally fills remaining space -->
  <!-- Body -->
  <rect x="180" y="98"  width="40"  height="58" fill="#3a5a8c" stroke="#0A0812" stroke-width="2.5"/>
  <path d="M180 98 L160 158" stroke="#3a5a8c" stroke-width="10" stroke-linecap="round"/>
  <path d="M220 98 L240 158" stroke="#3a5a8c" stroke-width="10" stroke-linecap="round"/>
  <!-- Head — old Daniel: white hair -->
  <circle cx="200" cy="74"  r="24" fill="#C8956C" stroke="#0A0812" stroke-width="3"/>
  <path d="M176 66 Q200 50 224 66" fill="none" stroke="#e8e8e8" stroke-width="9" stroke-linecap="round"/>
  <path d="M180 72 Q195 64 200 68 Q205 64 220 72" fill="none" stroke="#d0d0d0" stroke-width="4" opacity=".5"/>
  <circle cx="192" cy="72"  r="3.5" fill="#0A0812"/>
  <circle cx="208" cy="72"  r="3.5" fill="#0A0812"/>
  <!-- Pointing arm — movement: gesture toward inscription -->
  <path d="M180 102 Q156 88 140 78" fill="none" stroke="#C8956C" stroke-width="10" stroke-linecap="round"/>
  <circle cx="138" cy="76"  r="6" fill="#C8956C" stroke="#0A0812" stroke-width="2"/>
</svg>
