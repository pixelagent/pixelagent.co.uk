<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="persianBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#030a18"/>
      <stop offset="100%" stop-color="#0a1e38"/>
    </linearGradient>
    <radialGradient id="throneAura" cx="50%" cy="60%" r="40%">
      <stop offset="0%"   stop-color="#4ECDC4" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#persianBg)"/>
  <!-- Night sky — white space, stars -->
  <circle cx="240" cy="16" r="4"   fill="#4ECDC4" opacity=".7"/>
  <circle cx="240" cy="16" r="8"   fill="#4ECDC4" opacity=".1"/>
  <circle cx="40"  cy="12" r="1.5" fill="white"   opacity=".6"/>
  <circle cx="80"  cy="22" r="1"   fill="white"   opacity=".5"/>
  <circle cx="120" cy="10" r="1.5" fill="white"   opacity=".7"/>
  <circle cx="180" cy="18" r="1"   fill="white"   opacity=".5"/>
  <circle cx="270" cy="25" r="1.5" fill="white"   opacity=".4"/>
  <!-- Floor — proportion -->
  <rect x="0" y="156" width="300" height="44" fill="#061224"/>
  <rect x="0" y="154" width="300" height="3"  fill="#0d2340" opacity=".6"/>
  <!-- Tiled floor — pattern, perspective lines -->
  <line x1="0"  y1="175" x2="300" y2="175" stroke="#0A0812" stroke-width="1" opacity=".5"/>
  <line x1="0"  y1="156" x2="150" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="75" y1="156" x2="150" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="150" y1="156" x2="150" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="225" y1="156" x2="150" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="300" y1="156" x2="150" y2="200" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <!-- Columns — repetition, rhythm: teal-accented Persian style -->
  <rect x="8"   y="36" width="18" height="120" fill="#1b4965" stroke="#0A0812" stroke-width="2"/>
  <rect x="6"   y="32" width="22" height="10"  fill="#4ECDC4" opacity=".4" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="46"  y="36" width="16" height="120" fill="#1b4965" stroke="#0A0812" stroke-width="2"/>
  <rect x="44"  y="32" width="20" height="10"  fill="#4ECDC4" opacity=".4" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="238" y="36" width="16" height="120" fill="#1b4965" stroke="#0A0812" stroke-width="2"/>
  <rect x="236" y="32" width="20" height="10"  fill="#4ECDC4" opacity=".4" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="276" y="36" width="18" height="120" fill="#1b4965" stroke="#0A0812" stroke-width="2"/>
  <rect x="274" y="32" width="22" height="10"  fill="#4ECDC4" opacity=".4" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Frieze — unity: horizontal band ties columns together -->
  <rect x="0" y="32" width="300" height="7" fill="#4ECDC4" opacity=".2"/>
  <!-- Throne aura — emphasis -->
  <ellipse cx="150" cy="115" rx="70" ry="55" fill="url(#throneAura)"/>
  <!-- Throne platform — hierarchy, proportion -->
  <rect x="82"  y="118" width="136" height="12" fill="#0d2340" stroke="#4ECDC4" stroke-width="1.5"/>
  <rect x="92"  y="106" width="116" height="14" fill="#1b4965" stroke="#4ECDC4" stroke-width="1.5"/>
  <!-- Throne — emphasis: Persian style, angular -->
  <rect x="110" y="60"  width="80"  height="48"  fill="#061224" stroke="#4ECDC4" stroke-width="2"/>
  <polygon points="110,60 150,36 190,60" fill="#0d2340" stroke="#4ECDC4" stroke-width="2"/>
  <!-- Throne ornament — variety -->
  <rect x="118" y="72" width="20"  height="7"  fill="#4ECDC4" opacity=".4"/>
  <rect x="162" y="72" width="20"  height="7"  fill="#4ECDC4" opacity=".4"/>
  <rect x="128" y="84" width="44"  height="5"  fill="#FFD84D" opacity=".3"/>
</svg>
