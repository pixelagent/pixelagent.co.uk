<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="denGlow" cx="50%" cy="68%" r="50%">
      <stop offset="0%"   stop-color="#4ECDC4" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="#061224"/>
  <!-- Night sky — white space, stars -->
  <circle cx="260" cy="18" r="2"   fill="white"   opacity=".6"/>
  <circle cx="30"  cy="14" r="1.5" fill="#4ECDC4" opacity=".7"/>
  <circle cx="80"  cy="22" r="1"   fill="white"   opacity=".5"/>
  <circle cx="150" cy="10" r="1.5" fill="white"   opacity=".6"/>
  <circle cx="200" cy="20" r="1"   fill="#4ECDC4" opacity=".5"/>
  <!-- Ground plane above pit — proportion: upper 55% -->
  <rect x="0" y="110" width="300" height="18" fill="#1b4965" stroke="#0A0812" stroke-width="3"/>
  <!-- Stone surface texture — pattern -->
  <line x1="60"  y1="110" x2="60"  y2="128" stroke="#0A0812" stroke-width="1.5" opacity=".5"/>
  <line x1="120" y1="110" x2="120" y2="128" stroke="#0A0812" stroke-width="1.5" opacity=".5"/>
  <line x1="180" y1="110" x2="180" y2="128" stroke="#0A0812" stroke-width="1.5" opacity=".5"/>
  <line x1="240" y1="110" x2="240" y2="128" stroke="#0A0812" stroke-width="1.5" opacity=".5"/>
  <!-- Pit opening — emphasis: circular void, high contrast -->
  <ellipse cx="150" cy="120" rx="108" ry="28" fill="#030b18" stroke="#4ECDC4" stroke-width="3"/>
  <!-- Pit interior — hierarchy -->
  <ellipse cx="150" cy="124" rx="104" ry="24" fill="#040d1c"/>
  <!-- Den glow — atmosphere: moonlight or fire in the pit -->
  <ellipse cx="150" cy="150" rx="100" ry="50" fill="url(#denGlow)"/>
  <!-- Two lions in pit — balance: left & right, variety: different angles -->
  <!-- Lion L -->
  <ellipse cx="90"  cy="162" rx="32" ry="16" fill="#8b6010" stroke="#0A0812" stroke-width="2"/>
  <circle  cx="68"  cy="152" r="16" fill="#a07020" stroke="#0A0812" stroke-width="2"/>
  <!-- Mane — variety: circular strokes -->
  <circle  cx="68"  cy="152" r="22" fill="none" stroke="#5a3a08" stroke-width="5" opacity=".6"/>
  <!-- Lion eyes — emphasis: gold on dark -->
  <circle  cx="62"  cy="150" r="4"  fill="#FFD84D"/>
  <circle  cx="74"  cy="150" r="4"  fill="#FFD84D"/>
  <!-- Lion R -->
  <ellipse cx="210" cy="164" rx="32" ry="16" fill="#8b6010" stroke="#0A0812" stroke-width="2"/>
  <circle  cx="232" cy="154" r="16" fill="#a07020" stroke="#0A0812" stroke-width="2"/>
  <circle  cx="232" cy="154" r="22" fill="none" stroke="#5a3a08" stroke-width="5" opacity=".6"/>
  <circle  cx="226" cy="152" r="4"  fill="#FFD84D"/>
  <circle  cx="238" cy="152" r="4"  fill="#FFD84D"/>
  <!-- Sealed stone label — hierarchy, emphasis -->
  <rect x="96"  y="94"  width="108" height="22" fill="#1b4965" stroke="#4ECDC4" stroke-width="2" rx="2"/>
  <text x="150" y="109" font-size="9" fill="#4ECDC4" text-anchor="middle" font-family="monospace" font-weight="bold">SEALED · DARIUS</text>
</svg>
