<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="angelLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%"   stop-color="#4ECDC4" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="openGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%"   stop-color="#FFD84D" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="#061224"/>
  <!-- Pre-dawn sky — white space, balance -->
  <circle cx="152" cy="18" r="14"  fill="#4ECDC4" opacity=".08"/>
  <circle cx="152" cy="18" r="8"   fill="#4ECDC4" opacity=".14"/>
  <circle cx="152" cy="18" r="3.5" fill="#4ECDC4" opacity=".9"/>
  <circle cx="40"  cy="14" r="1.5" fill="white" opacity=".6"/>
  <circle cx="100" cy="8"  r="1"   fill="white" opacity=".5"/>
  <circle cx="220" cy="12" r="1.5" fill="white" opacity=".6"/>
  <circle cx="270" cy="22" r="1"   fill="white" opacity=".4"/>
  <!-- Pit frame — hierarchy, proportion -->
  <rect x="0" y="118" width="300" height="20" fill="#1b4965" stroke="#0A0812" stroke-width="3"/>
  <!-- Pit opening — emphasis: open now, teal glow -->
  <ellipse cx="150" cy="130" rx="108" ry="26" fill="#030b18" stroke="#4ECDC4" stroke-width="3"/>
  <ellipse cx="150" cy="134" rx="104" ry="22" fill="#040d1c"/>
  <!-- Pit angel light — emphasis, contrast -->
  <ellipse cx="150" cy="150" rx="90" ry="50" fill="url(#openGlow)"/>
  <!-- Lions — subdued, heads low — balance, variety: contrast to sealed scene -->
  <!-- Lion L — head down, variety -->
  <ellipse cx="72"  cy="168" rx="30" ry="14" fill="#6b4a0a" stroke="#0A0812" stroke-width="2"/>
  <circle  cx="52"  cy="160" r="14" fill="#8b6010" stroke="#0A0812" stroke-width="2"/>
  <circle  cx="52"  cy="160" r="20" fill="none" stroke="#4a2a04" stroke-width="4" opacity=".5"/>
  <!-- Eyes closed/peaceful — variety -->
  <path d="M46 160 Q52 158 58 160" fill="none" stroke="#0A0812" stroke-width="2"/>
  <!-- Lion R -->
  <ellipse cx="228" cy="168" rx="30" ry="14" fill="#6b4a0a" stroke="#0A0812" stroke-width="2"/>
  <circle  cx="248" cy="160" r="14" fill="#8b6010" stroke="#0A0812" stroke-width="2"/>
  <circle  cx="248" cy="160" r="20" fill="none" stroke="#4a2a04" stroke-width="4" opacity=".5"/>
  <path d="M242 160 Q248 158 254 160" fill="none" stroke="#0A0812" stroke-width="2"/>
  <!-- Angel light beam in pit — movement, hierarchy -->
  <ellipse cx="150" cy="108" rx="50" ry="60" fill="url(#angelLight)"/>
  <line x1="152" y1="18"  x2="152" y2="105" stroke="#4ECDC4" stroke-width="2" stroke-dasharray="5,4" opacity=".6"/>
  <!-- Daniel figure emerging — emphasis: centre, upright, lifted -->
  <circle cx="150" cy="60" r="28" fill="#C8956C" stroke="#0A0812" stroke-width="3.5"/>
  <!-- Young-ish hair — variety -->
  <path d="M122 52 Q150 36 178 52" fill="none" stroke="#2a1a0a" stroke-width="8" stroke-linecap="round"/>
  <!-- Big smile -->
  <path d="M136 70 Q150 82 164 70" fill="none" stroke="#0A0812" stroke-width="3" stroke-linecap="round"/>
  <circle cx="140" cy="57" r="4"   fill="#0A0812"/>
  <circle cx="160" cy="57" r="4"   fill="#0A0812"/>
  <!-- Body — robe, arms up in joy — movement -->
  <rect x="128" y="88"  width="44" height="68" fill="#3a5a8c" stroke="#0A0812" stroke-width="3"/>
  <path d="M128 92 Q96  72 82  56"  fill="none" stroke="#C8956C" stroke-width="12" stroke-linecap="round"/>
  <path d="M172 92 Q204 72 218 56"  fill="none" stroke="#C8956C" stroke-width="12" stroke-linecap="round"/>
</svg>
