<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="godInnerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD84D" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer aura rings — rhythm, emphasis: radiating light -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#FFD84D" stroke-width="1" opacity=".2"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#FFD84D" stroke-width="1" opacity=".3"/>
  <!-- Cloud/glory form — variety: organic, otherworldly -->
  <path d="M18 52 Q8 30 34 34 Q48 12 68 28 Q88 22 84 50 Q96 72 74 76 Q50 92 28 76 Q4 70 18 52 Z"
        fill="#FFD84D" stroke="#0A0812" stroke-width="3.5"/>
  <!-- Inner glow -->
  <ellipse cx="50" cy="52" rx="26" ry="22" fill="url(#godInnerGlow)"/>
  <!-- Light rays — movement, rhythm -->
  <line x1="50" y1="12" x2="50" y2="4"  stroke="#FFD84D" stroke-width="2.5" opacity=".6"/>
  <line x1="72" y1="20" x2="78" y2="14" stroke="#FFD84D" stroke-width="2"   opacity=".5"/>
  <line x1="84" y1="42" x2="92" y2="40" stroke="#FFD84D" stroke-width="2"   opacity=".5"/>
  <line x1="28" y1="20" x2="22" y2="14" stroke="#FFD84D" stroke-width="2"   opacity=".5"/>
  <line x1="16" y1="42" x2="8"  y2="40" stroke="#FFD84D" stroke-width="2"   opacity=".5"/>
  <!-- Expression: closed eyes — variety: serene, all-knowing -->
  <path d="M28 52 Q38 44 44 50" fill="none" stroke="#0A0812" stroke-width="3.5"/>
  <path d="M72 52 Q62 44 56 50" fill="none" stroke="#0A0812" stroke-width="3.5"/>
  <!-- Mouth — wide, joyful smile -->
  <path d="M32 68 Q50 80 68 68" fill="none" stroke="#0A0812" stroke-width="4.5" stroke-linecap="round"/>
</svg>
