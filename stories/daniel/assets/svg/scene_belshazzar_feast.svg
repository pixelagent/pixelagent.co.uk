<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="feastBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0510"/>
      <stop offset="100%" stop-color="#1a0820"/>
    </linearGradient>
    <radialGradient id="tableLight" cx="50%" cy="80%" r="60%">
      <stop offset="0%"   stop-color="#B98CFF" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#B98CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#feastBg)"/>
  <!-- Ambient glow from table — emphasis, hierarchy -->
  <ellipse cx="150" cy="160" rx="130" ry="50" fill="url(#tableLight)"/>
  <!-- Background arch — hierarchy, variety -->
  <path d="M0 80 Q150 30 300 80 L300 60 Q150 10 0 60 Z" fill="#1e0830" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Hanging tapestries — balance, rhythm, pattern -->
  <rect x="12"  y="10" width="28" height="80" fill="#4a1f35" stroke="#0A0812" stroke-width="1.5" rx="2"/>
  <line x1="12" y1="30" x2="40" y2="30" stroke="#B98CFF" stroke-width="1" opacity=".4"/>
  <line x1="12" y1="50" x2="40" y2="50" stroke="#B98CFF" stroke-width="1" opacity=".4"/>
  <line x1="12" y1="70" x2="40" y2="70" stroke="#B98CFF" stroke-width="1" opacity=".4"/>
  <rect x="260" y="10" width="28" height="80" fill="#4a1f35" stroke="#0A0812" stroke-width="1.5" rx="2"/>
  <line x1="260" y1="30" x2="288" y2="30" stroke="#B98CFF" stroke-width="1" opacity=".4"/>
  <line x1="260" y1="50" x2="288" y2="50" stroke="#B98CFF" stroke-width="1" opacity=".4"/>
  <line x1="260" y1="70" x2="288" y2="70" stroke="#B98CFF" stroke-width="1" opacity=".4"/>
  <!-- Long banquet table — proportion, emphasis -->
  <rect x="14"  y="118" width="272" height="16" fill="#3a1428" stroke="#0A0812" stroke-width="2.5" rx="3"/>
  <rect x="22"  y="132" width="14"  height="50" fill="#2a0e1e" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="264" y="132" width="14"  height="50" fill="#2a0e1e" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Chalices — variety, rhythm, emphasis: the stolen temple vessels -->
  <!-- Chalice 1 -->
  <rect x="48"  y="92"  width="8"  height="28" fill="#c8a45a" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="52" cy="92"  rx="13" ry="5" fill="#FFD84D" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="52" cy="118" rx="9"  ry="3.5" fill="#c8a45a" stroke="#0A0812" stroke-width="1"/>
  <!-- Chalice 2 — larger, centred, emphasis -->
  <rect x="96"  y="84"  width="10" height="36" fill="#c8a45a" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="101" cy="84"  rx="16" ry="6" fill="#FFD84D" stroke="#0A0812" stroke-width="2"/>
  <ellipse cx="101" cy="118" rx="10" ry="4"  fill="#c8a45a" stroke="#0A0812" stroke-width="1"/>
  <!-- Chalice 3 — purple, variety -->
  <rect x="148" y="88"  width="8"  height="32" fill="#9a6ae0" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="152" cy="88"  rx="13" ry="5" fill="#B98CFF" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="152" cy="118" rx="9"  ry="3.5" fill="#9a6ae0" stroke="#0A0812" stroke-width="1"/>
  <!-- Chalice 4 -->
  <rect x="198" y="90"  width="8"  height="30" fill="#c8a45a" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="202" cy="90"  rx="13" ry="5" fill="#FFD84D" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="202" cy="118" rx="9"  ry="3.5" fill="#c8a45a" stroke="#0A0812" stroke-width="1"/>
  <!-- Chalice 5 -->
  <rect x="242" y="92"  width="8"  height="28" fill="#9a6ae0" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="246" cy="92"  rx="12" ry="4.5" fill="#B98CFF" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="246" cy="118" rx="8"  ry="3"   fill="#9a6ae0" stroke="#0A0812" stroke-width="1"/>
  <!-- Candle cluster centre — hierarchy: central light source -->
  <rect x="144" y="60"  width="4"  height="30" fill="#c8a45a" stroke="#0A0812" stroke-width="1"/>
  <rect x="150" y="52"  width="4"  height="38" fill="#c8a45a" stroke="#0A0812" stroke-width="1"/>
  <rect x="156" y="60"  width="4"  height="30" fill="#c8a45a" stroke="#0A0812" stroke-width="1"/>
  <circle cx="146" cy="58"  r="4" fill="#FFD84D" opacity=".9"/>
  <circle cx="152" cy="50"  r="5" fill="#FFD84D" opacity=".95"/>
  <circle cx="158" cy="58"  r="4" fill="#FFD84D" opacity=".9"/>
</svg>
