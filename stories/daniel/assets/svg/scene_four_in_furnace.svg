<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="angelGlow" cx="65%" cy="40%" r="40%">
      <stop offset="0%"   stop-color="#FFD84D" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="#1a0700"/>
  <!-- Furnace walls — hierarchy -->
  <rect x="16"  y="18" width="268" height="168" fill="#3d1200" stroke="#0A0812" stroke-width="4"/>
  <!-- Brickwork — pattern -->
  <line x1="16" y1="60"  x2="284" y2="60"  stroke="#0A0812" stroke-width="1.5" opacity=".4"/>
  <line x1="16" y1="100" x2="284" y2="100" stroke="#0A0812" stroke-width="1.5" opacity=".4"/>
  <line x1="16" y1="140" x2="284" y2="140" stroke="#0A0812" stroke-width="1.5" opacity=".4"/>
  <line x1="80"  y1="18" x2="80"  y2="186" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="160" y1="18" x2="160" y2="186" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <line x1="224" y1="18" x2="224" y2="186" stroke="#0A0812" stroke-width="1" opacity=".3"/>
  <!-- Background flames — depth, balance -->
  <polygon points="16,186 40,120 64,158 88,100 112,140 136,76 160,140 184,100 208,158 232,120 256,186"
           fill="#FF4500" opacity=".7"/>
  <polygon points="30,186 52,136 76,160 96,112 116,148 136,92 156,148 176,112 200,160 224,136 246,186"
           fill="#FF6B5B" opacity=".8"/>
  <!-- Angel 4th figure glow — emphasis: brightest point, draws the eye -->
  <ellipse cx="210" cy="90" rx="42" ry="52" fill="url(#angelGlow)"/>
  <!-- Three figures — balance: left-grouped trio vs singular right figure -->
  <!-- Figure 1 -->
  <circle cx="68"  cy="74"  r="16" fill="#C8956C" stroke="#0A0812" stroke-width="2.5"/>
  <rect x="52"  y="90"  width="32" height="70" fill="#4ECDC4" stroke="#0A0812" stroke-width="2"/>
  <!-- Figure 2 -->
  <circle cx="118" cy="70"  r="16" fill="#C8956C" stroke="#0A0812" stroke-width="2.5"/>
  <rect x="102" y="86"  width="32" height="74" fill="#38a3a5" stroke="#0A0812" stroke-width="2"/>
  <!-- Figure 3 -->
  <circle cx="168" cy="74"  r="16" fill="#D4A574" stroke="#0A0812" stroke-width="2.5"/>
  <rect x="152" y="90"  width="32" height="70" fill="#4ECDC4" stroke="#0A0812" stroke-width="2"/>
  <!-- Angel/4th figure — emphasis, variety: gold, isolated right, brightest -->
  <circle cx="222" cy="62"  r="20" fill="#FFD84D" stroke="#0A0812" stroke-width="3"/>
  <rect x="204" y="82"  width="36" height="78" fill="#FFD84D" stroke="#0A0812" stroke-width="2.5" opacity=".85"/>
  <!-- Wings — variety: distinctive shape, hierarchy -->
  <path d="M204 90 Q180 70 185 110 Q195 98 204 102" fill="#FFD84D" stroke="#0A0812" stroke-width="1.5" opacity=".8"/>
  <path d="M240 90 Q264 70 259 110 Q249 98 240 102" fill="#FFD84D" stroke="#0A0812" stroke-width="1.5" opacity=".8"/>
  <!-- Foreground flames — movement: over figures, immersive -->
  <polygon points="16,186 36,150 52,170 72,130 92,158"   fill="#FF6B5B" opacity=".35"/>
  <polygon points="220,186 244,155 260,174 278,142 284,186" fill="#FF6B5B" opacity=".35"/>
</svg>
