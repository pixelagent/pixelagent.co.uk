<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tableG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="100%" stop-color="#5c3a18"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="#2b1d0c"/>
  <!-- Tapestry backdrop — hierarchy: decorative bg layer -->
  <rect x="20" y="10" width="260" height="120" fill="#3a1e0a" stroke="#0A0812" stroke-width="2"/>
  <rect x="26" y="16" width="248" height="108" fill="none" stroke="#FFD84D" stroke-width="1" opacity=".3"/>
  <!-- Tapestry pattern — pattern, repetition -->
  <rect x="40"  y="26" width="18" height="28" fill="#FF6B5B" opacity=".15" rx="2"/>
  <rect x="70"  y="26" width="18" height="28" fill="#FFD84D" opacity=".12" rx="2"/>
  <rect x="100" y="26" width="18" height="28" fill="#FF6B5B" opacity=".15" rx="2"/>
  <rect x="130" y="26" width="18" height="28" fill="#FFD84D" opacity=".12" rx="2"/>
  <rect x="160" y="26" width="18" height="28" fill="#FF6B5B" opacity=".15" rx="2"/>
  <rect x="190" y="26" width="18" height="28" fill="#FFD84D" opacity=".12" rx="2"/>
  <rect x="220" y="26" width="18" height="28" fill="#FF6B5B" opacity=".15" rx="2"/>
  <rect x="250" y="26" width="18" height="28" fill="#FFD84D" opacity=".12" rx="2"/>
  <!-- Table surface — emphasis: the centrepiece -->
  <rect x="22"  y="110" width="256" height="18" fill="url(#tableG)" stroke="#0A0812" stroke-width="3" rx="3"/>
  <!-- Table legs — balance: symmetrical -->
  <rect x="30"  y="126" width="14" height="52" fill="#5c3a18" stroke="#0A0812" stroke-width="2"/>
  <rect x="256" y="126" width="14" height="52" fill="#5c3a18" stroke="#0A0812" stroke-width="2"/>
  <rect x="110" y="126" width="10" height="40" fill="#4a2e14" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="180" y="126" width="10" height="40" fill="#4a2e14" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Gold chalices — variety, proportion: tall slender forms contrast with round plates -->
  <rect x="46"  y="88"  width="8"  height="24" fill="#c8a45a" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="50"  cy="88"  rx="12" ry="5"  fill="#FFD84D" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="50"  cy="108" rx="8"  ry="3"  fill="#c8a45a" stroke="#0A0812" stroke-width="1"/>
  <rect x="96"  y="82"  width="8"  height="30" fill="#c8a45a" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="100" cy="82"  rx="12" ry="5"  fill="#FFD84D" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="100" cy="108" rx="8"  ry="3"  fill="#c8a45a" stroke="#0A0812" stroke-width="1"/>
  <rect x="196" y="82"  width="8"  height="30" fill="#c8a45a" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="200" cy="82"  rx="12" ry="5"  fill="#FFD84D" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="200" cy="108" rx="8"  ry="3"  fill="#c8a45a" stroke="#0A0812" stroke-width="1"/>
  <rect x="244" y="88"  width="8"  height="24" fill="#c8a45a" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="248" cy="88"  rx="12" ry="5"  fill="#FFD84D" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="248" cy="108" rx="8"  ry="3"  fill="#c8a45a" stroke="#0A0812" stroke-width="1"/>
  <!-- Plates/food — pattern: alternating -->
  <ellipse cx="75"  cy="108" rx="16" ry="5"  fill="#FF6B5B" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="150" cy="108" rx="20" ry="6"  fill="#FF6B5B" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="225" cy="108" rx="16" ry="5"  fill="#FF6B5B" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Candelabra centre — emphasis: tallest centred object -->
  <rect x="146" y="56"  width="8"  height="36" fill="#c8a45a" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="140" y1="70" x2="160" y2="70" stroke="#c8a45a" stroke-width="3"/>
  <circle cx="136" cy="64" r="5" fill="#FFD84D" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="150" cy="58" r="5" fill="#FFD84D" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="164" cy="64" r="5" fill="#FFD84D" stroke="#0A0812" stroke-width="1.5"/>
</svg>
