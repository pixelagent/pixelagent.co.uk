<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah Builds the Ark</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a0a; font-family: Georgia, 'Times New Roman', serif; }

        #ui {
            position: absolute;
            top: 24px;
            left: 28px;
            color: #f0d99a;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 12px rgba(0,0,0,0.8);
        }
        #ui h1 { font-size: 1.7rem; font-weight: normal; letter-spacing: 0.04em; }
        #ui p  { font-size: 0.85rem; opacity: 0.7; margin-top: 4px; letter-spacing: 0.06em; }

        #verse {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: #c8b07a;
            font-size: 0.82rem;
            font-style: italic;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            letter-spacing: 0.03em;
        }
        #hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #6a7a8a;
            font-size: 0.75rem;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Noah Builds the Ark</h1>
        <p>Genesis 6 — The Command to Build</p>
    </div>
    <div id="verse">"Make yourself an ark of cypress wood… this is how you are to build it." — Genesis 6:14–15</div>
    <div id="hint">Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div>

    <script>
        let scene, camera, renderer, world;
        let isMouseDown = false;
        let targetRotX = 0.35, targetRotY = 0.4;
        let rotX = 0.35, rotY = 0.4;
        let workers = [];
        let time0 = Date.now();

        // ── Materials ──────────────────────────────────────────────────
        const MAT = {
            sky:      () => new THREE.MeshBasicMaterial({ color: 0x7ab3d4, side: THREE.BackSide }),
            ground:   () => new THREE.MeshPhongMaterial({ color: 0xb5924a, flatShading: true }),
            grass:    () => new THREE.MeshPhongMaterial({ color: 0x6d8c3e, flatShading: true }),
            timber:   () => new THREE.MeshPhongMaterial({ color: 0x8b5e2f, flatShading: true }),
            timberDk: () => new THREE.MeshPhongMaterial({ color: 0x5c3a1a, flatShading: true }),
            plank:    () => new THREE.MeshPhongMaterial({ color: 0xa0622a, flatShading: true }),
            rope:     () => new THREE.MeshPhongMaterial({ color: 0xd4b483 }),
            skin:     () => new THREE.MeshPhongMaterial({ color: 0xd4956a }),
            robe:     (c) => new THREE.MeshPhongMaterial({ color: c, flatShading: true }),
            stone:    () => new THREE.MeshPhongMaterial({ color: 0x8a7a6a, flatShading: true }),
            log:      () => new THREE.MeshPhongMaterial({ color: 0x7a4f20, flatShading: true }),
        };

        function box(w, h, d, mat, px, py, pz, rx=0, ry=0, rz=0) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(px, py, pz);
            m.rotation.set(rx, ry, rz);
            return m;
        }
        function cyl(rt, rb, h, seg, mat, px, py, pz, rx=0, ry=0, rz=0) {
            const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
            m.position.set(px, py, pz);
            m.rotation.set(rx, ry, rz);
            return m;
        }
        function sphere(r, seg, mat, px, py, pz) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, seg), mat);
            m.position.set(px, py, pz);
            return m;
        }
        function add(...meshes) { meshes.forEach(m => world.add(m)); }

        // ── Worker figure ──────────────────────────────────────────────
        function makeWorker(robeColor, px, pz, ry, carrying) {
            const g = new THREE.Group();
            const skin = MAT.skin();
            const robe = MAT.robe(robeColor);

            // body
            g.add(box(0.35, 0.6, 0.25, robe, 0, 0.55, 0));
            // head
            g.add(sphere(0.18, 8, skin, 0, 1.02, 0));
            // legs
            g.add(box(0.13, 0.4, 0.13, robe, -0.1, 0.18, 0));
            g.add(box(0.13, 0.4, 0.13, robe,  0.1, 0.18, 0));
            // arms
            const armL = box(0.1, 0.38, 0.1, skin, -0.24, 0.6, 0, 0, 0, 0.35);
            const armR = box(0.1, 0.38, 0.1, skin,  0.24, 0.6, 0, 0, 0, -0.35);
            g.add(armL, armR);

            if (carrying === 'plank') {
                const plank = box(1.4, 0.08, 0.22, MAT.plank(), 0.4, 0.72, 0, 0, 0, -0.2);
                g.add(plank);
            } else if (carrying === 'axe') {
                const handle = cyl(0.03, 0.03, 0.6, 6, MAT.timberDk(), 0.32, 0.72, 0, 0, 0, -Math.PI/3);
                const blade  = box(0.18, 0.22, 0.05, MAT.stone(), 0.55, 0.98, 0);
                g.add(handle, blade);
            } else if (carrying === 'rope') {
                const coil = cyl(0.12, 0.12, 0.06, 12, MAT.rope(), 0.3, 0.72, 0);
                g.add(coil);
            }

            g.position.set(px, 0, pz);
            g.rotation.y = ry;
            return g;
        }

        // ── Ark hull (partial construction) ───────────────────────────
        function buildArk() {
            const g = new THREE.Group();
            const tm = MAT.timber();
            const td = MAT.timberDk();
            const pl = MAT.plank();

            // Keel — long central spine
            g.add(box(14, 0.4, 0.4, td, 0, 0.2, 0));

            // Ribs — curved frames (approximated with angled boxes)
            const ribPositions = [-6,-4,-2,0,2,4,6];
            ribPositions.forEach(rx => {
                // left rib up
                g.add(box(0.3, 3.5, 0.3, tm, rx, 1.8, -1.6,  0, 0,  0.32));
                // right rib up
                g.add(box(0.3, 3.5, 0.3, tm, rx, 1.8,  1.6,  0, 0, -0.32));
                // bottom spreader
                g.add(box(0.25, 0.25, 3.2, tm, rx, 0.5, 0));
            });

            // Planking — left side (partial, showing work in progress)
            for (let i = 0; i < 5; i++) {
                g.add(box(14, 0.22, 0.28, pl, 0, 0.7 + i*0.55, -2.3, 0, 0, 0.28));
            }
            // right side only 3 planks (still being added)
            for (let i = 0; i < 3; i++) {
                g.add(box(14, 0.22, 0.28, pl, 0, 0.7 + i*0.55, 2.3, 0, 0, -0.28));
            }

            // Bow — angled end piece
            g.add(box(0.5, 3.0, 3.2, tm, -7.2, 1.5, 0, 0, 0, 0.18));
            // Stern
            g.add(box(0.5, 3.0, 3.2, tm,  7.2, 1.5, 0, 0, 0, -0.18));

            // Floor decking (partial)
            for (let i = -6; i <= 4; i += 1.1) {
                g.add(box(0.9, 0.15, 3.0, pl, i, 0.38, 0));
            }

            // Scaffolding on right side
            g.add(cyl(0.07,0.07, 4.5, 6, td, -4,  2.2, 3.8));
            g.add(cyl(0.07,0.07, 4.5, 6, td,  1,  2.2, 3.8));
            g.add(box(5.2, 0.12, 0.12, td, -1.5, 4.2, 3.8));  // horizontal scaffold beam
            g.add(box(0.12, 0.12, 0.5, td, -4, 4.0, 3.55));
            g.add(box(0.12, 0.12, 0.5, td,  1, 4.0, 3.55));

            // Plank ramp up scaffolding
            g.add(box(0.35, 5.0, 0.2, pl, -2.5, 2.0, 3.6, -0.8, 0, 0));

            g.position.set(0, 0, 0);
            return g;
        }

        // ── Timber yard — logs and cut planks on ground ───────────────
        function buildTimberYard() {
            const g = new THREE.Group();
            const lm = MAT.log();
            const pm = MAT.plank();

            // Stacked logs
            const logPositions = [[0,0],[0.85,0],[1.7,0],[0.42,0.6],[1.28,0.6],[0.85,1.1]];
            logPositions.forEach(([lx,ly]) => {
                g.add(cyl(0.28, 0.28, 3.5, 8, lm, lx, ly+0.28, 0, 0, 0, Math.PI/2));
            });

            // Loose planks on ground
            for (let i = 0; i < 5; i++) {
                g.add(box(3.0, 0.1, 0.3, pm, i*0.18, 0.05, i*0.35 - 0.5, 0, 0.1*i, 0));
            }

            // Woodchips / sawdust mound
            g.add(sphere(0.5, 6, MAT.ground(), 1.5, 0.1, -1));

            g.position.set(9, 0, -5);
            return g;
        }

        // ── Tree stumps ────────────────────────────────────────────────
        function makeStump(px, pz) {
            const g = new THREE.Group();
            g.add(cyl(0.3, 0.38, 0.7, 8, MAT.log(), 0, 0.35, 0));
            g.add(cyl(0.32, 0.32, 0.08, 8, MAT.timberDk(), 0, 0.72, 0));
            g.position.set(px, 0, pz);
            return g;
        }

        // ── Standing trees ─────────────────────────────────────────────
        function makeTree(px, pz, height=4.5) {
            const g = new THREE.Group();
            g.add(cyl(0.18, 0.28, height, 7, MAT.log(), 0, height/2, 0));
            g.add(sphere(1.1, 7, MAT.grass(), 0, height + 0.6, 0));
            g.position.set(px, 0, pz);
            return g;
        }

        // ── Stone altar ────────────────────────────────────────────────
        function makeAltar() {
            const g = new THREE.Group();
            const sm = MAT.stone();
            g.add(box(2.5, 0.6, 1.8, sm, 0, 0.3, 0));
            g.add(box(1.8, 0.5, 1.2, sm, 0, 0.85, 0));
            // offering fire
            g.add(cyl(0.35, 0.45, 0.4, 8, MAT.timberDk(), 0, 1.3, 0));
            g.position.set(-10, 0, -6);
            return g;
        }

        // ── INIT ───────────────────────────────────────────────────────
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 1000);
            camera.position.set(18, 12, 22);
            camera.lookAt(0, 3, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lights
            scene.add(new THREE.AmbientLight(0xfff4e0, 0.55));
            const sun = new THREE.DirectionalLight(0xfff0cc, 1.4);
            sun.position.set(60, 80, 40);
            scene.add(sun);
            const fill = new THREE.DirectionalLight(0xa0c8ff, 0.3);
            fill.position.set(-40, 20, -30);
            scene.add(fill);

            world = new THREE.Group();

            // Sky dome
            world.add(new THREE.Mesh(new THREE.SphereGeometry(350, 32, 16), MAT.sky()));

            // Ground
            const gnd = new THREE.Mesh(new THREE.PlaneGeometry(200, 200, 20, 20), MAT.ground());
            gnd.rotation.x = -Math.PI/2;
            gnd.position.y = -0.05;
            world.add(gnd);

            // Grass patches
            for (let i = 0; i < 18; i++) {
                const gp = new THREE.Mesh(new THREE.CircleGeometry(1.5+Math.random()*2, 7), MAT.grass());
                gp.rotation.x = -Math.PI/2;
                gp.position.set((Math.random()-0.5)*60, 0, (Math.random()-0.5)*60);
                world.add(gp);
            }

            // Ark under construction
            world.add(buildArk());

            // Timber yard
            world.add(buildTimberYard());

            // Stumps
            world.add(makeStump(-9, 3));
            world.add(makeStump(11, -8));
            world.add(makeStump(-6, -9));

            // Trees (background)
            const treeSpots = [[-18,8],[-22,2],[-20,-6],[-16,-12],[15,9],[18,4],[20,-5],[16,-11],[0,-18],[5,-20]];
            treeSpots.forEach(([tx,tz]) => world.add(makeTree(tx, tz, 4+Math.random()*2)));

            // Altar (Noah praying/receiving)
            world.add(makeAltar());

            // Workers
            const w0 = makeWorker(0x8b4513, -3, 3.8, Math.PI*0.9, 'plank');   // carrying plank toward ark
            const w1 = makeWorker(0x5a7a3a, 4,  3.5, Math.PI*1.1, 'axe');     // chopping
            const w2 = makeWorker(0xb06020,  7, -3.5, Math.PI*0.5, 'rope');   // rope coil
            const w3 = makeWorker(0x6b4226, -1, -4,  Math.PI*0.2, null);      // supervising
            const w4 = makeWorker(0x4a6050,  3,  5.2, Math.PI*1.3, 'plank');  // another plank carrier
            workers.push(w0, w1, w2, w3, w4);
            workers.forEach(w => world.add(w));

            // Tools on ground
            world.add(box(1.2, 0.08, 0.15, MAT.plank(), -2, 0.04, 2));
            world.add(cyl(0.04, 0.04, 1.1, 6, MAT.timberDk(), 5.5, 0.55, -2, 0,0,Math.PI/2.2));

            scene.add(world);

            // Events
            window.addEventListener('resize', () => {
                camera.aspect = innerWidth/innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });
            document.addEventListener('mousedown', () => isMouseDown = true);
            document.addEventListener('mouseup',   () => isMouseDown = false);
            document.addEventListener('mousemove', e => {
                if (isMouseDown) {
                    targetRotY += e.movementX * 0.006;
                    targetRotX += e.movementY * 0.006;
                    targetRotX = Math.max(-0.3, Math.min(targetRotX, 1.0));
                }
            });
            document.addEventListener('wheel', e => {
                const z = camera.position.z + e.deltaY * 0.05;
                camera.position.z = Math.max(6, Math.min(z, 60));
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = (Date.now() - time0) * 0.001;

            rotX += (targetRotX - rotX) * 0.08;
            rotY += (targetRotY - rotY) * 0.08;
            world.rotation.x = rotX;
            world.rotation.y = rotY;

            // Subtle worker bob
            workers.forEach((w, i) => {
                w.position.y = Math.sin(t * 1.8 + i * 1.3) * 0.04;
            });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
