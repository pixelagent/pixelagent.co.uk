<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Scroll — Full Experience</title>
    <style>
        :root {
            --es-cream: #f0ece4;
            --es-ink: #000000;
            --es-gold: #c9a96e;
            --es-slide: 44px;
            --es-dur: 0.9s;
            --es-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            background: var(--es-ink);
            overflow-x: hidden;
        }

        #es-loader {
            position: fixed;
            inset: 0;
            background: var(--es-ink);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #es-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-circle {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(201, 169, 110, 0.2);
            border-top-color: var(--es-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .es-root {
            position: relative;
            width: 100vw;
            font-family: 'Epilogue', sans-serif;
            color: var(--es-cream);
            transition: background 1.2s ease;
            visibility: hidden;
        }

        .es-root.ready {
            visibility: visible;
        }

        .es-sections {
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        .es-sec {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            background-color: transparent;
        }

        .es-canvas-wrap-section {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .es-canvas-wrap-section.visible {
            opacity: 1;
        }

        .es-sec-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 3s ease;
            pointer-events: none;
            z-index: 0;
        }

        .es-sec-bg.fade-out {
            transition: opacity 1s ease;
        }

        .es-sec-bg.visible {
            opacity: 1;
        }

        .es-sec[data-valign="top"] {
            align-items: flex-start;
            padding-top: 12vh;
        }

        .es-sec[data-valign="bottom"] {
            align-items: flex-end;
            padding-bottom: 12vh;
        }

        .es-text {
            position: relative;
            z-index: 2;
            pointer-events: auto;
            max-width: 400px;
            opacity: 0;
            transition: opacity var(--es-dur) var(--es-ease), transform var(--es-dur) var(--es-ease);
        }

        .es-text[data-enter="from-left"] {
            transform: translateX(calc(-1 * var(--es-slide)));
        }

        .es-text[data-enter="from-right"] {
            transform: translateX(var(--es-slide));
        }

        .es-text[data-enter="from-bottom"] {
            transform: translateY(var(--es-slide));
        }

        .es-text.is-visible {
            opacity: 1;
            transform: none !important;
        }

        .pos-left {
            margin-left: 8vw;
        }

        .pos-right {
            margin-left: auto;
            margin-right: 8vw;
        }

        .pos-center {
            margin: 0 auto;
            text-align: center;
        }

        .es-label {
            display: block;
            font-size: 12px;
            color: var(--es-gold);
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .es-h2 {
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0 0 15px;
            line-height: 1.2;
        }

        .es-p {
            font-size: 16px;
            line-height: 1.7;
            color: rgba(240, 236, 228, 0.6);
        }

        .es-stat-row {
            display: flex;
            gap: 30px;
            margin-top: 25px;
        }

        .es-stat-num {
            font-size: 1.8rem;
            color: var(--es-gold);
            display: block;
        }

        .es-stat-lbl {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(240, 236, 228, 0.4);
        }

        #es-prog-track {
            position: fixed;
            top: 30px;
            left: 50%;
            width: 1px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-50%);
            z-index: 10;
        }

        #es-prog-fill {
            width: 100%;
            background: var(--es-gold);
            height: 0%;
            transition: height 0.2s;
        }

        .es-nav-dot.active {
            background: var(--es-gold) !important;
        }
    </style>
</head>

<body>
    <div id="es-loader">
        <div class="loader-circle"
            style="border: 3px solid rgba(201, 169, 110, 0.3); border-top-color: var(--es-gold); width: 50px; height: 50px;">
        </div>
        <div id="es-loader-bar"
            style="width: 200px; height: 4px; background: rgba(201, 169, 110, 0.3); margin-top: 25px; border-radius: 2px; overflow: hidden;">
            <div id="es-loader-fill"
                style="width: 0%; height: 100%; background: var(--es-gold); transition: width 0.3s;"></div>
        </div>
        <div style="color: var(--es-gold); font-size: 11px; letter-spacing: 3px; margin-top: 20px; font-weight: 500;">
            LOADING SCENE</div>
    </div>
    <div class="es-root" id="esRoot">
        <div class="es-sections" id="es-sections-container"></div>
        <div id="es-prog-track">
            <div id="es-prog-fill"></div>
        </div>
        <div id="es-nav-dots"
            style="position: fixed; right: 30px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; gap: 12px; padding: 12px 8px; background: rgba(10, 10, 15, 0.5); border-radius: 20px;">
        </div>
        <button id="es-back-to-top"
            style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 44px; height: 44px; border: none; border-radius: 50%; background: rgba(201,169,110,0.2); color: var(--es-gold); cursor: pointer; z-index: 20; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);">
            ↑
        </button>
    </div>

    <!-- Three.js and scene scripts -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="scene1.js"></script>
    <script src="scene2.js"></script>
    <script src="scene3.js"></script>
    <script src="scene4.js"></script>
    <script src="scene5.js"></script>
    <script src="scene6.js"></script>

    <script>

        const labels = [
            'Building Worlds,',
            'Where Stories Begin',
            'Ideas in Motion',
            'Crafting the Journey',
            'Phase 05 — Release',
            'Release'
        ];

        const titles = [
            'One Pixel at a Time',
            'Where Stories Begin',
            'Ideas in Motion',
            'Crafting the Journey',
            'Into the World',
            'Release'
        ];

        const texts = [
            'Currently focused on browser-based creative tools, experimental web-games, and pushing the boundaries of interactive storytelling.',
            'Every great game starts with a question. We explore narrative frameworks, player psychology, and emotional resonance.',
            'Rapid iteration transforms abstract concepts into tangible mechanics. We build, break, and rebuild until the core loop feels right.',
            'Levels expand into narrative arcs. Each environment tells a story through lighting, spatial design, and environmental cues.',
            'The final leap of faith. We share our creation with global communities and begin the next cycle of listening and evolving.',
            'TBegin the next cycle of listening and evolving.'
        ];

        const images = [
            'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1441984710821-9f0aab8b1b40?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=1920&q=80'
        ];

        const models = [
            'scene1.glb', 'scene2.glb', 'scene3.glb',
            'scene4.glb', 'scene5.glb', 'scene6.glb'
        ];

        (function () {
            const storyData = [
                {
                    valign: "middle", pos: "pos-left", enter: "from-left",
                    label: labels[0], title: titles[0],
                    text: texts[0],
                    details: [],
                    initFunction: "initScene1",
                    scale: 0.5, bgImage: images[0], model: models[0],
                    waypoint: { p: 0.0, rx: 0, ry: 0, pos: 'MC', s: 1.0, z: 1.0 }
                },
                {
                    valign: "bottom", pos: "pos-left", enter: "from-left",
                    label: labels[1], title: titles[1],
                    text: texts[1],
                    details: [{ title: "∞", desc: "Possibilities" }, { title: "1", desc: "North Star" }],
                    initFunction: "initScene2",
                    scale: 0.5, bgImage: images[1], model: models[1],
                    waypoint: { p: 0.2, rx: 0.15, ry: 0.8, pos: 'TR', s: 0.9, z: 0.75 }
                },
                {
                    valign: "top", pos: "pos-right", enter: "from-right",
                    label: labels[2], title: titles[2],
                    text: texts[2],
                    details: [{ title: "100+", desc: "Iterations" }, { title: "24/7", desc: "Flow State" }],
                    initFunction: "initScene3",
                    scale: 0.5, bgImage: images[2], model: models[2],
                    waypoint: { p: 0.4, rx: -0.12, ry: 2.0, pos: 'BL', s: 0.9, z: 1.25 }
                },
                {
                    valign: "middle", pos: "pos-left", enter: "from-left",
                    label: labels[3], title: titles[3],
                    text: texts[3],
                    details: [{ title: "12", desc: "Chapters" }, { title: "400+", desc: "Assets" }],
                    initFunction: "initScene4",
                    scale: 0.5, bgImage: images[3], model: models[3],
                    waypoint: { p: 0.6, rx: 0.08, ry: 3.5, pos: 'MR', s: 0.9, z: 1.0 }
                },
                {
                    valign: "top", pos: "pos-center", enter: "from-bottom",
                    label: labels[4], title: titles[4],
                    text: texts[4],
                    details: [{ title: "60", desc: "FPS Target" }, { title: "10ms", desc: "Input Lag" }],
                    initFunction: "initScene5",
                    scale: 0.5, bgImage: images[4], model: models[4],
                    waypoint: { p: 0.8, rx: 0.0, ry: 5.0, pos: 'TC', s: 0.95, z: 1.25 }
                },
                {
                    valign: "middle", pos: "pos-center", enter: "from-bottom",
                    label: labels[5], title: titles[5],
                    text: texts[5],
                    details: [{ title: "1M+", desc: "Dreams Shared" }],
                    initFunction: "initScene6",
                    scale: 0.5, bgImage: images[5], model: models[5],
                    waypoint: { p: 1.0, rx: 0.0, ry: 6.28, pos: 'MC', s: 1.0, z: 1.0 }
                }
            ];

            const GRID = {
                TL: { x: -1.15, y: 0.52 }, TC: { x: 0, y: 0.52 }, TR: { x: 1.15, y: 0.52 },
                ML: { x: -1.15, y: 0 }, MC: { x: 0, y: 0 }, MR: { x: 1.15, y: 0 },
                BL: { x: -1.15, y: -0.52 }, BC: { x: 0, y: -0.52 }, BR: { x: 1.15, y: -0.52 }
            };

            // Preload images and wait minimum 3 seconds
            function preloadImage(url) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve(url);
                    img.onerror = () => resolve(url);
                    img.src = url;
                });
            }

            // Fake progress bar animation
            let fakeProgress = 0;
            const loaderFill = document.getElementById('es-loader-fill');
            const progressInterval = setInterval(() => {
                fakeProgress = Math.min(fakeProgress + Math.random() * 8, 90);
                loaderFill.style.width = fakeProgress + '%';
            }, 200);

            const preloadStartTime = Date.now();
            const minLoadTime = 3000;

            Promise.all([...images.map(url => preloadImage(url))])
                .then(() => {
                    const remaining = minLoadTime - (Date.now() - preloadStartTime);
                    setTimeout(() => {
                        clearInterval(progressInterval);
                        loaderFill.style.width = '100%';
                        setTimeout(initExperience, 300);
                    }, Math.max(0, remaining));
                })
                .catch(err => {
                    console.error('Preload error:', err);
                    clearInterval(progressInterval);
                    initExperience();
                });

            // ── Step 3: build the experience ─────────────────────────────────
            function initExperience() {
                const root = document.getElementById('esRoot');
                const container = document.getElementById('es-sections-container');
                root.style.height = (storyData.length * 100) + 'vh';

                // Build DOM sections with individual canvases
                storyData.forEach((sec, i) => {
                    const div = document.createElement('div');
                    div.className = 'es-sec';
                    div.dataset.valign = sec.valign;

                    const stats = (sec.details || [])
                        .map(s => `<div class="es-stat"><span class="es-stat-num">${s.title}</span><span class="es-stat-lbl">${s.desc}</span></div>`)
                        .join('');

                    div.innerHTML = `
                              <div class="es-canvas-wrap-section">
                                  <canvas class="es-gl-section" style="width:100%;height:100%;display:block;"></canvas>
                              </div>
                              <div class="es-sec-bg" style="background-image:url('${sec.bgImage}')"></div>
                              <div class="es-text ${sec.pos}" data-enter="${sec.enter}">
                                  <span class="es-label">${sec.label}</span>
                                  <h2 class="es-h2">${sec.title}</h2>
                                  <p class="es-p">${sec.text}</p>
                                  <div class="es-stat-row">${stats}</div>
                              </div>`;
                    container.appendChild(div);

                    // Nav dot
                    const dot = document.createElement('div');
                    dot.className = 'es-nav-dot';
                    dot.dataset.idx = i;
                    dot.style.cssText = 'width:10px;height:10px;border-radius:50%;background:rgba(201,169,110,0.3);cursor:pointer;transition:background 0.3s';
                    dot.addEventListener('click', () => {
                        const targetP = storyData[i].waypoint?.p || (i / (storyData.length - 1));
                        window.scrollTo({ top: targetP * (root.offsetHeight - window.innerHeight), behavior: 'smooth' });
                    });
                    document.getElementById('es-nav-dots').appendChild(dot);
                });

                // ── Three.js setup ───────────────────────────────────────────
                const totalCanvases = storyData.length;
                const renderers = [];
                const scenes = [];
                const cameras = [];
                const groups = [];
                const bgEls = [];
                const canvasWrapEls = [];

                const canvases = document.querySelectorAll('.es-gl-section');

                canvases.forEach((cv, idx) => {
                    const data = storyData[idx];

                    // Initialize Three.js for this section
                    const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    renderer.outputEncoding = THREE.sRGBEncoding;
                    renderers.push(renderer);

                    const scene = new THREE.Scene();
                    scenes.push(scene);

                    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.z = 5;
                    cameras.push(camera);

                    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
                    dirLight.position.set(5, 5, 5);
                    scene.add(dirLight);
                    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
                    fillLight.position.set(-5, -2, -3);
                    scene.add(fillLight);

                    const group = new THREE.Group();
                    group.visible = false;
                    scene.add(group);
                    groups.push(group);

                    const sectionEl = cv.closest('.es-sec');
                    const bgEl = sectionEl.querySelector('.es-sec-bg');
                    bgEls.push(bgEl);
                    const canvasWrapEl = sectionEl.querySelector('.es-canvas-wrap-section');
                    canvasWrapEls.push(canvasWrapEl);

                    const gltfLoader = new THREE.GLTFLoader();

                    // Load GLB model if specified
                    if (data.model) {
                        gltfLoader.load(
                            data.model,
                            (gltf) => {
                                if (data.scale) gltf.scene.scale.setScalar(data.scale);
                                group.add(gltf.scene);
                            },
                            null,
                            (err) => console.warn('GLB failed:', data.model, err.message)
                        );
                    }

                    // Call the scene init function
                    if (data.initFunction && typeof window[data.initFunction] === 'function') {
                        try {
                            window[data.initFunction](group);
                        } catch (e) {
                            console.error('initFunction error:', data.initFunction, e);
                        }
                    } else if (data.initFunction) {
                        console.warn('initFunction not found:', data.initFunction);
                    }
                });

                // Show first scene
                document.getElementById('es-loader').classList.add('hidden');
                document.getElementById('esRoot').classList.add('ready');
                groups[0].visible = true;
                canvasWrapEls[0].classList.add('visible');
                bgEls[0].classList.add('visible');
                document.querySelectorAll('.es-text')[0].classList.add('is-visible');
                document.querySelectorAll('.es-nav-dot')[0]?.classList.add('active');

                window.addEventListener('resize', () => {
                    renderers.forEach((renderer, i) => {
                        cameras[i].aspect = window.innerWidth / window.innerHeight;
                        cameras[i].updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });
                });

                // ── Render loop ──────────────────────────────────────────────
                let activeIdx = 0;
                const textEls = document.querySelectorAll('.es-text');

                // Smooth position state per group
                const smoothPos = storyData.map(() => ({ x: 0, y: 0 }));

                function animate() {
                    requestAnimationFrame(animate);

                    const totalScroll = root.offsetHeight - window.innerHeight;
                    const scrollP = totalScroll > 0
                        ? Math.min(Math.max(-root.getBoundingClientRect().top / totalScroll, 0), 1)
                        : 0;

                    // Which section are we in?
                    const idx = Math.min(Math.floor(scrollP * storyData.length), storyData.length - 1);

                    if (idx !== activeIdx) {
                        if (groups[activeIdx]) groups[activeIdx].visible = false;
                        if (canvasWrapEls[activeIdx]) canvasWrapEls[activeIdx].classList.remove('visible');
                        if (textEls[activeIdx]) textEls[activeIdx].classList.remove('is-visible');
                        activeIdx = idx;
                        groups[idx].visible = true;
                        canvasWrapEls[idx].classList.add('visible');
                        textEls[idx].classList.add('is-visible');
                        document.querySelectorAll('.es-nav-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
                    }

                    // Animate active group
                    const g = groups[activeIdx];
                    const wp = storyData[activeIdx].waypoint;
                    const tgt = GRID[wp.pos] || GRID.MC;

                    smoothPos[activeIdx].x += (tgt.x - smoothPos[activeIdx].x) * 0.04;
                    smoothPos[activeIdx].y += (tgt.y - smoothPos[activeIdx].y) * 0.04;
                    g.position.x = smoothPos[activeIdx].x;
                    g.position.y = smoothPos[activeIdx].y;

                    g.rotation.x = wp.rx || 0;
                    g.rotation.y += 0.002;
                    g.scale.setScalar((storyData[activeIdx].scale || 1) * (wp.s || 1) * (wp.z || 1));

                    document.getElementById('es-prog-fill').style.height = (scrollP * 100) + '%';

                    const fadeZone = 0.1;
                    bgEls.forEach((bgEl, i) => {
                        const sectionStart = i / storyData.length;
                        const sectionEnd = (i + 1) / storyData.length;
                        const enteringSection = scrollP >= sectionStart && scrollP < sectionStart + fadeZone;
                        const inFullView = scrollP >= sectionStart + fadeZone && scrollP < sectionEnd - fadeZone;
                        const leavingSection = scrollP >= sectionEnd - fadeZone && scrollP < sectionEnd;
                        if (leavingSection) {
                            bgEl.classList.add('fade-out');
                        } else {
                            bgEl.classList.remove('fade-out');
                        }
                        if (enteringSection || inFullView || leavingSection) {
                            bgEl.classList.add('visible');
                        } else {
                            bgEl.classList.remove('visible');
                        }
                    });

                    // Back to top button visibility
                    const topBtn = document.getElementById('es-back-to-top');
                    if (scrollP > 0.1) {
                        topBtn.style.opacity = '1';
                        topBtn.style.visibility = 'visible';
                    } else {
                        topBtn.style.opacity = '0';
                        topBtn.style.visibility = 'hidden';
                    }

                    renderers[activeIdx].render(scenes[activeIdx], cameras[activeIdx]);
                }

                // Back to top button handler
                document.getElementById('es-back-to-top').addEventListener('click', () => {
                    const startY = window.scrollY;
                    const startTime = performance.now();
                    const duration = 1600;

                    function scrollToTop(currentTime) {
                        const elapsed = currentTime - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const ease = 1 - Math.pow(1 - progress, 3);
                        window.scrollTo(0, startY * (1 - ease));

                        if (progress < 1) {
                            requestAnimationFrame(scrollToTop);
                        } else {
                            window.scrollTo(0, 0);
                        }
                    }

                    requestAnimationFrame(scrollToTop);
                });

                animate();
            }
        })();
    </script>
</body>

</html>
