<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- ═══ BACKGROUND: vast open sky — 70% of frame ═══ -->
  <!-- Sky base: dark warm top, pale horizon -->
  <rect width="400" height="300" fill="#3d2808"/>
  <!-- Sky gradient bands top to bottom -->
  <rect x="0" y="0"   width="400" height="60"  fill="#2e2010"/>
  <rect x="0" y="60"  width="400" height="50"  fill="#3d2808"/>
  <rect x="0" y="110" width="400" height="40"  fill="#6b4420"/>
  <rect x="0" y="150" width="400" height="30"  fill="#c4956a"/>
  <!-- Bright horizon glow -->
  <rect x="0" y="172" width="400" height="18"  fill="#E8B84B" opacity="0.55"/>
  <!-- White space: open right-side sky — already achieved by keeping this zone empty -->

  <!-- Two low flat clouds — background, left and centre -->
  <ellipse cx="90"  cy="55"  rx="70" ry="16" fill="#2e2010" opacity="0.85"/>
  <ellipse cx="310" cy="38"  rx="55" ry="12" fill="#2e2010" opacity="0.70"/>

  <!-- ═══ GROUND: 30% of frame ═══ -->
  <rect x="0" y="188" width="400" height="112" fill="#6b4420"/>
  <rect x="0" y="210" width="400" height="90"  fill="#5a3010"/>
  <rect x="0" y="245" width="400" height="55"  fill="#3d2808"/>

  <!-- Diagonal dirt path — bottom-left corner to middle-distance RIGHT ═══ -->
  <!-- Movement line: leads eye from BL to centre-right -->
  <polygon points="0,300 130,300 230,188 100,188" fill="#8B5E2F" stroke="#6b4420" stroke-width="2"/>
  <!-- Path lighter highlight strip -->
  <polygon points="20,300 100,300 185,190 100,190" fill="#c4956a" opacity="0.38"/>
  <!-- Path edge stones for rhythm -->
  <ellipse cx="55"  cy="256" rx="6"  ry="3"  fill="#5a3010" stroke="#1a0e04" stroke-width="1"/>
  <ellipse cx="95"  cy="230" rx="5"  ry="2.5" fill="#5a3010" stroke="#1a0e04" stroke-width="1"/>
  <ellipse cx="145" cy="208" rx="4"  ry="2"  fill="#5a3010" stroke="#1a0e04" stroke-width="1"/>

  <!-- ═══ MIDGROUND: 3 small figures walking OPPOSITE direction (right → left) ═══ -->
  <!-- These are DARKER than horizon — silhouettes going the wrong way -->
  <!-- Distant figure A -->
  <rect  x="300" y="176" width="6"  height="15" fill="#3d2808" stroke="#1a0e04" stroke-width="1.5"/>
  <circle cx="303" cy="173" r="4"  fill="#3d2808" stroke="#1a0e04" stroke-width="1.5"/>
  <line x1="300" y1="182" x2="295" y2="191" stroke="#1a0e04" stroke-width="1.5"/>
  <line x1="306" y1="182" x2="310" y2="191" stroke="#1a0e04" stroke-width="1.5"/>
  <!-- Distant figure B -->
  <rect  x="320" y="177" width="5"  height="14" fill="#3d2808" stroke="#1a0e04" stroke-width="1.5"/>
  <circle cx="322" cy="174" r="3.5" fill="#3d2808" stroke="#1a0e04" stroke-width="1.5"/>
  <line x1="320" y1="183" x2="315" y2="191" stroke="#1a0e04" stroke-width="1.5"/>
  <line x1="325" y1="183" x2="329" y2="191" stroke="#1a0e04" stroke-width="1.5"/>
  <!-- Distant figure C — staff -->
  <rect  x="340" y="175" width="6"  height="16" fill="#3d2808" stroke="#1a0e04" stroke-width="1.5"/>
  <circle cx="343" cy="172" r="4"  fill="#3d2808" stroke="#1a0e04" stroke-width="1.5"/>
  <line x1="340" y1="182" x2="335" y2="191" stroke="#1a0e04" stroke-width="1.5"/>
  <line x1="346" y1="182" x2="350" y2="191" stroke="#1a0e04" stroke-width="1.5"/>
  <line x1="348" y1="171" x2="351" y2="191" stroke="#1a0e04" stroke-width="2"/>

  <!-- ═══ FOREGROUND: NOAH — warm amber silhouette, LEFT-CENTRE, walking RIGHT ═══ -->
  <!-- Noah is lit warmly, distinctly brighter/warmer than ground -->
  <!-- His shadow ahead of him (behind, to left, from right-side sun) -->

  <!-- Long staff shadow on ground -->
  <line x1="120" y1="278" x2="154" y2="190" stroke="#3d2808" stroke-width="2" opacity="0.7"/>

  <!-- LEGS — mid-stride, left leg forward -->
  <!-- Back leg (right) -->
  <polygon points="138,282 148,240 158,282" fill="#8B5E2F" stroke="#1a0e04" stroke-width="2"/>
  <!-- Front leg (left) -->
  <polygon points="148,282 158,240 166,282" fill="#C87050" stroke="#1a0e04" stroke-width="2"/>
  <!-- Sandals -->
  <rect x="136" y="279" width="14" height="5" fill="#5a3010" stroke="#1a0e04" stroke-width="1.5"/>
  <rect x="156" y="279" width="14" height="5" fill="#5a3010" stroke="#1a0e04" stroke-width="1.5"/>

  <!-- Robe / cloak body -->
  <polygon points="126,240 174,240 178,282 122,282" fill="#C87050" stroke="#1a0e04" stroke-width="2.5"/>
  <!-- Robe fold detail -->
  <line x1="140" y1="242" x2="136" y2="278" stroke="#8B5E2F" stroke-width="1.5" opacity="0.6"/>
  <line x1="155" y1="242" x2="155" y2="280" stroke="#8B5E2F" stroke-width="1.5" opacity="0.5"/>
  <line x1="166" y1="242" x2="170" y2="276" stroke="#8B5E2F" stroke-width="1.5" opacity="0.5"/>

  <!-- Cloak over shoulders, hood at back -->
  <polygon points="118,224 180,224 176,242 122,242" fill="#8B5E2F" stroke="#1a0e04" stroke-width="2"/>
  <!-- Upper body torso -->
  <rect x="126" y="206" width="48" height="20" fill="#C87050" stroke="#1a0e04" stroke-width="2.5"/>

  <!-- RIGHT arm — forward, holding staff -->
  <line x1="172" y1="220" x2="178" y2="250" stroke="#D4956A" stroke-width="5" stroke-linecap="round"/>
  <!-- LEFT arm — swinging back -->
  <line x1="128" y1="218" x2="118" y2="240" stroke="#D4956A" stroke-width="5" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="143" y="194" width="14" height="14" fill="#D4956A" stroke="#1a0e04" stroke-width="2"/>
  <!-- Head — facing right (profile suggestion) -->
  <ellipse cx="152" cy="188" rx="16" ry="17" fill="#D4956A" stroke="#1a0e04" stroke-width="2.5"/>
  <!-- Head cloth / wrap -->
  <path d="M138,182 Q152,170 166,182 Q168,194 165,196 Q152,187 139,196 Q136,194 138,182Z"
        fill="#8B5E2F" stroke="#1a0e04" stroke-width="2"/>
  <!-- Beard flowing back (moving right) -->
  <polygon points="142,192 152,204 162,192 160,198 152,208 144,198"
           fill="#6b4420" stroke="#1a0e04" stroke-width="1.5"/>

  <!-- Staff — diagonal, walking motion -->
  <line x1="176" y1="202" x2="195" y2="285" stroke="#5a3010" stroke-width="4" stroke-linecap="round"/>
  <circle cx="176" cy="200" r="4" fill="#5a3010" stroke="#1a0e04" stroke-width="1.5"/>

</svg>
