<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- ===== BACKGROUND LAYER: Very dark night sky ===== -->
  <rect width="400" height="300" fill="#0a0812"/>
  <!-- Stars — sparse, upper area -->
  <circle cx="42" cy="18" r="1.2" fill="#c4956a" opacity="0.6"/>
  <circle cx="110" cy="10" r="1" fill="#c4956a" opacity="0.5"/>
  <circle cx="175" cy="24" r="1.3" fill="#c4956a" opacity="0.55"/>
  <circle cx="248" cy="8" r="1" fill="#c4956a" opacity="0.45"/>
  <circle cx="318" cy="20" r="1.2" fill="#c4956a" opacity="0.5"/>
  <circle cx="370" cy="12" r="1" fill="#c4956a" opacity="0.4"/>
  <circle cx="82" cy="42" r="0.9" fill="#c4956a" opacity="0.4"/>
  <circle cx="290" cy="36" r="1" fill="#c4956a" opacity="0.35"/>

  <!-- ===== MIDGROUND: ARK HULL PLANKS — dark mass, receding diagonally to upper-right ===== -->
  <!-- Hull fills right 3/4 of midground — very dark -->
  <polygon points="0,160 400,80 400,300 0,300" fill="#281808"/>
  <!-- Diagonal plank lines on hull — receding to upper-right, creating movement and depth -->
  <line x1="40" y1="155" x2="400" y2="85" stroke="#0A0812" stroke-width="2"/>
  <line x1="40" y1="180" x2="400" y2="110" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="40" y1="205" x2="400" y2="135" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="40" y1="230" x2="400" y2="162" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="0" y1="220" x2="400" y2="190" stroke="#0A0812" stroke-width="1"/>
  <!-- Hull edge — top diagonal beam -->
  <line x1="0" y1="162" x2="400" y2="78" stroke="#3d2808" stroke-width="3"/>
  <!-- Subtle plank grain highlights — very faint -->
  <line x1="0" y1="172" x2="400" y2="93" stroke="#3d2808" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="196" x2="400" y2="120" stroke="#3d2808" stroke-width="1" opacity="0.5"/>

  <!-- ===== TORCH — planted in ground, right of Noah ===== -->
  <!-- Torch shaft -->
  <rect x="248" y="200" width="5" height="68" rx="1" fill="#5a3010" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Torch flame — ONLY LIGHT SOURCE warm cone -->
  <polygon points="244,165 250,138 256,165 253,160 247,160" fill="#E8B84B" stroke="#0A0812" stroke-width="1"/>
  <polygon points="247,160 250,144 253,160" fill="#C87050" opacity="0.9"/>
  <!-- Inner bright flame core -->
  <ellipse cx="250" cy="155" rx="4" ry="8" fill="#E8B84B" opacity="0.9"/>
  <!-- Torch warm glow — radial cone of light, rightward and down toward Noah -->
  <!-- Glow cone: wide soft ellipse centred near torch, angled left -->
  <ellipse cx="200" cy="195" rx="95" ry="62" fill="#E8B84B" opacity="0.07"/>
  <ellipse cx="190" cy="190" rx="65" ry="42" fill="#C87050" opacity="0.09"/>
  <ellipse cx="210" cy="175" rx="45" ry="28" fill="#E8B84B" opacity="0.10"/>

  <!-- ===== FOREGROUND GROUND ===== -->
  <rect x="0" y="262" width="400" height="38" fill="#281808"/>
  <rect x="0" y="256" width="400" height="10" fill="#3d2808"/>

  <!-- Ground debris — foreground -->
  <!-- Wood shavings (small curved slivers) -->
  <path d="M 88,264 Q 94,260 100,264" fill="none" stroke="#8B5E2F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 112,261 Q 120,257 126,261" fill="none" stroke="#C87050" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 70,268 Q 78,264 84,268" fill="none" stroke="#6b4420" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 140,265 Q 146,261 150,265" fill="none" stroke="#8B5E2F" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mallet on ground -->
  <rect x="82" y="254" width="22" height="7" rx="2" fill="#5a3010" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="90" y="250" width="7" height="10" rx="1" fill="#3d2808" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Small scrap plank -->
  <rect x="60" y="258" width="28" height="5" rx="1" fill="#8B5E2F" stroke="#0A0812" stroke-width="1.5"/>

  <!-- ===== NOAH FIGURE — slightly left of centre, lit from right by torch ===== -->
  <!-- Legs -->
  <rect x="136" y="228" width="13" height="32" rx="5" fill="#120c04" stroke="#0A0812" stroke-width="2"/>
  <rect x="153" y="228" width="13" height="32" rx="5" fill="#120c04" stroke="#0A0812" stroke-width="2"/>
  <!-- Robe / body — LEFT half dark, RIGHT half lit warm -->
  <polygon points="128,190 172,190 168,228 132,228" fill="#3d2808" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Lit right flank of robe -->
  <polygon points="158,190 172,190 168,228 155,228" fill="#C87050" opacity="0.55"/>

  <!-- Arm bracing the hull — right arm straight against wall -->
  <line x1="165" y1="200" x2="210" y2="188" stroke="#281808" stroke-width="10" stroke-linecap="round"/>
  <!-- Raised hammer arm — LEFT arm diagonal upward — FOCAL gesture -->
  <line x1="132" y1="196" x2="106" y2="162" stroke="#281808" stroke-width="11" stroke-linecap="round"/>
  <!-- Lit side of raised arm -->
  <line x1="132" y1="196" x2="106" y2="162" stroke="#C87050" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Hammer head -->
  <rect x="90" y="152" width="22" height="12" rx="3" fill="#5a3e18" stroke="#0A0812" stroke-width="2"/>
  <!-- Hammer handle -->
  <line x1="104" y1="158" x2="118" y2="166" stroke="#6b4420" stroke-width="5" stroke-linecap="round"/>

  <!-- Noah's head — lit on right side by torch -->
  <ellipse cx="150" cy="180" rx="17" ry="15" fill="#3d2808" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Lit right cheek highlight -->
  <ellipse cx="160" cy="182" rx="8" ry="7" fill="#C87050" opacity="0.65"/>
  <!-- Beard — flows downward -->
  <path d="M 136,186 Q 142,202 155,196 Q 150,186 150,180" fill="#281808" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Lit beard edge -->
  <path d="M 149,186 Q 154,200 159,194" fill="none" stroke="#a06a35" stroke-width="1.5" opacity="0.8"/>
  <!-- Eye (right side, lit) -->
  <circle cx="156" cy="178" r="2.5" fill="#0A0812"/>
  <!-- Eye (left side, in shadow — barely visible) -->
  <circle cx="144" cy="179" r="2" fill="#120c04"/>
  <!-- Head cloth band -->
  <path d="M 135,175 Q 150,167 165,175" stroke="#120c04" stroke-width="3" fill="none"/>

</svg>
