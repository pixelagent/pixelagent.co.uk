<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky_e" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040202"/>
      <stop offset="40%" stop-color="#0a0812"/>
      <stop offset="80%" stop-color="#0c0604"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="ground_e" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160a04"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
  </defs>

  <!-- Night sky — heavy, deep -->
  <rect width="400" height="300" fill="url(#sky_e)"/>
  <!-- Ground -->
  <rect x="0" y="215" width="400" height="85" fill="url(#ground_e)"/>
  <line x1="0" y1="215" x2="400" y2="215" stroke="#2a1408" stroke-width="2"/>

  <!-- Stars — moderate, not joyful (not the covenant sky), distributed across full sky -->
  <circle cx="40" cy="18" r="1.2" fill="#fff8e0" opacity="0.55"/>
  <circle cx="85" cy="38" r="0.8" fill="#fff8e0" opacity="0.4"/>
  <circle cx="128" cy="14" r="1" fill="#fff8e0" opacity="0.5"/>
  <circle cx="165" cy="42" r="0.8" fill="#fff8e0" opacity="0.35"/>
  <circle cx="200" cy="20" r="1.2" fill="#fff8e0" opacity="0.5"/>
  <circle cx="238" cy="48" r="0.8" fill="#fff8e0" opacity="0.4"/>
  <circle cx="275" cy="16" r="1" fill="#fff8e0" opacity="0.45"/>
  <circle cx="312" cy="36" r="0.8" fill="#fff8e0" opacity="0.35"/>
  <circle cx="348" cy="22" r="1" fill="#fff8e0" opacity="0.5"/>
  <circle cx="380" cy="44" r="0.8" fill="#fff8e0" opacity="0.4"/>
  <circle cx="60" cy="60" r="0.8" fill="#fff8e0" opacity="0.3"/>
  <circle cx="110" cy="55" r="0.8" fill="#fff8e0" opacity="0.3"/>
  <circle cx="180" cy="66" r="0.8" fill="#fff8e0" opacity="0.25"/>
  <circle cx="245" cy="60" r="0.8" fill="#fff8e0" opacity="0.3"/>
  <circle cx="295" cy="68" r="0.8" fill="#fff8e0" opacity="0.25"/>
  <circle cx="360" cy="62" r="0.8" fill="#fff8e0" opacity="0.3"/>

  <!-- COVENANT RAINBOW ARC — faint, barely visible, very top edge only -->
  <!-- The last frame of the whole story — just a trace -->
  <path d="M-10,5 Q200,-35 410,5" stroke="#C87050" stroke-width="2.5" fill="none" opacity="0.12"/>
  <path d="M0,8 Q200,-28 400,8" stroke="#E8B84B" stroke-width="1.5" fill="none" opacity="0.08"/>
  <!-- A third trace, barely there -->
  <path d="M10,2 Q200,-42 390,2" stroke="#fff8e0" stroke-width="1" fill="none" opacity="0.06"/>

  <!-- ============ VINEYARD — background, dark, rows filling middle ground ============ -->
  <!-- Far row — very dark, barely distinguishable -->
  <line x1="80" y1="170" x2="80" y2="162" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="80" cy="160" rx="7" ry="5" fill="#1e2e10" stroke="#0A0812" stroke-width="1"/>
  <line x1="110" y1="170" x2="110" y2="162" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="110" cy="160" rx="7" ry="5" fill="#1e2e10" stroke="#0A0812" stroke-width="1"/>
  <line x1="140" y1="170" x2="140" y2="162" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="140" cy="160" rx="7" ry="5" fill="#1e2e10" stroke="#0A0812" stroke-width="1"/>
  <line x1="170" y1="171" x2="170" y2="163" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="170" cy="161" rx="7" ry="5" fill="#1e2e10" stroke="#0A0812" stroke-width="1"/>
  <line x1="200" y1="171" x2="200" y2="163" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="200" cy="161" rx="7" ry="5" fill="#1e2e10" stroke="#0A0812" stroke-width="1"/>
  <line x1="230" y1="171" x2="230" y2="163" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="230" cy="161" rx="7" ry="5" fill="#1e2e10" stroke="#0A0812" stroke-width="1"/>
  <line x1="260" y1="172" x2="260" y2="164" stroke="#2e4018" stroke-width="1"/>
  <ellipse cx="260" cy="162" rx="6" ry="4" fill="#1e2e10" stroke="#0A0812" stroke-width="1"/>
  <!-- Trellis wire — far row -->
  <line x1="72" y1="168" x2="275" y2="169" stroke="#1e2e10" stroke-width="1" opacity="0.5"/>

  <!-- Nearer vine row -->
  <line x1="86" y1="182" x2="86" y2="172" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="86" cy="170" rx="8" ry="6" fill="#2e3e18" stroke="#0A0812" stroke-width="1"/>
  <line x1="118" y1="183" x2="118" y2="173" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="118" cy="171" rx="8" ry="6" fill="#2e3e18" stroke="#0A0812" stroke-width="1"/>
  <line x1="150" y1="184" x2="150" y2="174" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="150" cy="172" rx="8" ry="6" fill="#2e3e18" stroke="#0A0812" stroke-width="1"/>
  <line x1="182" y1="184" x2="182" y2="174" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="182" cy="172" rx="8" ry="6" fill="#2e3e18" stroke="#0A0812" stroke-width="1"/>
  <line x1="214" y1="184" x2="214" y2="175" stroke="#2e4018" stroke-width="1.5"/>
  <ellipse cx="214" cy="173" rx="8" ry="5" fill="#2e3e18" stroke="#0A0812" stroke-width="1"/>
  <line x1="245" y1="185" x2="245" y2="176" stroke="#2e4018" stroke-width="1"/>
  <ellipse cx="245" cy="174" rx="7" ry="5" fill="#2e3e18" stroke="#0A0812" stroke-width="1"/>
  <!-- Trellis nearer row -->
  <line x1="78" y1="180" x2="258" y2="181" stroke="#1e2e10" stroke-width="1" opacity="0.5"/>

  <!-- ============ NOAH'S TENT — LEFT, heavy, dark, weight resting here ============ -->
  <!-- Tent — very dark, barely lighter than night -->
  <polygon points="0,215 115,215 110,118 58,92 0,118" fill="#3a2010" stroke="#0A0812" stroke-width="3"/>
  <!-- Shadow side — almost pure black -->
  <polygon points="58,92 110,118 115,215 78,215 76,142" fill="#1e1008" stroke="#0A0812" stroke-width="2"/>
  <!-- Peak pole -->
  <line x1="58" y1="92" x2="58" y2="70" stroke="#4a2e10" stroke-width="2"/>
  <circle cx="58" cy="68" r="2.5" fill="#3a2010" stroke="#0A0812" stroke-width="1.5"/>

  <!-- Tent flap — CLOSED, seam visible, complete closure -->
  <polygon points="58,92 76,116 74,215 42,215 40,118" fill="#4a2a10" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Flap seam — the tent is sealed shut, Noah inside -->
  <line x1="58" y1="96" x2="57" y2="215" stroke="#2e1808" stroke-width="1.5"/>

  <!-- Weight shadow under tent — heaviest shadow in the scene -->
  <ellipse cx="55" cy="222" rx="55" ry="7" fill="#040202" opacity="0.9"/>

  <!-- Very faint ghost — Noah's form barely visible through fabric -->
  <ellipse cx="52" cy="195" rx="26" ry="9" fill="#2a1408" opacity="0.35"/>

  <!-- ============ SPACE BETWEEN — this is the emotional centre ============ -->
  <!-- The deliberate empty ground between tent and departing figures -->
  <!-- Just ground, darkness, silence -->
  <!-- A barely-visible path track suggesting they have just walked from here -->
  <line x1="115" y1="228" x2="220" y2="226" stroke="#2a1808" stroke-width="1" opacity="0.4"/>
  <line x1="115" y1="236" x2="220" y2="234" stroke="#2a1808" stroke-width="1" opacity="0.3"/>

  <!-- ============ TWO SILHOUETTES — departing RIGHT, gentle diagonal ============ -->
  <!-- Slightly right of centre — they walk into the open right half of the frame -->

  <!-- Ground shadow under both -->
  <ellipse cx="278" cy="222" rx="45" ry="6" fill="#040202" opacity="0.6"/>

  <!-- FIGURE LEFT (Shem) — slightly ahead, nearer us -->
  <!-- Legs — walking stride, stepping forward right -->
  <polygon points="240,215 262,215 260,188 244,185" fill="#2a1408" stroke="#0A0812" stroke-width="2.5"/>
  <polygon points="257,215 278,215 275,188 258,185" fill="#1e0e06" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Body -->
  <polygon points="242,190 276,187 272,160 258,153 245,155 238,168" fill="#2a1408" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Head -->
  <ellipse cx="256" cy="144" rx="13" ry="14" fill="#2a1408" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Head cloth — dark, dignified -->
  <polygon points="244,140 246,130 254,123 266,124 271,132 269,143 260,138 249,139" fill="#1a0e08" stroke="#1e1408" stroke-width="1.5"/>
  <!-- Near arm — swinging forward (toward right) -->
  <line x1="274" y1="175" x2="284" y2="190" stroke="#2a1408" stroke-width="3" stroke-linecap="round"/>
  <!-- Far arm — almost invisible -->
  <line x1="242" y1="174" x2="236" y2="187" stroke="#1a0e08" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Walking legs below -->
  <line x1="248" y1="215" x2="242" y2="242" stroke="#2a1408" stroke-width="3" stroke-linecap="round"/>
  <line x1="260" y1="215" x2="266" y2="240" stroke="#2a1408" stroke-width="3" stroke-linecap="round"/>

  <!-- FIGURE RIGHT (Japheth) — slightly behind, slightly smaller suggesting depth -->
  <!-- Legs -->
  <polygon points="275,215 297,215 294,190 279,188" fill="#2a1408" stroke="#0A0812" stroke-width="2.5"/>
  <polygon points="292,215 314,215 310,190 295,188" fill="#1e0e06" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Body -->
  <polygon points="277,192 312,190 308,162 294,155 280,157 274,170" fill="#1e0e06" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Head -->
  <ellipse cx="293" cy="146" rx="13" ry="14" fill="#1e0e06" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Head cloth -->
  <polygon points="281,142 283,132 291,124 303,125 308,133 306,144 297,139 286,140" fill="#150a04" stroke="#1a0e08" stroke-width="1.5"/>
  <!-- Near arm — forward swing -->
  <line x1="310" y1="178" x2="320" y2="192" stroke="#1e0e06" stroke-width="3" stroke-linecap="round"/>
  <!-- Far arm -->
  <line x1="278" y1="177" x2="270" y2="190" stroke="#150a04" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs below -->
  <line x1="284" y1="215" x2="278" y2="242" stroke="#1e0e06" stroke-width="3" stroke-linecap="round"/>
  <line x1="297" y1="215" x2="304" y2="240" stroke="#1e0e06" stroke-width="3" stroke-linecap="round"/>

  <!-- ============ OPEN RIGHT SIDE — they walk toward uncertainty and future ============ -->
  <!-- Right side of frame is deliberately emptier — they are entering it -->
  <!-- Just the faintest ground texture, no vegetation on the right -->
  <line x1="320" y1="230" x2="400" y2="228" stroke="#1e1408" stroke-width="1" opacity="0.3"/>
</svg>
