<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E8B84B"/>
      <stop offset="40%" stop-color="#c07820"/>
      <stop offset="100%" stop-color="#1c2a3a"/>
    </linearGradient>
    <linearGradient id="ground1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3010"/>
      <stop offset="100%" stop-color="#3d2808"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="300" fill="url(#sky1)"/>

  <!-- White space: open upper-left sky brightening -->
  <ellipse cx="60" cy="40" rx="90" ry="50" fill="#fff8e0" opacity="0.13"/>

  <!-- Ground plane -->
  <rect x="0" y="210" width="400" height="90" fill="url(#ground1)"/>
  <!-- Ground texture lines -->
  <line x1="0" y1="225" x2="400" y2="218" stroke="#1e0e04" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="245" x2="400" y2="238" stroke="#1e0e04" stroke-width="1" opacity="0.3"/>

  <!-- Diagonal path guides converging to ark (upper-right) -->
  <!-- Left path: from lower-left to upper-right -->
  <line x1="0" y1="285" x2="350" y2="195" stroke="#b59050" stroke-width="1.5" opacity="0.35"/>
  <!-- Right path: from lower-right to upper-right -->
  <line x1="400" y1="280" x2="350" y2="195" stroke="#b59050" stroke-width="1.5" opacity="0.35"/>

  <!-- Background: distant trees (small) left -->
  <rect x="48" y="185" width="5" height="22" fill="#1a3010" stroke="#0A0812" stroke-width="1"/>
  <ellipse cx="50" cy="183" rx="10" ry="12" fill="#152515" stroke="#0A0812" stroke-width="1"/>
  <rect x="68" y="190" width="4" height="17" fill="#1a3010" stroke="#0A0812" stroke-width="1"/>
  <ellipse cx="70" cy="188" rx="8" ry="9" fill="#152515" stroke="#0A0812" stroke-width="1"/>

  <!-- ARK — upper-right, warm amber-brown, focal -->
  <!-- Hull -->
  <rect x="285" y="158" width="108" height="42" rx="4" fill="#C87050" stroke="#0A0812" stroke-width="2"/>
  <rect x="288" y="161" width="102" height="36" fill="#8B5E2F" stroke="none"/>
  <!-- Hull planks -->
  <line x1="310" y1="161" x2="310" y2="197" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="335" y1="161" x2="335" y2="197" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="360" y1="161" x2="360" y2="197" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="385" y1="161" x2="385" y2="197" stroke="#6b4420" stroke-width="1.5"/>
  <!-- Superstructure -->
  <rect x="295" y="140" width="85" height="20" rx="2" fill="#a06a35" stroke="#0A0812" stroke-width="2"/>
  <rect x="298" y="143" width="79" height="14" fill="#8B5E2F" stroke="none"/>
  <!-- Roof peak -->
  <polygon points="295,140 380,140 360,128 318,128" fill="#C87050" stroke="#0A0812" stroke-width="2"/>
  <!-- Ark highlight -->
  <rect x="291" y="143" width="6" height="30" fill="#E8B84B" opacity="0.3" rx="1"/>

  <!-- Background: small distant animals (silhouettes) on right path -->
  <!-- Small lion silhouette far right -->
  <ellipse cx="262" cy="205" rx="12" ry="6" fill="#C8A850" stroke="#0A0812" stroke-width="1"/>
  <circle cx="270" cy="200" r="5" fill="#C8A850" stroke="#0A0812" stroke-width="1"/>
  <!-- Mane -->
  <circle cx="270" cy="200" r="7" fill="#a06a35" opacity="0.5" stroke="none"/>
  <!-- Tiny legs -->
  <line x1="256" y1="211" x2="254" y2="218" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="260" y1="211" x2="258" y2="218" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="267" y1="211" x2="265" y2="218" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="271" y1="211" x2="270" y2="218" stroke="#0A0812" stroke-width="1.5"/>

  <!-- Midground: LION PAIR centre-right -->
  <ellipse cx="235" cy="213" rx="22" ry="10" fill="#C8A850" stroke="#0A0812" stroke-width="2"/>
  <circle cx="252" cy="207" r="9" fill="#C8A850" stroke="#0A0812" stroke-width="2"/>
  <circle cx="252" cy="207" r="12" fill="#a06a35" opacity="0.55" stroke="none"/>
  <line x1="222" y1="223" x2="219" y2="234" stroke="#0A0812" stroke-width="2"/>
  <line x1="228" y1="223" x2="226" y2="234" stroke="#0A0812" stroke-width="2"/>
  <line x1="237" y1="223" x2="235" y2="234" stroke="#0A0812" stroke-width="2"/>
  <line x1="243" y1="223" x2="242" y2="234" stroke="#0A0812" stroke-width="2"/>
  <!-- Tail -->
  <path d="M213,218 Q205,210 208,205" stroke="#0A0812" stroke-width="2" fill="none"/>

  <!-- Second lion -->
  <ellipse cx="200" cy="218" rx="18" ry="8" fill="#C8A850" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="215" cy="213" r="7" fill="#C8A850" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="215" cy="213" r="9" fill="#a06a35" opacity="0.45" stroke="none"/>
  <line x1="190" y1="226" x2="188" y2="235" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="196" y1="226" x2="194" y2="235" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="204" y1="226" x2="203" y2="235" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="210" y1="226" x2="209" y2="235" stroke="#0A0812" stroke-width="1.5"/>

  <!-- Midground: GIRAFFE PAIR centre-left -->
  <!-- Giraffe 1 body -->
  <rect x="118" y="190" width="18" height="28" rx="4" fill="#D4A030" stroke="#0A0812" stroke-width="2"/>
  <!-- Neck -->
  <rect x="128" y="155" width="10" height="40" rx="4" fill="#D4A030" stroke="#0A0812" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="133" cy="152" rx="8" ry="6" fill="#D4A030" stroke="#0A0812" stroke-width="2"/>
  <!-- Ossicones -->
  <line x1="130" y1="146" x2="129" y2="138" stroke="#0A0812" stroke-width="2"/>
  <line x1="136" y1="146" x2="137" y2="138" stroke="#0A0812" stroke-width="2"/>
  <!-- Legs -->
  <line x1="122" y1="218" x2="120" y2="240" stroke="#0A0812" stroke-width="2.5"/>
  <line x1="127" y1="218" x2="126" y2="240" stroke="#0A0812" stroke-width="2.5"/>
  <line x1="131" y1="218" x2="130" y2="240" stroke="#0A0812" stroke-width="2.5"/>
  <line x1="136" y1="218" x2="136" y2="240" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Spots -->
  <ellipse cx="122" cy="196" rx="4" ry="3" fill="#a06a35" opacity="0.6"/>
  <ellipse cx="132" cy="202" rx="3" ry="4" fill="#a06a35" opacity="0.6"/>
  <ellipse cx="131" cy="168" rx="3" ry="3" fill="#a06a35" opacity="0.6"/>

  <!-- Giraffe 2 slightly behind -->
  <rect x="100" y="194" width="15" height="24" rx="3" fill="#C8A850" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="108" y="162" width="8" height="35" rx="3" fill="#C8A850" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="112" cy="160" rx="6" ry="5" fill="#C8A850" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="110" y1="155" x2="109" y2="148" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="114" y1="155" x2="115" y2="148" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="103" y1="218" x2="101" y2="237" stroke="#0A0812" stroke-width="2"/>
  <line x1="108" y1="218" x2="107" y2="237" stroke="#0A0812" stroke-width="2"/>
  <line x1="113" y1="218" x2="112" y2="237" stroke="#0A0812" stroke-width="2"/>
  <line x1="116" y1="218" x2="116" y2="237" stroke="#0A0812" stroke-width="2"/>

  <!-- FOREGROUND: ELEPHANT PAIR — large, lower-left, dominant -->
  <!-- Elephant 1 body -->
  <ellipse cx="62" cy="242" rx="52" ry="38" fill="#808080" stroke="#0A0812" stroke-width="3"/>
  <!-- Head -->
  <ellipse cx="100" cy="228" rx="26" ry="24" fill="#808080" stroke="#0A0812" stroke-width="3"/>
  <!-- Ear -->
  <ellipse cx="85" cy="224" rx="14" ry="18" fill="#909090" stroke="#0A0812" stroke-width="2" opacity="0.8"/>
  <!-- Trunk -->
  <path d="M112,238 Q128,250 122,268 Q118,278 112,272" stroke="#0A0812" stroke-width="3" fill="#808080"/>
  <!-- Eye -->
  <circle cx="105" cy="222" r="3" fill="#0A0812"/>
  <circle cx="105" cy="222" r="1.5" fill="#fff8e0"/>
  <!-- Tusk -->
  <path d="M115,240 Q130,238 135,244" stroke="#fff8e0" stroke-width="2.5" fill="none"/>
  <!-- Legs -->
  <rect x="18" y="272" width="16" height="28" rx="4" fill="#707070" stroke="#0A0812" stroke-width="2"/>
  <rect x="40" y="274" width="16" height="26" rx="4" fill="#707070" stroke="#0A0812" stroke-width="2"/>
  <rect x="62" y="273" width="16" height="27" rx="4" fill="#707070" stroke="#0A0812" stroke-width="2"/>
  <rect x="82" y="271" width="16" height="29" rx="4" fill="#707070" stroke="#0A0812" stroke-width="2"/>
  <!-- Tail -->
  <path d="M12,250 Q2,260 6,270" stroke="#0A0812" stroke-width="2" fill="none"/>

  <!-- Elephant 2 (slightly behind, right of first) -->
  <ellipse cx="155" cy="255" rx="40" ry="28" fill="#6e6e6e" stroke="#0A0812" stroke-width="2.5"/>
  <ellipse cx="188" cy="244" rx="20" ry="18" fill="#6e6e6e" stroke="#0A0812" stroke-width="2.5"/>
  <ellipse cx="175" cy="240" rx="11" ry="14" fill="#7e7e7e" stroke="#0A0812" stroke-width="1.5" opacity="0.8"/>
  <path d="M196,252 Q208,260 204,274 Q201,282 196,278" stroke="#0A0812" stroke-width="2.5" fill="#6e6e6e"/>
  <circle cx="193" cy="239" r="2.5" fill="#0A0812"/>
  <circle cx="193" cy="239" r="1.2" fill="#fff8e0"/>
  <path d="M198,254 Q212,252 216,258" stroke="#fff8e0" stroke-width="2" fill="none"/>
  <rect x="135" y="277" width="13" height="23" rx="3" fill="#5e5e5e" stroke="#0A0812" stroke-width="2"/>
  <rect x="153" y="278" width="13" height="22" rx="3" fill="#5e5e5e" stroke="#0A0812" stroke-width="2"/>
  <rect x="170" y="277" width="13" height="23" rx="3" fill="#5e5e5e" stroke="#0A0812" stroke-width="2"/>
  <rect x="185" y="276" width="13" height="24" rx="3" fill="#5e5e5e" stroke="#0A0812" stroke-width="2"/>
</svg>
