<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- DEPTH LAYER 1 — deep interior darkness, background -->
  <rect width="400" height="300" fill="#0a0500"/>

  <!-- Ceiling — heavy dark timber overhead -->
  <rect x="0" y="0" width="400" height="28" fill="#1e0e04" stroke="#0A0812" stroke-width="2"/>
  <!-- Ceiling cross beams receding in perspective -->
  <line x1="0"   y1="10" x2="400" y2="10" stroke="#0a0500" stroke-width="3"/>
  <line x1="0"   y1="20" x2="400" y2="20" stroke="#0a0500" stroke-width="3"/>
  <!-- Ceiling planks -->
  <line x1="60"  y1="0"  x2="60"  y2="28" stroke="#0a0500" stroke-width="2"/>
  <line x1="140" y1="0"  x2="140" y2="28" stroke="#0a0500" stroke-width="2"/>
  <line x1="200" y1="0"  x2="200" y2="28" stroke="#0a0500" stroke-width="2"/>
  <line x1="260" y1="0"  x2="260" y2="28" stroke="#0a0500" stroke-width="2"/>
  <line x1="340" y1="0"  x2="340" y2="28" stroke="#0a0500" stroke-width="2"/>

  <!-- LEFT FOREGROUND POST — massive, fills left edge, depth layer 3 -->
  <rect x="0" y="0" width="52" height="300" fill="#3a1e08" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Post grain lines -->
  <line x1="12"  y1="0"  x2="12"  y2="300" stroke="#2a1506" stroke-width="1"/>
  <line x1="24"  y1="0"  x2="24"  y2="300" stroke="#2a1506" stroke-width="1"/>
  <line x1="36"  y1="0"  x2="36"  y2="300" stroke="#2a1506" stroke-width="1"/>
  <!-- Post edge highlight -->
  <line x1="52"  y1="0"  x2="52"  y2="300" stroke="#1e0e04" stroke-width="2"/>

  <!-- RIGHT FOREGROUND POST — massive, fills right edge -->
  <rect x="348" y="0" width="52" height="300" fill="#3a1e08" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Post grain lines -->
  <line x1="360" y1="0"  x2="360" y2="300" stroke="#2a1506" stroke-width="1"/>
  <line x1="372" y1="0"  x2="372" y2="300" stroke="#2a1506" stroke-width="1"/>
  <line x1="384" y1="0"  x2="384" y2="300" stroke="#2a1506" stroke-width="1"/>
  <!-- Post edge shadow -->
  <line x1="348" y1="0"  x2="348" y2="300" stroke="#1e0e04" stroke-width="2"/>

  <!-- HORIZONTAL BEAM across ceiling connecting posts -->
  <rect x="0" y="28" width="400" height="16" fill="#2a1206" stroke="#0A0812" stroke-width="2"/>
  <line x1="0" y1="36" x2="400" y2="36" stroke="#0a0500" stroke-width="1.5"/>

  <!-- DEPTH LAYER 2 — mid-ground stalls left and right -->
  <!-- LEFT STALL — ox pen, back wall -->
  <rect x="52" y="44" width="130" height="256" fill="#1e0e04" stroke="#0A0812" stroke-width="2"/>
  <!-- Stall wall planks -->
  <line x1="52"  y1="64"  x2="182" y2="64"  stroke="#0a0500" stroke-width="1.5"/>
  <line x1="52"  y1="88"  x2="182" y2="88"  stroke="#0a0500" stroke-width="1.5"/>
  <line x1="52"  y1="112" x2="182" y2="112" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="52"  y1="136" x2="182" y2="136" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="52"  y1="160" x2="182" y2="160" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="52"  y1="188" x2="182" y2="188" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="52"  y1="216" x2="182" y2="216" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="52"  y1="244" x2="182" y2="244" stroke="#0a0500" stroke-width="1.5"/>
  <!-- Stall gate bars -->
  <rect x="52" y="180" width="130" height="10" fill="#8B5E2F" stroke="#0A0812" stroke-width="2"/>
  <rect x="52" y="200" width="130" height="8"  fill="#8B5E2F" stroke="#0A0812" stroke-width="2"/>
  <!-- OX in left stall — head only, looming large -->
  <!-- Ox neck/chest mass -->
  <ellipse cx="108" cy="245" rx="44" ry="38" fill="#2a1408" stroke="#0A0812" stroke-width="2"/>
  <!-- Ox head — prominent, close -->
  <ellipse cx="96"  cy="210" rx="32" ry="26" fill="#3a1e08" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Ox muzzle -->
  <ellipse cx="76"  cy="218" rx="16" ry="12" fill="#2a1408" stroke="#0A0812" stroke-width="2"/>
  <!-- Nostrils -->
  <ellipse cx="70"  cy="218" rx="4"  ry="3"  fill="#1e0e04"/>
  <ellipse cx="82"  cy="219" rx="4"  ry="3"  fill="#1e0e04"/>
  <!-- Ox eye — dark, liquid -->
  <ellipse cx="108" cy="205" rx="6"  ry="6"  fill="#0a0500" stroke="#5a3010" stroke-width="1.5"/>
  <circle  cx="110" cy="203" r="2"           fill="#5a3010" opacity="0.6"/>
  <!-- Horns -->
  <path d="M82,192 Q72,178 60,170" stroke="#6b4420" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M114,190 Q120,175 128,168" stroke="#6b4420" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Ear -->
  <ellipse cx="124" cy="198" rx="10" ry="7" fill="#3a1e08" stroke="#0A0812" stroke-width="1.5" transform="rotate(-20,124,198)"/>

  <!-- RIGHT STALL — sheep pen, back wall -->
  <rect x="218" y="44" width="130" height="256" fill="#1e0e04" stroke="#0A0812" stroke-width="2"/>
  <!-- Stall wall planks -->
  <line x1="218" y1="64"  x2="348" y2="64"  stroke="#0a0500" stroke-width="1.5"/>
  <line x1="218" y1="88"  x2="348" y2="88"  stroke="#0a0500" stroke-width="1.5"/>
  <line x1="218" y1="112" x2="348" y2="112" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="218" y1="136" x2="348" y2="136" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="218" y1="160" x2="348" y2="160" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="218" y1="188" x2="348" y2="188" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="218" y1="216" x2="348" y2="216" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="218" y1="244" x2="348" y2="244" stroke="#0a0500" stroke-width="1.5"/>
  <!-- Gate bars right stall -->
  <rect x="218" y="180" width="130" height="10" fill="#8B5E2F" stroke="#0A0812" stroke-width="2"/>
  <rect x="218" y="200" width="130" height="8"  fill="#8B5E2F" stroke="#0A0812" stroke-width="2"/>
  <!-- SHEEP in right stall — woolly body, prominent -->
  <ellipse cx="292" cy="248" rx="40" ry="28" fill="#302a24" stroke="#0A0812" stroke-width="2"/>
  <!-- Wool texture bumps -->
  <ellipse cx="268" cy="232" rx="16" ry="12" fill="#362e28" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="290" cy="226" rx="18" ry="13" fill="#362e28" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="314" cy="232" rx="16" ry="12" fill="#362e28" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Sheep head -->
  <ellipse cx="254" cy="223" rx="18" ry="16" fill="#282220" stroke="#0A0812" stroke-width="2"/>
  <!-- Sheep muzzle -->
  <ellipse cx="240" cy="228" rx="10" ry="8"  fill="#201c1a" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Sheep eye -->
  <ellipse cx="254" cy="218" rx="4"  ry="4"  fill="#0a0500" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Sheep legs -->
  <rect x="258" y="270" width="8" height="28" fill="#2a2420" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="272" y="270" width="8" height="28" fill="#2a2420" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="306" y="270" width="8" height="28" fill="#2a2420" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="322" y="270" width="8" height="28" fill="#2a2420" stroke="#0A0812" stroke-width="1.5"/>

  <!-- CENTRE AISLE — the passage between stalls -->
  <rect x="182" y="44" width="36" height="256" fill="#120800"/>
  <!-- Aisle floor planks -->
  <line x1="182" y1="80"  x2="218" y2="80"  stroke="#0a0500" stroke-width="1"/>
  <line x1="182" y1="110" x2="218" y2="110" stroke="#0a0500" stroke-width="1"/>
  <line x1="182" y1="140" x2="218" y2="140" stroke="#0a0500" stroke-width="1"/>
  <line x1="182" y1="170" x2="218" y2="170" stroke="#0a0500" stroke-width="1"/>
  <line x1="182" y1="200" x2="218" y2="200" stroke="#0a0500" stroke-width="1"/>
  <line x1="182" y1="230" x2="218" y2="230" stroke="#0a0500" stroke-width="1"/>
  <line x1="182" y1="260" x2="218" y2="260" stroke="#0a0500" stroke-width="1"/>

  <!-- BACKGROUND CORRIDOR — receding darkness, far back depth cue -->
  <!-- Perspective corridor walls meeting at vanishing point ~(200, 44) -->
  <polygon points="52,300 100,44 182,44 182,300"  fill="#140a02" opacity="0.80"/>
  <polygon points="348,300 300,44 218,44 218,300" fill="#140a02" opacity="0.80"/>
  <!-- Corridor far-back glow — a second lantern very far away, tiny -->
  <ellipse cx="200" cy="56" rx="18" ry="10" fill="#E8B84B" opacity="0.22"/>
  <ellipse cx="200" cy="56" rx="8"  ry="5"  fill="#E8B84B" opacity="0.35"/>
  <!-- Tiny lantern body far back -->
  <rect x="196" y="50" width="8" height="10" fill="#c8a030" opacity="0.60" stroke="#6b4420" stroke-width="1"/>
  <!-- Small family figure walking far corridor -->
  <rect x="196" y="68" width="8"  height="20" fill="#1e0e04" rx="1"/>
  <ellipse cx="200" cy="65" rx="5" ry="5"    fill="#1e0e04"/>
  <polygon points="194,88 192,108 208,108 206,88" fill="#1e0e04"/>

  <!-- DEPTH LAYER 3 — CENTRAL LANTERN — THE focal point, only light source -->
  <!-- Lantern hanging chain/rope from beam -->
  <line x1="200" y1="44" x2="200" y2="60" stroke="#6b4420" stroke-width="3"/>
  <!-- Warm cone of light downward — primary glow volume -->
  <polygon points="170,60 230,60 280,170 120,170" fill="#E8B84B" opacity="0.10"/>
  <polygon points="180,60 220,60 260,155 140,155" fill="#E8B84B" opacity="0.12"/>
  <polygon points="186,60 214,60 244,140 156,140" fill="#E8B84B" opacity="0.14"/>
  <!-- Outer ambient glow halo -->
  <ellipse cx="200" cy="80"  rx="80" ry="55" fill="#E8B84B" opacity="0.12"/>
  <ellipse cx="200" cy="80"  rx="50" ry="35" fill="#E8B84B" opacity="0.16"/>
  <ellipse cx="200" cy="74"  rx="30" ry="22" fill="#E8B84B" opacity="0.22"/>
  <!-- Lantern body -->
  <rect x="190" y="60" width="20" height="26" fill="#c8a030" stroke="#8B5E2F" stroke-width="2.5"/>
  <!-- Lantern cap -->
  <polygon points="188,60 212,60 208,52 192,52" fill="#a07828" stroke="#6b4420" stroke-width="2"/>
  <!-- Lantern top knob -->
  <rect x="197" y="46" width="6" height="6" fill="#6b4420" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Lantern glass panels — warm amber -->
  <rect x="192" y="62" width="7"  height="22" fill="#E8B84B" opacity="0.85" rx="1"/>
  <rect x="201" y="62" width="7"  height="22" fill="#C87050" opacity="0.75" rx="1"/>
  <!-- Lantern frame bars -->
  <line x1="190" y1="72" x2="210" y2="72" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="200" y1="60" x2="200" y2="86" stroke="#6b4420" stroke-width="1.5"/>
  <!-- Bottom of lantern -->
  <line x1="190" y1="86" x2="210" y2="86" stroke="#8B5E2F" stroke-width="2"/>
  <!-- Flame inner glow -->
  <ellipse cx="200" cy="70" rx="5" ry="7" fill="#fff8e0" opacity="0.90"/>
  <ellipse cx="200" cy="68" rx="3" ry="4" fill="#ffffff"   opacity="0.70"/>

  <!-- Floor — straw-covered dark planks -->
  <rect x="52" y="272" width="296" height="28" fill="#1e1208" stroke="#0A0812" stroke-width="2"/>
  <line x1="52"  y1="282" x2="348" y2="282" stroke="#0a0500" stroke-width="1.5"/>
  <line x1="52"  y1="292" x2="348" y2="292" stroke="#0a0500" stroke-width="1.5"/>
  <!-- Straw scatter marks -->
  <line x1="68"  y1="275" x2="82"  y2="279" stroke="#3a2a10" stroke-width="1"/>
  <line x1="100" y1="278" x2="112" y2="274" stroke="#3a2a10" stroke-width="1"/>
  <line x1="148" y1="276" x2="160" y2="280" stroke="#3a2a10" stroke-width="1"/>
  <line x1="222" y1="277" x2="236" y2="274" stroke="#3a2a10" stroke-width="1"/>
  <line x1="268" y1="275" x2="280" y2="279" stroke="#3a2a10" stroke-width="1"/>
  <line x1="316" y1="276" x2="328" y2="273" stroke="#3a2a10" stroke-width="1"/>

</svg>
