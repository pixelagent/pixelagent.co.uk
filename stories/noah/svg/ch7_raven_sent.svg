<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- DEPTH LAYER 1 — vast, empty pale grey sky — the dominant element -->
  <!-- Sky fills approximately 75% of frame — lonely, open, vast -->
  <rect width="400" height="300" fill="#9aaab8"/>

  <!-- Sky tonal bands — lighter at top horizon edges, slightly heavier mid -->
  <rect x="0" y="0"   width="400" height="160" fill="#9aaeba"/>
  <rect x="0" y="0"   width="400" height="80"  fill="#a4b6c2"/>
  <rect x="0" y="0"   width="400" height="35"  fill="#aabec8"/>
  <!-- Thin, high, scattered cloud wisps — vast sky, few clouds -->
  <ellipse cx="50"  cy="22"  rx="70"  ry="14" fill="#b8c8d2" opacity="0.70"/>
  <ellipse cx="210" cy="14"  rx="100" ry="12" fill="#bac8d4" opacity="0.65"/>
  <ellipse cx="370" cy="25"  rx="80"  ry="13" fill="#b4c4d0" opacity="0.65"/>
  <ellipse cx="130" cy="42"  rx="75"  ry="11" fill="#aec0ca" opacity="0.55"/>
  <ellipse cx="320" cy="48"  rx="90"  ry="13" fill="#a8bcc8" opacity="0.55"/>
  <!-- Mid-sky heavier cloud layer — gives scale/texture to the sky -->
  <ellipse cx="60"  cy="78"  rx="90"  ry="20" fill="#98a8b6" opacity="0.50"/>
  <ellipse cx="210" cy="68"  rx="110" ry="18" fill="#9aaabb" opacity="0.45"/>
  <ellipse cx="380" cy="82"  rx="80"  ry="18" fill="#98a8b6" opacity="0.45"/>
  <ellipse cx="140" cy="100" rx="100" ry="20" fill="#8e9eac" opacity="0.45"/>
  <ellipse cx="340" cy="96"  rx="100" ry="20" fill="#8e9eac" opacity="0.40"/>
  <!-- Lower clouds — heavier, denser, converging toward ark -->
  <ellipse cx="200" cy="120" rx="90"  ry="18" fill="#8898a8" opacity="0.40"/>
  <ellipse cx="60"  cy="128" rx="80"  ry="16" fill="#8498a6" opacity="0.38"/>
  <ellipse cx="360" cy="125" rx="80"  ry="16" fill="#8498a6" opacity="0.35"/>

  <!-- DEPTH LAYER 2 — thin horizon water band and ark -->
  <!-- Water — dark strip at very bottom, vast flood below -->
  <rect x="0" y="228" width="400" height="72" fill="#1a2c40"/>
  <rect x="0" y="226" width="400" height="6"  fill="#2a4060" opacity="0.60"/>
  <!-- Water shimmer lines -->
  <line x1="0" y1="236" x2="400" y2="236" stroke="#4E9CCD" stroke-width="1.2" opacity="0.24"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#4E9CCD" stroke-width="1"   opacity="0.18"/>
  <line x1="0" y1="268" x2="400" y2="268" stroke="#4E9CCD" stroke-width="1"   opacity="0.14"/>
  <line x1="0" y1="288" x2="400" y2="288" stroke="#4E9CCD" stroke-width="1"   opacity="0.11"/>

  <!-- THE ARK — small, at bottom of frame, below the raven -->
  <!-- Hull -->
  <polygon points="140,250 260,250 270,268 130,268" fill="#8B5E2F" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Hull shading lower -->
  <polygon points="140,260 260,260 270,268 130,268" fill="#6b4420"/>
  <!-- Hull planks -->
  <line x1="147" y1="257" x2="253" y2="257" stroke="#5a3010" stroke-width="1"/>
  <line x1="144" y1="264" x2="256" y2="264" stroke="#5a3010" stroke-width="1"/>
  <!-- Superstructure -->
  <rect x="154" y="234" width="92" height="16" fill="#a06a35" stroke="#0A0812" stroke-width="2"/>
  <!-- Cabin planks -->
  <line x1="172" y1="234" x2="172" y2="250" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="192" y1="234" x2="192" y2="250" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="212" y1="234" x2="212" y2="250" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="232" y1="234" x2="232" y2="250" stroke="#8B5E2F" stroke-width="1"/>
  <!-- Roof -->
  <polygon points="143,234 200,218 257,234" fill="#C87050" stroke="#0A0812" stroke-width="2"/>
  <!-- Roof planks -->
  <line x1="160" y1="234" x2="168" y2="218" stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="180" y1="234" x2="186" y2="218" stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="200" y1="234" x2="200" y2="218" stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="220" y1="234" x2="214" y2="218" stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="240" y1="234" x2="232" y2="218" stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <!-- Small window — open, tiny arm extending -->
  <rect x="191" y="220" width="18" height="12" fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <!-- NOAH'S TINY ARM — extending from window, pointing UP toward raven -->
  <!-- Small arm/hand from window -->
  <line x1="200" y1="224" x2="200" y2="212" stroke="#D4956A" stroke-width="4"  stroke-linecap="round"/>
  <line x1="200" y1="212" x2="198" y2="206" stroke="#D4956A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Tiny pointing finger -->
  <line x1="200" y1="212" x2="202" y2="205" stroke="#D4956A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- VAST WHITE SPACE — empty sky between bird and ark is intentional -->

  <!-- DEPTH LAYER 3 — THE RAVEN — large, dominant, upper-centre -->
  <!-- The raven COMMANDS the upper frame — wings fully spread, flying away (back to viewer) -->

  <!-- Wing shadow/depth -->
  <polygon points="200,92 120,68 118,82 185,100" fill="#060408" stroke="none"/>
  <polygon points="200,92 280,68 282,82 215,100" fill="#060408" stroke="none"/>

  <!-- LEFT WING — fully spread, sweeping up-left -->
  <polygon points="196,96 112,64 108,78 180,104" fill="#0a0812" stroke="#0A0812" stroke-width="2"/>
  <!-- Left wing secondary feathers — inner -->
  <polygon points="180,104 108,78 112,88 175,110" fill="#0c0a14" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Left wingtip primary feathers — long, spread -->
  <polygon points="112,64 90,72  94,84  108,78"  fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <polygon points="112,64 88,66  90,78  106,76"  fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <polygon points="112,64 84,62  87,74  104,74"  fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <polygon points="112,64 80,58  84,70  102,72"  fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Left wing feather separation lines -->
  <line x1="150" y1="78"  x2="170" y2="106" stroke="#060408" stroke-width="1.5"/>
  <line x1="135" y1="74"  x2="158" y2="104" stroke="#060408" stroke-width="1.5"/>
  <line x1="120" y1="70"  x2="145" y2="100" stroke="#060408" stroke-width="1.5"/>

  <!-- RIGHT WING — mirror, fully spread, sweeping up-right -->
  <polygon points="204,96 288,64 292,78 220,104" fill="#0a0812" stroke="#0A0812" stroke-width="2"/>
  <!-- Right wing secondary feathers -->
  <polygon points="220,104 292,78 288,88 225,110" fill="#0c0a14" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Right wingtip primary feathers -->
  <polygon points="288,64 310,72 306,84 292,78"  fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <polygon points="288,64 312,66 310,78 294,76"  fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <polygon points="288,64 316,62 313,74 296,74"  fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <polygon points="288,64 320,58 316,70 298,72"  fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Right wing feather separation lines -->
  <line x1="250" y1="78"  x2="230" y2="106" stroke="#060408" stroke-width="1.5"/>
  <line x1="265" y1="74"  x2="242" y2="104" stroke="#060408" stroke-width="1.5"/>
  <line x1="280" y1="70"  x2="255" y2="100" stroke="#060408" stroke-width="1.5"/>

  <!-- RAVEN BODY — between wing roots -->
  <ellipse cx="200" cy="104" rx="22" ry="12" fill="#0a0812" stroke="#0A0812" stroke-width="2"/>
  <!-- RAVEN HEAD — facing away, seen from behind -->
  <ellipse cx="200" cy="92"  rx="14" ry="12" fill="#0a0812" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Beak — short, seen from back-top -->
  <polygon points="196,86 204,86 200,80" fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <!-- TAIL FEATHERS — splayed downward -->
  <polygon points="192,114 184,132 188,134 192,122 200,134 208,122 212,134 216,132 208,114"
           fill="#0a0812" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Wing iridescence hint — very subtle sheen on inner wing -->
  <ellipse cx="160" cy="86"  rx="22" ry="10" fill="#1a1828" opacity="0.30" transform="rotate(-25,160,86)"/>
  <ellipse cx="240" cy="86"  rx="22" ry="10" fill="#1a1828" opacity="0.30" transform="rotate(25,240,86)"/>

  <!-- Subtle flight-path dashed line — raven came from ark window below, arcing up -->
  <path d="M200,212 Q200,180 200,134" stroke="#8898a8" stroke-width="1.5" fill="none" stroke-dasharray="5,7" opacity="0.40"/>

</svg>
