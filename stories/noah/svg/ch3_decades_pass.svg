<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- ===== BACKGROUND: Sky — cool left to warm right ===== -->
  <!-- Left half sky: cool blue-grey dawn -->
  <rect x="0" y="0" width="185" height="300" fill="#1c2a3a"/>
  <rect x="0" y="0" width="185" height="160" fill="#14203a"/>
  <!-- Right half sky: warm amber afternoon -->
  <rect x="185" y="0" width="215" height="300" fill="#3d2808"/>
  <rect x="185" y="0" width="215" height="160" fill="#281808"/>
  <!-- Warm sky glow right upper -->
  <ellipse cx="340" cy="55" rx="130" ry="80" fill="#c4956a" opacity="0.18"/>
  <ellipse cx="360" cy="30" rx="90" ry="50" fill="#E8B84B" opacity="0.12"/>

  <!-- ===== SUN ARC — bridges both halves, unifying the composition ===== -->
  <!-- Single bold semicircle tracking time: cool left edge to warm right edge -->
  <path d="M 12,145 Q 200,-18 390,145" fill="none" stroke="#E8B84B" stroke-width="3" stroke-dasharray="14,7" stroke-linecap="round"/>
  <!-- Sun positions: dawn (left, small, cool) and afternoon (right, larger, warm) -->
  <circle cx="28" cy="138" r="8" fill="#2a3d50" stroke="#c4956a" stroke-width="2"/>
  <!-- Midpoint sun at arc peak -->
  <circle cx="200" cy="20" r="6" fill="#E8B84B" opacity="0.7"/>
  <!-- Afternoon sun (right, bright) -->
  <circle cx="372" cy="140" r="11" fill="#E8B84B" stroke="#C87050" stroke-width="2"/>
  <!-- Afternoon sun rays -->
  <line x1="372" y1="124" x2="372" y2="118" stroke="#E8B84B" stroke-width="2"/>
  <line x1="383" y1="128" x2="388" y2="123" stroke="#E8B84B" stroke-width="2"/>
  <line x1="387" y1="140" x2="393" y2="140" stroke="#E8B84B" stroke-width="2"/>

  <!-- ===== VERTICAL DIVIDING LINE — slightly left of centre ===== -->
  <line x1="185" y1="0" x2="185" y2="300" stroke="#5a3e18" stroke-width="2.5" stroke-dasharray="10,5"/>

  <!-- ===== CONTINUOUS GROUND — both halves ===== -->
  <!-- Left ground: cooler earth tone -->
  <rect x="0" y="248" width="185" height="52" fill="#4a3010"/>
  <rect x="0" y="242" width="185" height="10" fill="#5a3e18"/>
  <!-- Right ground: warmer earth tone -->
  <rect x="185" y="248" width="215" height="52" fill="#3d2808"/>
  <rect x="185" y="242" width="215" height="10" fill="#5a3010"/>

  <!-- ===== LEFT HALF: SKELETON — ribs, sparse, cool tones ===== -->
  <!-- Keel left -->
  <rect x="15" y="234" width="162" height="11" rx="3" fill="#8B5E2F" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Keel notches -->
  <rect x="45" y="234" width="7" height="11" fill="#5a3010" stroke="#0A0812" stroke-width="1"/>
  <rect x="85" y="234" width="7" height="11" fill="#5a3010" stroke="#0A0812" stroke-width="1"/>
  <rect x="125" y="234" width="7" height="11" fill="#5a3010" stroke="#0A0812" stroke-width="1"/>
  <rect x="158" y="234" width="7" height="11" fill="#5a3010" stroke="#0A0812" stroke-width="1"/>

  <!-- Skeleton ribs — 4 bare arches, widely spaced, cool blue-grey tones -->
  <!-- Rib A -->
  <path d="M 38,244 Q 36,208 48,178 Q 60,150 70,140" fill="none" stroke="#8B5E2F" stroke-width="5" stroke-linecap="round"/>
  <path d="M 38,244 Q 36,208 48,178 Q 60,150 70,140" fill="none" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Rib B -->
  <path d="M 78,244 Q 76,202 84,166 Q 92,134 98,122" fill="none" stroke="#8B5E2F" stroke-width="5" stroke-linecap="round"/>
  <path d="M 78,244 Q 76,202 84,166 Q 92,134 98,122" fill="none" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Rib C (tallest left-side rib) -->
  <path d="M 120,244 Q 118,196 122,156 Q 126,120 128,108" fill="none" stroke="#8B5E2F" stroke-width="5" stroke-linecap="round"/>
  <path d="M 120,244 Q 118,196 122,156 Q 126,120 128,108" fill="none" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Rib D (partial, near divider) -->
  <path d="M 158,244 Q 160,210 158,182 Q 158,162 157,154" fill="none" stroke="#6b4420" stroke-width="4" stroke-linecap="round"/>
  <path d="M 158,244 Q 160,210 158,182 Q 158,162 157,154" fill="none" stroke="#0A0812" stroke-width="1.5"/>

  <!-- Sparse cross-beams on skeleton (rhythm — begin of stringer pattern) -->
  <path d="M 44,180 Q 88,172 128,168" fill="none" stroke="#6b4420" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40,206 Q 88,200 140,202" fill="none" stroke="#6b4420" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Small scaffold left side -->
  <line x1="24" y1="180" x2="24" y2="244" stroke="#5a3010" stroke-width="3"/>
  <line x1="24" y1="200" x2="44" y2="200" stroke="#5a3010" stroke-width="2"/>
  <line x1="24" y1="222" x2="44" y2="222" stroke="#5a3010" stroke-width="2"/>

  <!-- ===== RIGHT HALF: COMPLETED HULL + CABIN ===== -->
  <!-- Hull body — warm amber brown, fully planked -->
  <path d="M 185,244 Q 196,210 210,194 L 360,194 Q 374,200 382,244 Z" fill="#5a3010" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Hull planks — close rhythm of vertical lines becoming horizontal stringer-like -->
  <line x1="218" y1="194" x2="208" y2="244" stroke="#0A0812" stroke-width="1.5" opacity="0.7"/>
  <line x1="242" y1="194" x2="234" y2="244" stroke="#0A0812" stroke-width="1.5" opacity="0.7"/>
  <line x1="266" y1="194" x2="260" y2="244" stroke="#0A0812" stroke-width="1.5" opacity="0.7"/>
  <line x1="290" y1="194" x2="286" y2="244" stroke="#0A0812" stroke-width="1.5" opacity="0.7"/>
  <line x1="314" y1="194" x2="312" y2="244" stroke="#0A0812" stroke-width="1.5" opacity="0.7"/>
  <line x1="338" y1="194" x2="338" y2="244" stroke="#0A0812" stroke-width="1.5" opacity="0.7"/>
  <line x1="360" y1="194" x2="362" y2="244" stroke="#0A0812" stroke-width="1.5" opacity="0.7"/>
  <!-- Hull top rail -->
  <rect x="206" y="191" width="180" height="6" rx="2" fill="#8B5E2F" stroke="#0A0812" stroke-width="2"/>

  <!-- Cabin / superstructure on top of hull — warm wood -->
  <rect x="222" y="158" width="142" height="36" rx="3" fill="#8B5E2F" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Cabin plank lines (rhythm — ribs become planks) -->
  <line x1="248" y1="158" x2="248" y2="194" stroke="#0A0812" stroke-width="1.5" opacity="0.5"/>
  <line x1="275" y1="158" x2="275" y2="194" stroke="#0A0812" stroke-width="1.5" opacity="0.5"/>
  <line x1="302" y1="158" x2="302" y2="194" stroke="#0A0812" stroke-width="1.5" opacity="0.5"/>
  <line x1="329" y1="158" x2="329" y2="194" stroke="#0A0812" stroke-width="1.5" opacity="0.5"/>
  <!-- Cabin roof -->
  <polygon points="214,158 293,138 368,158" fill="#6b4420" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Roof ridge pole -->
  <line x1="214" y1="158" x2="368" y2="158" stroke="#0A0812" stroke-width="2"/>
  <!-- Windows on cabin -->
  <rect x="232" y="166" width="18" height="12" rx="2" fill="#c4956a" stroke="#0A0812" stroke-width="2"/>
  <rect x="263" y="166" width="18" height="12" rx="2" fill="#c4956a" stroke="#0A0812" stroke-width="2"/>
  <rect x="294" y="166" width="18" height="12" rx="2" fill="#c4956a" stroke="#0A0812" stroke-width="2"/>
  <rect x="325" y="166" width="18" height="12" rx="2" fill="#c4956a" stroke="#0A0812" stroke-width="2"/>

</svg>
