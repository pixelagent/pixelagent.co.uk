<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyLd" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c07020"/>
      <stop offset="55%" stop-color="#2a3d50"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="rampGrad" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C87050"/>
      <stop offset="50%" stop-color="#8B5E2F"/>
      <stop offset="100%" stop-color="#6b4420"/>
    </linearGradient>
    <linearGradient id="arkHull" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6b4420"/>
      <stop offset="100%" stop-color="#8B5E2F"/>
    </linearGradient>
  </defs>

  <!-- Sky — open space on right (white space) -->
  <rect width="400" height="300" fill="url(#skyLd)"/>

  <!-- Sky glow near horizon lower-right — open white space area -->
  <ellipse cx="340" cy="195" rx="90" ry="65" fill="#E8B84B" opacity="0.12"/>
  <ellipse cx="360" cy="220" rx="70" ry="50" fill="#fff8e0" opacity="0.07"/>

  <!-- Ground/base plane -->
  <rect x="0" y="248" width="400" height="52" fill="#3d2808"/>
  <line x1="0" y1="252" x2="400" y2="248" stroke="#1e0e04" stroke-width="1.5" opacity="0.6"/>

  <!-- FOREGROUND: pile of goods at ramp foot (lower-right) -->
  <!-- Grain sacks -->
  <ellipse cx="372" cy="256" rx="18" ry="12" fill="#b59050" stroke="#0A0812" stroke-width="2"/>
  <ellipse cx="355" cy="252" rx="14" ry="9" fill="#a08040" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="385" cy="252" rx="12" ry="8" fill="#b59050" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Sack ties -->
  <line x1="372" y1="244" x2="372" y2="248" stroke="#0A0812" stroke-width="2"/>
  <line x1="355" y1="243" x2="355" y2="246" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Clay jars -->
  <path d="M340,248 Q335,238 340,228 Q345,238 340,248" fill="#C87050" stroke="#0A0812" stroke-width="2"/>
  <ellipse cx="340" cy="228" rx="6" ry="3" fill="#a06a35" stroke="#0A0812" stroke-width="1.5"/>
  <path d="M325,252 Q320,242 325,232 Q330,242 325,252" fill="#8B5E2F" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Baskets -->
  <path d="M308,256 Q304,248 310,242 Q316,248 312,256 Z" fill="#a06a35" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="307" y1="249" x2="313" y2="249" stroke="#0A0812" stroke-width="1"/>
  <line x1="306" y1="252" x2="314" y2="252" stroke="#0A0812" stroke-width="1"/>

  <!-- Background waiting animals (lower-left behind ramp foot) -->
  <!-- Sheep 1 -->
  <ellipse cx="24" cy="258" rx="14" ry="9" fill="#f0f0f0" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="35" cy="254" r="7" fill="#f0f0f0" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="18" y1="267" x2="17" y2="276" stroke="#0A0812" stroke-width="2"/>
  <line x1="25" y1="267" x2="24" y2="276" stroke="#0A0812" stroke-width="2"/>
  <line x1="31" y1="267" x2="31" y2="276" stroke="#0A0812" stroke-width="2"/>
  <!-- Sheep 2 -->
  <ellipse cx="58" cy="260" rx="12" ry="8" fill="#e8e8e8" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="68" cy="256" r="6" fill="#e8e8e8" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="52" y1="268" x2="51" y2="276" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="59" y1="268" x2="58" y2="276" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="65" y1="268" x2="64" y2="276" stroke="#0A0812" stroke-width="1.5"/>

  <!-- THE ARK HULL — upper-left, partial, dark -->
  <!-- Main hull visible lower portion -->
  <rect x="-10" y="50" width="200" height="110" rx="4" fill="url(#arkHull)" stroke="#0A0812" stroke-width="3"/>
  <!-- Hull planks vertical -->
  <line x1="20" y1="52" x2="20" y2="158" stroke="#6b4420" stroke-width="2"/>
  <line x1="48" y1="52" x2="48" y2="158" stroke="#6b4420" stroke-width="2"/>
  <line x1="76" y1="52" x2="76" y2="158" stroke="#6b4420" stroke-width="2"/>
  <line x1="104" y1="52" x2="104" y2="158" stroke="#6b4420" stroke-width="2"/>
  <line x1="132" y1="52" x2="132" y2="158" stroke="#6b4420" stroke-width="2"/>
  <line x1="160" y1="52" x2="160" y2="158" stroke="#6b4420" stroke-width="2"/>
  <!-- Hull horizontal banding -->
  <line x1="-10" y1="90" x2="190" y2="90" stroke="#6b4420" stroke-width="1.5" opacity="0.6"/>
  <line x1="-10" y1="120" x2="190" y2="120" stroke="#6b4420" stroke-width="1.5" opacity="0.6"/>
  <!-- Door opening in hull — with torchlight glow within -->
  <rect x="55" y="120" width="42" height="38" rx="2" fill="#060c18" stroke="#0A0812" stroke-width="2"/>
  <rect x="58" y="123" width="36" height="32" fill="#1c0e04" opacity="0.8"/>
  <ellipse cx="76" cy="155" rx="18" ry="5" fill="#E8B84B" opacity="0.25"/>

  <!-- THE RAMP — bold diagonal from lower-right to upper-left (MAIN EMPHASIS) -->
  <!-- Ramp plank surface -->
  <polygon points="390,280 290,280 90,160 190,160" fill="url(#rampGrad)" stroke="#0A0812" stroke-width="3"/>
  <!-- Ramp planks (cross-grain texture) -->
  <line x1="356" y1="280" x2="156" y2="160" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="322" y1="280" x2="122" y2="160" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="288" y1="280" x2="88" y2="160" stroke="#6b4420" stroke-width="1.5" opacity="0.7"/>
  <!-- Ramp cross-supports -->
  <line x1="350" y1="267" x2="240" y2="267" stroke="#5a3820" stroke-width="2" opacity="0.8"/>
  <line x1="318" y1="252" x2="208" y2="252" stroke="#5a3820" stroke-width="2" opacity="0.8"/>
  <line x1="286" y1="237" x2="176" y2="237" stroke="#5a3820" stroke-width="2" opacity="0.8"/>
  <line x1="252" y1="220" x2="142" y2="220" stroke="#5a3820" stroke-width="2" opacity="0.7"/>
  <line x1="218" y1="205" x2="108" y2="205" stroke="#5a3820" stroke-width="2" opacity="0.7"/>
  <!-- Ramp side rails -->
  <line x1="290" y1="280" x2="90" y2="160" stroke="#0A0812" stroke-width="2.5"/>
  <line x1="390" y1="280" x2="190" y2="160" stroke="#0A0812" stroke-width="2.5"/>

  <!-- 3 FIGURES on ramp, diminishing in size (perspective) -->
  <!-- Figure 1 — largest, at ramp foot (lower-right) -->
  <!-- Bundle on back -->
  <ellipse cx="354" cy="256" rx="10" ry="8" fill="#a06a35" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Body leaning forward-up -->
  <ellipse cx="348" cy="265" rx="8" ry="12" fill="#8B5E2F" stroke="#0A0812" stroke-width="2"/>
  <!-- Head -->
  <circle cx="352" cy="254" r="7" fill="#D4956A" stroke="#0A0812" stroke-width="2"/>
  <!-- Arm reaching up -->
  <line x1="352" y1="264" x2="362" y2="258" stroke="#0A0812" stroke-width="2"/>
  <!-- Legs striding up -->
  <line x1="344" y1="276" x2="340" y2="290" stroke="#0A0812" stroke-width="2.5"/>
  <line x1="350" y1="276" x2="354" y2="290" stroke="#0A0812" stroke-width="2.5"/>

  <!-- Figure 2 — medium, mid-ramp -->
  <ellipse cx="268" cy="232" rx="8" ry="6" fill="#a06a35" stroke="#0A0812" stroke-width="1.5"/>
  <ellipse cx="263" cy="240" rx="6" ry="9" fill="#4A6A2A" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="266" cy="231" r="5.5" fill="#D4956A" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="266" y1="238" x2="274" y2="234" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="259" y1="248" x2="256" y2="260" stroke="#0A0812" stroke-width="2"/>
  <line x1="264" y1="248" x2="267" y2="260" stroke="#0A0812" stroke-width="2"/>

  <!-- Figure 3 — smallest, near top of ramp / ark entrance -->
  <ellipse cx="180" cy="198" rx="5" ry="4" fill="#a06a35" stroke="#0A0812" stroke-width="1"/>
  <ellipse cx="177" cy="205" rx="4" ry="7" fill="#C87050" stroke="#0A0812" stroke-width="1.5"/>
  <circle cx="179" cy="198" r="4" fill="#D4956A" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="179" y1="204" x2="185" y2="201" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="174" y1="212" x2="172" y2="222" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="179" y1="212" x2="181" y2="222" stroke="#0A0812" stroke-width="1.5"/>
</svg>
