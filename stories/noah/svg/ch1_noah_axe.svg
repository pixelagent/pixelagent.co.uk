<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- ═══ BACKGROUND: near-total darkness ═══ -->
  <rect width="400" height="300" fill="#0c0604"/>
  <!-- Subtle shadow gradation — lighter near impact zone -->
  <ellipse cx="280" cy="220" rx="160" ry="110" fill="#14100a" opacity="0.70"/>
  <ellipse cx="300" cy="240" rx="120" ry="80"  fill="#1a0e04" opacity="0.55"/>

  <!-- ═══ LOG — lower-right, angled slightly, cross-section visible ═══ -->
  <!-- Log body — diagonal, tip goes lower-right -->
  <polygon points="180,240 400,218 400,268 180,290" fill="#6b4420" stroke="#1a0e04" stroke-width="3"/>
  <!-- Top face of log — lighter grain surface -->
  <polygon points="180,240 400,218 400,228 180,250" fill="#8B5E2F" stroke="#1a0e04" stroke-width="1.5"/>
  <!-- Log grain lines — rhythmic texture along the length -->
  <line x1="220" y1="240" x2="220" y2="286" stroke="#5a3010" stroke-width="1.5" opacity="0.55"/>
  <line x1="255" y1="237" x2="255" y2="282" stroke="#5a3010" stroke-width="1.5" opacity="0.55"/>
  <line x1="290" y1="234" x2="290" y2="278" stroke="#5a3010" stroke-width="1.5" opacity="0.55"/>
  <line x1="325" y1="231" x2="325" y2="274" stroke="#5a3010" stroke-width="1.5" opacity="0.55"/>
  <line x1="360" y1="229" x2="360" y2="271" stroke="#5a3010" stroke-width="1.5" opacity="0.55"/>

  <!-- LOG END — cross-section, left face (end-grain rings) ═══ -->
  <!-- Left end of log -->
  <ellipse cx="180" cy="265" rx="26" ry="38" fill="#7a5028" stroke="#1a0e04" stroke-width="2.5"/>
  <ellipse cx="180" cy="265" rx="18" ry="27" fill="#6b4420" stroke="#1a0e04" stroke-width="1.5"/>
  <ellipse cx="180" cy="265" rx="11" ry="17" fill="#8B5E2F" stroke="#1a0e04" stroke-width="1.5"/>
  <ellipse cx="180" cy="265" rx="5"  ry="8"  fill="#C87050" stroke="#1a0e04" stroke-width="1"/>
  <!-- Centre pith -->
  <ellipse cx="180" cy="265" rx="2"  ry="3"  fill="#E8B84B"/>

  <!-- Impact crack on log top — axe has just struck -->
  <polygon points="278,222 282,238 286,222" fill="#1a0e04" stroke="#0c0604" stroke-width="1.5"/>

  <!-- ═══ WOOD CHIPS FLYING — upper-right direction (upward + right) ═══ -->
  <!-- Chips are bright against dark background — catch the light -->
  <!-- Chip A — large, upper right -->
  <polygon points="295,218 310,202 322,210 307,228" fill="#C87050" stroke="#5a3010" stroke-width="2"/>
  <!-- Chip B — medium, upper right -->
  <polygon points="318,206 330,194 340,202 328,215" fill="#8B5E2F" stroke="#5a3010" stroke-width="2"/>
  <!-- Chip C — small splinter right -->
  <polygon points="340,200 350,190 357,197 347,207" fill="#C87050" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Chip D — upper left arc (backflip) -->
  <polygon points="268,214 258,200 266,195 278,207" fill="#8B5E2F" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Chip E — tiny high right -->
  <polygon points="345,192 352,184 358,191 351,199" fill="#6b4420" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Debris dots — bright specks against dark -->
  <circle cx="325" cy="194" r="3.5" fill="#C87050"/>
  <circle cx="336" cy="186" r="2.5" fill="#E8B84B"/>
  <circle cx="310" cy="196" r="2"   fill="#8B5E2F"/>
  <circle cx="356" cy="183" r="2"   fill="#C87050"/>
  <circle cx="348" cy="178" r="1.5" fill="#E8B84B"/>
  <circle cx="298" cy="210" r="2.5" fill="#8B5E2F"/>
  <circle cx="270" cy="205" r="2"   fill="#C87050"/>

  <!-- ═══ AXE HANDLE — diagonal, top-LEFT to bottom-RIGHT ═══ -->
  <!-- Handle runs from upper-left (~x=60,y=20) down to impact point (~x=290,y=230) -->
  <polygon points="48,16 72,12 302,226 278,230" fill="#6b4420" stroke="#1a0e04" stroke-width="3"/>
  <!-- Handle grain texture — 2 lines along length -->
  <line x1="56" y1="15" x2="286" y2="229" stroke="#5a3010" stroke-width="1.5" opacity="0.55"/>
  <line x1="68" y1="13" x2="296" y2="227" stroke="#5a3010" stroke-width="1.5" opacity="0.45"/>
  <!-- Handle warm highlight centre strip -->
  <polygon points="56,14 68,12 294,226 282,228" fill="#8B5E2F" opacity="0.35"/>

  <!-- ═══ AXE HEAD — BRIGHTEST ELEMENT — hitting log at lower-right ═══ -->
  <!-- Axe cheek / main body -->
  <polygon points="255,208 318,195 340,228 278,240" fill="#7a8898" stroke="#1a0e04" stroke-width="3"/>
  <!-- Top poll (back of axe) — darker -->
  <polygon points="255,208 278,198 284,210 260,220" fill="#5a6a78" stroke="#1a0e04" stroke-width="2.5"/>
  <!-- Axe eye hole for handle -->
  <ellipse cx="272" cy="214" rx="12" ry="8" fill="#4a5a68" stroke="#1a0e04" stroke-width="2"/>
  <ellipse cx="272" cy="214" rx="7"  ry="5" fill="#6b4420"/>
  <!-- Axe BLADE EDGE — the brightest element, maximum contrast -->
  <polygon points="278,240 340,228 355,238 290,252" fill="#b8ccd8" stroke="#1a0e04" stroke-width="2.5"/>
  <!-- Blade cutting edge highlight — glint line -->
  <polygon points="280,240 338,229 341,233 282,244" fill="#deeaf0" opacity="0.75"/>
  <!-- Sharp glint on blade tip — white-hot -->
  <polygon points="332,228 345,233 342,238 330,234" fill="#fff8e0" opacity="0.90"/>
  <!-- Secondary glint highlight -->
  <line x1="296" y1="242" x2="336" y2="231" stroke="#fff8e0" stroke-width="1.5" opacity="0.55"/>

  <!-- ═══ LOWER LEFT HAND — grips handle, near axe head ═══ -->
  <!-- Palm -->
  <polygon points="196,166 222,158 246,175 238,200 210,197" fill="#D4956A" stroke="#1a0e04" stroke-width="3"/>
  <!-- Thumb — arching over handle top -->
  <polygon points="214,158 226,146 238,156 226,167" fill="#D4956A" stroke="#1a0e04" stroke-width="2.5"/>
  <!-- Fingers curled around handle -->
  <polygon points="198,170 208,168 213,182 203,185" fill="#c4845a" stroke="#1a0e04" stroke-width="2"/>
  <polygon points="206,167 216,165 221,178 211,181" fill="#D4956A" stroke="#1a0e04" stroke-width="2"/>
  <polygon points="214,165 224,165 228,178 218,180" fill="#c4845a" stroke="#1a0e04" stroke-width="2"/>
  <polygon points="221,167 230,169 233,181 224,181" fill="#D4956A" stroke="#1a0e04" stroke-width="2"/>
  <!-- Knuckle highlights -->
  <ellipse cx="208" cy="169" rx="3" ry="2" fill="#e0a880" opacity="0.75"/>
  <ellipse cx="216" cy="167" rx="3" ry="2" fill="#e0a880" opacity="0.75"/>
  <ellipse cx="224" cy="167" rx="3" ry="2" fill="#e0a880" opacity="0.75"/>
  <!-- Wrist extending lower-left (toward body, off frame) -->
  <polygon points="196,166 210,197 194,208 178,178" fill="#D4956A" stroke="#1a0e04" stroke-width="2.5"/>
  <!-- Sleeve cuff -->
  <polygon points="178,178 194,208 182,214 164,186" fill="#8B5E2F" stroke="#1a0e04" stroke-width="2"/>

  <!-- ═══ UPPER RIGHT HAND — grips near handle top, upper-left area ═══ -->
  <!-- Palm -->
  <polygon points="78,60 104,52 128,69 120,94 92,91" fill="#D4956A" stroke="#1a0e04" stroke-width="3"/>
  <!-- Thumb -->
  <polygon points="100,52 112,40 124,50 112,62" fill="#D4956A" stroke="#1a0e04" stroke-width="2.5"/>
  <!-- Fingers -->
  <polygon points="80,64 90,62 95,76 85,79"   fill="#c4845a" stroke="#1a0e04" stroke-width="2"/>
  <polygon points="88,61 98,59 103,72 93,75"   fill="#D4956A" stroke="#1a0e04" stroke-width="2"/>
  <polygon points="96,59 106,59 110,72 100,74"  fill="#c4845a" stroke="#1a0e04" stroke-width="2"/>
  <polygon points="103,61 112,63 115,75 106,75"  fill="#D4956A" stroke="#1a0e04" stroke-width="2"/>
  <!-- Knuckle highlights -->
  <ellipse cx="90"  cy="63" rx="3" ry="2" fill="#e0a880" opacity="0.75"/>
  <ellipse cx="98"  cy="61" rx="3" ry="2" fill="#e0a880" opacity="0.75"/>
  <ellipse cx="106" cy="61" rx="3" ry="2" fill="#e0a880" opacity="0.75"/>
  <!-- Wrist extending upper-right (off frame) -->
  <polygon points="104,52 128,69 144,54 122,38" fill="#D4956A" stroke="#1a0e04" stroke-width="2.5"/>
  <!-- Sleeve cuff -->
  <polygon points="122,38 144,54 156,44 136,28" fill="#8B5E2F" stroke="#1a0e04" stroke-width="2"/>

  <!-- Ground shadow pool beneath log -->
  <ellipse cx="290" cy="290" rx="110" ry="15" fill="#0a0812" opacity="0.80"/>

</svg>
