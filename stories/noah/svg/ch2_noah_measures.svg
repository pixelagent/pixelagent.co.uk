<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- ── BACKGROUND: bright open sky upper 40% ─────────────── -->
  <!-- Sky gradient bands — light at top, warm at horizon -->
  <rect width="400" height="300" fill="#c4956a"/>
  <rect x="0" y="0"   width="400" height="60"  fill="#b8845a"/>
  <rect x="0" y="0"   width="400" height="120" fill="#c4956a" opacity="0.7"/>
  <!-- Bright sky wash upper zone -->
  <rect x="0" y="0"   width="400" height="90"  fill="#E8B84B" opacity="0.18"/>

  <!-- Warm horizon glow -->
  <ellipse cx="310" cy="170" rx="90" ry="28" fill="#E8B84B" opacity="0.22"/>

  <!-- ── MIDGROUND: flat earth ──────────────────────────────── -->
  <rect x="0" y="168" width="400" height="132" fill="#3a2a10"/>
  <!-- Earth surface band -->
  <rect x="0" y="164" width="400" height="10" fill="#5a3a10"/>
  <!-- Faint horizon line -->
  <line x1="0" y1="168" x2="400" y2="168" stroke="#6b4420" stroke-width="1.5"/>

  <!-- Distant low horizon scrub (very subtle) -->
  <polygon points="200,164 250,158 310,163 400,162 400,168 200,168" fill="#2a1e0c" opacity="0.6"/>

  <!-- Measurement scratches in the earth — faint, horizontal rhythm -->
  <line x1="60"  y1="192" x2="190" y2="192" stroke="#5a3010" stroke-width="1"/>
  <line x1="55"  y1="189" x2="55"  y2="195" stroke="#5a3010" stroke-width="1"/>
  <line x1="100" y1="190" x2="100" y2="194" stroke="#5a3010" stroke-width="0.8"/>
  <line x1="145" y1="190" x2="145" y2="194" stroke="#5a3010" stroke-width="0.8"/>
  <line x1="190" y1="189" x2="190" y2="195" stroke="#5a3010" stroke-width="1"/>

  <line x1="80"  y1="210" x2="200" y2="210" stroke="#5a3010" stroke-width="0.8" opacity="0.6"/>
  <line x1="90"  y1="225" x2="180" y2="228" stroke="#5a3010" stroke-width="0.8" opacity="0.5"/>

  <!-- ── THE LOG — DIAGONAL, lower-left to upper-right ──────── -->
  <!-- Log shadow on earth -->
  <polygon points="28,282 46,272 348,124 332,120" fill="#1a0e04" opacity="0.55"/>

  <!-- Log main body — thick, diagonal, perspective taper -->
  <!-- Far end (upper-right) narrower; near end (lower-left) wider -->
  <polygon points="22,284 56,276 352,116 322,110"
           fill="#8B5E2F" stroke="#1a0e04" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Log top face (lighter, planed surface) -->
  <polygon points="22,284 56,276 352,116 322,110"
           fill="#C87050" opacity="0.35"/>
  <!-- Lighter highlight strip along top edge -->
  <polygon points="26,276 52,270 348,114 330,110" fill="#a06a35" opacity="0.5"/>

  <!-- Wood grain lines (longitudinal, slight curve — follow diagonal) -->
  <line x1="30"  y1="282" x2="330" y2="116" stroke="#6b4420" stroke-width="1.2"/>
  <line x1="38"  y1="280" x2="338" y2="116" stroke="#9a6030" stroke-width="0.8"/>
  <line x1="46"  y1="278" x2="344" y2="115" stroke="#6b4420" stroke-width="0.8"/>
  <line x1="54"  y1="276" x2="348" y2="114" stroke="#5a3010" stroke-width="0.7"/>

  <!-- Far (upper-right) end face of log — recedes into midground -->
  <ellipse cx="337" cy="113" rx="16" ry="5" fill="#5a3010" stroke="#1a0e04" stroke-width="2" transform="rotate(-27,337,113)"/>

  <!-- Near (lower-left) end face of log — large, facing viewer -->
  <ellipse cx="39" cy="280" rx="20" ry="8" fill="#4a2808" stroke="#1a0e04" stroke-width="2.5" transform="rotate(-13,39,280)"/>
  <!-- End-grain rings -->
  <ellipse cx="39" cy="280" rx="13" ry="5" fill="none" stroke="#6b4420" stroke-width="1" transform="rotate(-13,39,280)"/>
  <ellipse cx="39" cy="280" rx="7"  ry="2.5" fill="none" stroke="#6b4420" stroke-width="0.8" transform="rotate(-13,39,280)"/>

  <!-- ── ROPE MEASUREMENT LINE — follows the log diagonal ────── -->
  <!-- Rope slightly above the log surface, same diagonal -->
  <path d="M 44,268 Q 100,230 160,191 Q 220,152 280,132 Q 310,122 340,114"
        fill="none" stroke="#c8906a" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="8,5"/>
  <!-- Rope end knots -->
  <circle cx="44"  cy="268" r="4.5" fill="#c8906a" stroke="#1a0e04" stroke-width="1.5"/>
  <circle cx="340" cy="114" r="3.5" fill="#c8906a" stroke="#1a0e04" stroke-width="1.5"/>

  <!-- ── NOAH — crouching lower-LEFT, emphasis ─────────────── -->
  <!-- Ground shadow under Noah -->
  <ellipse cx="88" cy="248" rx="30" ry="8" fill="#1a0e04" opacity="0.5"/>

  <!-- Rear leg / shin (bent, crouching) -->
  <polygon points="105,232 118,228 122,252 108,254" fill="#6b4420" stroke="#1a0e04" stroke-width="1.5"/>
  <!-- Rear foot / sandal -->
  <ellipse cx="115" cy="255" rx="10" ry="4" fill="#5a3010" stroke="#1a0e04" stroke-width="1.5"/>

  <!-- Robe lower / skirt -->
  <polygon points="68,220 118,215 122,252 62,255" fill="#8B5E2F" stroke="#1a0e04" stroke-width="2"/>
  <!-- Robe hem detail -->
  <line x1="62"  y1="252" x2="122" y2="250" stroke="#6b4420" stroke-width="1.5"/>

  <!-- Torso — leaning forward toward log -->
  <polygon points="72,190 100,186 112,218 68,222" fill="#C87050" stroke="#1a0e04" stroke-width="2.5"/>

  <!-- Head — turned, looking along log toward upper-right -->
  <circle cx="88" cy="178" r="17" fill="#D4956A" stroke="#1a0e04" stroke-width="2.5"/>

  <!-- Head cloth -->
  <polygon points="72,172 88,162 104,172 102,180 88,174 74,180"
           fill="#8B5E2F" stroke="#1a0e04" stroke-width="2"/>
  <!-- Cloth fold -->
  <line x1="74" y1="178" x2="88" y2="174" stroke="#6b4420" stroke-width="1.2"/>
  <line x1="102" y1="178" x2="88" y2="174" stroke="#6b4420" stroke-width="1.2"/>

  <!-- Beard -->
  <polygon points="80,183 82,195 96,195 98,183" fill="#6b4420" stroke="#1a0e04" stroke-width="1.5"/>

  <!-- Eyes — both looking up-right, along the log -->
  <ellipse cx="83"  cy="176" rx="2.5" ry="2"   fill="#1a0e04"/>
  <ellipse cx="93"  cy="175" rx="2"   ry="1.8"  fill="#1a0e04"/>
  <!-- Slight brow furrow — concentration -->
  <path d="M 79,172 Q 83,170 87,171" fill="none" stroke="#3a1e04" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 89,171 Q 93,169 97,170" fill="none" stroke="#3a1e04" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Left arm — reaching forward, hand pinching rope at log near end -->
  <line x1="74"  y1="204" x2="52"  y2="265" stroke="#D4956A" stroke-width="7" stroke-linecap="round"/>
  <circle cx="50" cy="268" r="6" fill="#D4956A" stroke="#1a0e04" stroke-width="2"/>

  <!-- Right arm — pointing / steadying along log face -->
  <line x1="98"  y1="202" x2="116" y2="215" stroke="#D4956A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="118" cy="216" r="5" fill="#D4956A" stroke="#1a0e04" stroke-width="1.8"/>

  <!-- Front foot (flat, crouching position) -->
  <ellipse cx="72" cy="255" rx="11" ry="4" fill="#5a3010" stroke="#1a0e04" stroke-width="1.5"/>

  <!-- ── WOOD SHAVINGS near Noah's feet ────────────────────── -->
  <!-- Curled shavings — thin arcs -->
  <path d="M 56,262 Q 62,256 68,261" fill="none" stroke="#C87050" stroke-width="2" stroke-linecap="round"/>
  <path d="M 62,270 Q 70,264 74,272" fill="none" stroke="#8B5E2F" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 48,272 Q 54,268 58,274" fill="none" stroke="#a06a35" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Flat chip fragments -->
  <rect x="44"  y="274" width="7" height="2" transform="rotate(-18,47,275)" fill="#8B5E2F"/>
  <rect x="60"  y="278" width="5" height="2" transform="rotate(12,62,279)"  fill="#C87050"/>
  <rect x="52"  y="267" width="6" height="2" transform="rotate(-8,55,268)"  fill="#6b4420"/>
  <!-- Dust specks -->
  <circle cx="42" cy="269" r="1.5" fill="#8B5E2F" opacity="0.7"/>
  <circle cx="70" cy="275" r="1.2" fill="#C87050" opacity="0.6"/>

  <!-- ── RIGHT SIDE: open white space (balance) ─────────────── -->
  <!-- Single faint horizon measurement mark — far right -->
  <line x1="340" y1="178" x2="390" y2="178" stroke="#5a3010" stroke-width="0.8" opacity="0.5"/>

</svg>
