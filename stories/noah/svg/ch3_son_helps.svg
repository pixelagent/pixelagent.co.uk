<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- ===== BACKGROUND LAYER: Open amber sky — top portion ===== -->
  <rect width="400" height="300" fill="#281808"/>
  <!-- Sky: warm amber at top — open white space -->
  <rect x="0" y="0" width="400" height="105" fill="#c4956a"/>
  <rect x="0" y="0" width="400" height="65" fill="#E8B84B"/>
  <!-- Horizon fade into ark shadow -->
  <rect x="0" y="65" width="400" height="50" fill="#c4956a"/>

  <!-- ===== MIDGROUND: ARK HULL — dark mass looming upper background ===== -->
  <!-- Hull fills most of the midground, very dark — provides contrast for figures -->
  <polygon points="0,96 400,68 400,250 0,250" fill="#120c04"/>
  <!-- Hull diagonal plank lines — receding to upper right -->
  <line x1="0" y1="110" x2="400" y2="82" stroke="#0A0812" stroke-width="2"/>
  <line x1="0" y1="136" x2="400" y2="108" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="0" y1="162" x2="400" y2="134" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="0" y1="188" x2="400" y2="162" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="0" y1="214" x2="400" y2="190" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Hull top edge — bold line -->
  <line x1="0" y1="98" x2="400" y2="70" stroke="#3d2808" stroke-width="3"/>
  <!-- Subtle grain highlights on hull -->
  <line x1="0" y1="124" x2="400" y2="96" stroke="#1e0e04" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="150" x2="400" y2="122" stroke="#1e0e04" stroke-width="1" opacity="0.5"/>

  <!-- ===== GROUND ===== -->
  <rect x="0" y="258" width="400" height="42" fill="#3d2808"/>
  <rect x="0" y="252" width="400" height="10" fill="#5a3e18"/>

  <!-- ===== THE LONG PLANK — diagonal from lower-left to upper-right, connects the two figures ===== -->
  <!-- Plank: running from Noah's hands (left) to son's hands (right), angled diagonally -->
  <!-- Goes from approx (55,228) to (290,148) — strong lower-left to upper-right diagonal -->
  <rect x="0" y="0" width="400" height="300" fill="none"/>
  <!-- Plank body -->
  <polygon points="52,236 64,224 296,152 284,164" fill="#C87050" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Plank grain lines — parallel to plank axis -->
  <line x1="56" y1="228" x2="288" y2="156" stroke="#8B5E2F" stroke-width="1.5" opacity="0.7"/>
  <line x1="60" y1="232" x2="292" y2="160" stroke="#8B5E2F" stroke-width="1" opacity="0.5"/>
  <!-- Plank wood grain nodes (knots) -->
  <ellipse cx="140" cy="200" rx="5" ry="3" fill="none" stroke="#6b4420" stroke-width="1.5" transform="rotate(-27,140,200)"/>
  <ellipse cx="220" cy="174" rx="4" ry="2.5" fill="none" stroke="#6b4420" stroke-width="1.5" transform="rotate(-27,220,174)"/>

  <!-- ===== NOAH FIGURE — left, taller, bearded, faces slightly away ===== -->
  <!-- Positioned left of centre — slightly facing right (toward son) -->
  <!-- Legs -->
  <rect x="92" y="228" width="14" height="30" rx="5" fill="#0a0812" stroke="#0A0812" stroke-width="2"/>
  <rect x="110" y="228" width="14" height="32" rx="5" fill="#120c04" stroke="#0A0812" stroke-width="2"/>
  <!-- Robe/body — tall, warm mid-tone, lighter than hull behind -->
  <polygon points="82,186 130,186 126,228 86,228" fill="#6b4420" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Left arm — reaching down-left to grip plank (lower end) -->
  <line x1="84" y1="196" x2="60" y2="226" stroke="#3d2808" stroke-width="10" stroke-linecap="round"/>
  <!-- Right arm — extended forward toward son -->
  <line x1="128" y1="194" x2="155" y2="178" stroke="#3d2808" stroke-width="10" stroke-linecap="round"/>
  <!-- NOAH HEAD — slightly turned away (3/4 view, facing right) -->
  <ellipse cx="107" cy="175" rx="18" ry="16" fill="#8B5E2F" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Beard — long, grey-white, distinctive marker of age -->
  <path d="M 92,182 Q 98,202 114,195 Q 108,182 107,175" fill="#5a3e18" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Beard grey highlight -->
  <path d="M 100,186 Q 104,200 112,194" fill="none" stroke="#c4956a" stroke-width="2" opacity="0.6"/>
  <!-- Eye (far side, partial) -->
  <circle cx="100" cy="173" r="2" fill="#0A0812" opacity="0.6"/>
  <!-- Eye (near side) -->
  <circle cx="114" cy="172" r="2.5" fill="#0A0812"/>
  <!-- Head cloth band -->
  <path d="M 91,170 Q 107,162 123,170" stroke="#281808" stroke-width="3" fill="none"/>
  <!-- Head cloth / wrap -->
  <polygon points="91,168 107,160 124,168 122,174 107,165 93,174" fill="#3d2808" stroke="#0A0812" stroke-width="2"/>

  <!-- ===== SON FIGURE — right, younger, slightly shorter, faces toward viewer ===== -->
  <!-- Legs -->
  <rect x="226" y="228" width="13" height="30" rx="5" fill="#120c04" stroke="#0A0812" stroke-width="2"/>
  <rect x="243" y="228" width="13" height="30" rx="5" fill="#0a0812" stroke="#0A0812" stroke-width="2"/>
  <!-- Robe/body — slightly shorter, lighter warm tone (foreground) -->
  <polygon points="218,190 264,190 260,228 222,228" fill="#8B5E2F" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Left arm: reaching out and up to receive/hold plank upper end -->
  <line x1="220" y1="198" x2="194" y2="172" stroke="#5a3010" stroke-width="10" stroke-linecap="round"/>
  <!-- Right arm: bracing, bent at side -->
  <line x1="262" y1="200" x2="278" y2="185" stroke="#5a3010" stroke-width="9" stroke-linecap="round"/>
  <!-- SON HEAD — facing viewer, rounder/younger face -->
  <ellipse cx="241" cy="178" rx="17" ry="16" fill="#C87050" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Hair (younger, dark, no beard) -->
  <path d="M 226,174 Q 241,163 256,174" stroke="#120c04" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eyes — forward-facing, both visible -->
  <circle cx="234" cy="177" r="2.5" fill="#0A0812"/>
  <circle cx="248" cy="177" r="2.5" fill="#0A0812"/>
  <!-- Nose mark -->
  <line x1="241" y1="178" x2="241" y2="183" stroke="#5a3010" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Mouth — slight expression -->
  <path d="M 236,184 Q 241,188 246,184" fill="none" stroke="#3d2808" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ear -->
  <ellipse cx="258" cy="178" rx="4" ry="5" fill="#C87050" stroke="#0A0812" stroke-width="1.5"/>

  <!-- ===== FOREGROUND GROUND DETAILS ===== -->
  <!-- Tool on ground — small chisel -->
  <rect x="310" y="255" width="28" height="5" rx="2" fill="#5a3010" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="336" y="252" width="7" height="8" rx="1" fill="#3d2808" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Wood offcut on ground left -->
  <rect x="28" y="258" width="32" height="6" rx="2" fill="#8B5E2F" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Wood shavings -->
  <path d="M 345" fill="none"/>
  <path d="M 345,265 Q 352,261 358,265" fill="none" stroke="#8B5E2F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 362,262 Q 370,258 376,262" fill="none" stroke="#6b4420" stroke-width="1.5" stroke-linecap="round"/>

</svg>
