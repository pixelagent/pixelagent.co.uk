<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- DEPTH LAYER 1 — muted grey-blue sky, heavy cloud ceiling -->
  <rect width="400" height="300" fill="#1c2a3a"/>

  <!-- Sky — overcast, uniform, oppressive grey ceiling -->
  <rect x="0" y="0" width="400" height="148" fill="#243040"/>
  <rect x="0" y="0" width="400" height="90"  fill="#2a3848"/>
  <rect x="0" y="0" width="400" height="50"  fill="#303e50"/>
  <!-- Cloud mass — heavy, unbroken, monolithic -->
  <ellipse cx="50"  cy="28"  rx="90"  ry="30" fill="#2e3e52" opacity="0.90"/>
  <ellipse cx="200" cy="18"  rx="140" ry="32" fill="#324255" opacity="0.90"/>
  <ellipse cx="370" cy="32"  rx="90"  ry="28" fill="#2e3e52" opacity="0.85"/>
  <ellipse cx="110" cy="58"  rx="100" ry="26" fill="#283648" opacity="0.80"/>
  <ellipse cx="300" cy="52"  rx="110" ry="26" fill="#2a3a4e" opacity="0.80"/>
  <ellipse cx="200" cy="72"  rx="130" ry="24" fill="#243042" opacity="0.80"/>
  <!-- Cloud undersides — dark, pressing -->
  <ellipse cx="50"  cy="55"  rx="90"  ry="14" fill="#1a2535" opacity="0.70"/>
  <ellipse cx="200" cy="48"  rx="140" ry="16" fill="#18232f" opacity="0.70"/>
  <ellipse cx="370" cy="58"  rx="90"  ry="14" fill="#1a2535" opacity="0.65"/>
  <!-- Thin sliver of lighter sky — RIGHT HORIZON only, a crack of hope -->
  <path d="M340,140 Q365,138 400,136 L400,148 Q365,148 340,148 Z"
        fill="#6888a0" opacity="0.65"/>
  <path d="M360,141 Q380,140 400,138 L400,148 Q380,148 360,148 Z"
        fill="#8aacbf" opacity="0.50"/>
  <path d="M385,143 L400,142 L400,148 L385,148 Z"
        fill="#a8c4d4" opacity="0.40"/>

  <!-- THE PERFECT MIRROR LINE — the horizon, structural focal divide -->
  <rect x="0" y="148" width="400" height="3" fill="#4E9CCD" opacity="0.60"/>

  <!-- DEPTH LAYER 2 — still water, lower half, mirror reflection zone -->
  <rect x="0" y="151" width="400" height="149" fill="#0e1e2e"/>
  <!-- Mirror surface — ultra still, just a breath of shimmer -->
  <rect x="0" y="151" width="400" height="2"   fill="#4E9CCD" opacity="0.25"/>
  <line x1="0" y1="158" x2="400" y2="158" stroke="#3a6880" stroke-width="1"   opacity="0.14"/>
  <line x1="0" y1="170" x2="400" y2="170" stroke="#3a6080" stroke-width="1"   opacity="0.10"/>
  <line x1="0" y1="188" x2="400" y2="188" stroke="#2a5070" stroke-width="1"   opacity="0.08"/>
  <line x1="0" y1="214" x2="400" y2="214" stroke="#2a4060" stroke-width="1"   opacity="0.07"/>
  <line x1="0" y1="248" x2="400" y2="248" stroke="#2a4060" stroke-width="1"   opacity="0.06"/>

  <!-- DEPTH LAYER 3 — THE ARK, upper-centre, and its reflection below -->
  <!-- ARK — centred, sitting on the mirror line -->
  <!-- Hull shadow depth -->
  <polygon points="120,116 280,116 296,148 104,148" fill="#3a1e08" stroke="none"/>
  <!-- Hull main -->
  <polygon points="124,110 276,110 292,146 108,146" fill="#8B5E2F" stroke="#0A0812" stroke-width="3"/>
  <!-- Hull lower shading -->
  <polygon points="124,128 276,128 292,146 108,146" fill="#6b4420"/>
  <!-- Hull planks horizontal -->
  <line x1="132" y1="118" x2="268" y2="118" stroke="#5a3010" stroke-width="1.5"/>
  <line x1="129" y1="128" x2="271" y2="128" stroke="#5a3010" stroke-width="1.5"/>
  <line x1="126" y1="137" x2="274" y2="137" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Hull vertical planks -->
  <line x1="150" y1="110" x2="146" y2="146" stroke="#5a3010" stroke-width="1"/>
  <line x1="174" y1="110" x2="170" y2="146" stroke="#5a3010" stroke-width="1"/>
  <line x1="198" y1="110" x2="196" y2="146" stroke="#5a3010" stroke-width="1"/>
  <line x1="222" y1="110" x2="221" y2="146" stroke="#5a3010" stroke-width="1"/>
  <line x1="246" y1="110" x2="246" y2="146" stroke="#5a3010" stroke-width="1"/>
  <!-- Superstructure / cabin -->
  <rect x="142" y="78" width="116" height="32" fill="#a06a35" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Cabin vertical planks -->
  <line x1="162" y1="78" x2="162" y2="110" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="185" y1="78" x2="185" y2="110" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="208" y1="78" x2="208" y2="110" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="231" y1="78" x2="231" y2="110" stroke="#8B5E2F" stroke-width="1"/>
  <!-- Cabin roof -->
  <polygon points="132,78 200,54 268,78" fill="#C87050" stroke="#0A0812" stroke-width="2.5"/>
  <line x1="132" y1="78" x2="268" y2="78" stroke="#0A0812" stroke-width="2"/>
  <!-- Cabin window — darkened, no light (eerie calm) -->
  <rect x="190" y="63" width="20" height="14" fill="#1a2838" stroke="#0A0812" stroke-width="2"/>
  <line x1="200" y1="63" x2="200" y2="77" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="190" y1="70" x2="210" y2="70" stroke="#0A0812" stroke-width="1.5"/>

  <!-- ARK REFLECTION — mirror image below horizon, slightly distorted -->
  <!-- Reflected hull — simplified, muted -->
  <polygon points="120,151 280,151 296,185 104,185" fill="#4a2e10" opacity="0.55"/>
  <!-- Reflected hull lower shading -->
  <polygon points="120,170 280,170 296,185 104,185" fill="#3a2008" opacity="0.45"/>
  <!-- Reflected superstructure -->
  <rect x="142" y="185" width="116" height="26" fill="#5a3818" opacity="0.44"/>
  <!-- Reflected roof — inverted -->
  <polygon points="132,211 200,228 268,211" fill="#6a4020" opacity="0.38"/>
  <!-- Reflection distortion shimmer lines — slightly wavy offsets -->
  <line x1="108" y1="158" x2="292" y2="158" stroke="#4E9CCD" stroke-width="1"   opacity="0.18"/>
  <line x1="104" y1="166" x2="296" y2="167" stroke="#4E9CCD" stroke-width="1"   opacity="0.14"/>
  <line x1="100" y1="175" x2="300" y2="176" stroke="#4E9CCD" stroke-width="1"   opacity="0.11"/>
  <line x1="96"  y1="184" x2="304" y2="185" stroke="#4E9CCD" stroke-width="1"   opacity="0.09"/>
  <!-- Faint horizon mist band -->
  <rect x="0" y="145" width="400" height="8" fill="#3a5060" opacity="0.20"/>

</svg>
