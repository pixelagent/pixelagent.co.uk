<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- DEPTH LAYER 1 — pale, washed-out sky — hopeful, clearing -->
  <rect width="400" height="300" fill="#4a6070"/>

  <!-- Sky gradient bands — lightening from top down -->
  <rect x="0" y="0" width="400" height="200" fill="#4e6478"/>
  <rect x="0" y="0" width="400" height="130" fill="#546a80"/>
  <rect x="0" y="0" width="400" height="70"  fill="#5c7288"/>
  <rect x="0" y="0" width="400" height="30"  fill="#627890"/>
  <!-- Thinning post-storm clouds — scattering, gaps showing -->
  <ellipse cx="30"  cy="25"  rx="70"  ry="20" fill="#6a8098" opacity="0.80"/>
  <ellipse cx="150" cy="15"  rx="100" ry="22" fill="#6e8499" opacity="0.75"/>
  <ellipse cx="320" cy="22"  rx="95"  ry="20" fill="#6a8098" opacity="0.75"/>
  <ellipse cx="400" cy="35"  rx="65"  ry="18" fill="#647a92" opacity="0.70"/>
  <!-- Second cloud tier — thinner, more light between them -->
  <ellipse cx="80"  cy="52"  rx="80"  ry="18" fill="#607888" opacity="0.65"/>
  <ellipse cx="240" cy="44"  rx="110" ry="18" fill="#64788a" opacity="0.60"/>
  <ellipse cx="380" cy="55"  rx="70"  ry="16" fill="#607888" opacity="0.60"/>
  <!-- Pale gaps of brightness between clouds -->
  <ellipse cx="200" cy="36"  rx="60"  ry="14" fill="#7898aa" opacity="0.55"/>
  <ellipse cx="360" cy="42"  rx="45"  ry="11" fill="#7296a8" opacity="0.50"/>
  <ellipse cx="50"  cy="42"  rx="40"  ry="10" fill="#6e9098" opacity="0.45"/>
  <!-- Cloud undersides — lighter than storm, muted -->
  <ellipse cx="150" cy="34"  rx="100" ry="10" fill="#4a6070" opacity="0.50"/>
  <ellipse cx="320" cy="40"  rx="95"  ry="9"  fill="#485e70" opacity="0.45"/>

  <!-- DEPTH LAYER 2 — MIST LAYERS at water surface, obscuring mountain roots -->
  <!-- Deepest mist band — floating at water surface level -->
  <rect x="0" y="168" width="400" height="24" fill="#5a7888" opacity="0.65"/>
  <rect x="0" y="178" width="400" height="18" fill="#638090" opacity="0.60"/>
  <rect x="0" y="185" width="400" height="12" fill="#6a8898" opacity="0.55"/>
  <!-- Mist wisps — irregular, horizontal -->
  <ellipse cx="60"  cy="180" rx="90"  ry="14" fill="#7090a0" opacity="0.45"/>
  <ellipse cx="220" cy="175" rx="110" ry="10" fill="#6888a0" opacity="0.40"/>
  <ellipse cx="370" cy="182" rx="80"  ry="12" fill="#6a8898" opacity="0.40"/>

  <!-- FLOODED WATER — lower 40%, vast, receding -->
  <rect x="0" y="192" width="400" height="108" fill="#1e3048"/>
  <rect x="0" y="190" width="400" height="8"   fill="#2a4060" opacity="0.60"/>
  <!-- Mist-water blend transition -->
  <rect x="0" y="188" width="400" height="10"  fill="#4a6878" opacity="0.55"/>
  <!-- Water ripple lines — gentle, calmer now -->
  <line x1="0"   y1="200" x2="400" y2="200" stroke="#4E9CCD" stroke-width="1.2" opacity="0.28"/>
  <line x1="0"   y1="218" x2="400" y2="218" stroke="#4E9CCD" stroke-width="1"   opacity="0.20"/>
  <line x1="0"   y1="240" x2="400" y2="240" stroke="#4E9CCD" stroke-width="1"   opacity="0.16"/>
  <line x1="0"   y1="265" x2="400" y2="265" stroke="#4E9CCD" stroke-width="1"   opacity="0.13"/>

  <!-- BACKGROUND MOUNTAIN PEAKS — barely visible through mist (rhythm, depth) -->
  <!-- Far left peak — ghost, very faint through mist -->
  <polygon points="18,192 55,148 92,192"  fill="#384050" opacity="0.55" stroke="#283040" stroke-width="1"/>
  <rect x="8" y="178" width="95" height="22" fill="#5a7888" opacity="0.60"/>
  <!-- Far right peak — also misty -->
  <polygon points="310,192 350,152 390,192" fill="#384050" opacity="0.50" stroke="#283040" stroke-width="1"/>
  <rect x="302" y="178" width="98" height="22" fill="#5a7888" opacity="0.55"/>

  <!-- DEPTH LAYER 3 — MAIN MOUNTAIN PEAK — sharp, solid, focal -->
  <!-- Mountain rock mass — central, rising from water -->
  <!-- Mountain sides -->
  <polygon points="130,192 200,82 270,192" fill="#3c3a38" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Mountain inner shading — darker face -->
  <polygon points="155,192 200,98 245,192" fill="#302e2c" stroke="#0A0812" stroke-width="2"/>
  <!-- Rock strata / texture lines on peak -->
  <line x1="162" y1="188" x2="175" y2="165" stroke="#262422" stroke-width="2"/>
  <line x1="182" y1="190" x2="192" y2="162" stroke="#262422" stroke-width="2"/>
  <line x1="205" y1="190" x2="208" y2="165" stroke="#262422" stroke-width="2"/>
  <line x1="220" y1="189" x2="228" y2="168" stroke="#262422" stroke-width="2"/>
  <line x1="238" y1="188" x2="242" y2="172" stroke="#262422" stroke-width="1.5"/>
  <!-- Pale snow/frost on peak tip -->
  <polygon points="192,92 200,82 208,92 204,95 200,94 196,95" fill="#b8c0c4" opacity="0.80"/>
  <polygon points="194,95 200,94 206,95 203,98 200,97 197,98" fill="#9aacb4" opacity="0.60"/>
  <!-- Mist obscuring mountain base -->
  <rect x="110" y="180" width="180" height="20" fill="#5a7888" opacity="0.50"/>
  <!-- Rock ledge under ark — small flat area -->
  <polygon points="140,164 260,164 268,178 132,178" fill="#2e2c2a" stroke="#0A0812" stroke-width="2"/>
  <line x1="145" y1="170" x2="162" y2="166" stroke="#1e1c1a" stroke-width="2"/>
  <line x1="200" y1="172" x2="215" y2="167" stroke="#1e1c1a" stroke-width="2"/>
  <line x1="248" y1="170" x2="258" y2="165" stroke="#1e1c1a" stroke-width="1.5"/>

  <!-- THE ARK — resting solid on the peak, upper-centre -->
  <!-- Hull base shadow -->
  <polygon points="145,140 255,140 267,164 133,164" fill="#3a1e08" stroke="none"/>
  <!-- Hull main -->
  <polygon points="148,135 252,135 264,162 136,162" fill="#8B5E2F" stroke="#0A0812" stroke-width="3"/>
  <!-- Hull lower shading -->
  <polygon points="148,150 252,150 264,162 136,162" fill="#6b4420"/>
  <!-- Hull horizontal planks -->
  <line x1="155" y1="143" x2="245" y2="143" stroke="#5a3010" stroke-width="1.5"/>
  <line x1="152" y1="151" x2="248" y2="151" stroke="#5a3010" stroke-width="1.5"/>
  <line x1="149" y1="158" x2="251" y2="158" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Hull vertical planks -->
  <line x1="168" y1="135" x2="165" y2="162" stroke="#5a3010" stroke-width="1"/>
  <line x1="190" y1="135" x2="188" y2="162" stroke="#5a3010" stroke-width="1"/>
  <line x1="212" y1="135" x2="210" y2="162" stroke="#5a3010" stroke-width="1"/>
  <line x1="234" y1="135" x2="233" y2="162" stroke="#5a3010" stroke-width="1"/>
  <!-- Superstructure / cabin -->
  <rect x="158" y="106" width="84" height="29" fill="#a06a35" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Cabin planks -->
  <line x1="174" y1="106" x2="174" y2="135" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="194" y1="106" x2="194" y2="135" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="216" y1="106" x2="216" y2="135" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="236" y1="106" x2="236" y2="135" stroke="#8B5E2F" stroke-width="1"/>
  <!-- Roof -->
  <polygon points="148,106 200,84 252,106" fill="#C87050" stroke="#0A0812" stroke-width="2.5"/>
  <line x1="148" y1="106" x2="252" y2="106" stroke="#0A0812" stroke-width="2"/>
  <!-- Roof planks -->
  <line x1="163" y1="106" x2="172" y2="84"  stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="183" y1="106" x2="190" y2="84"  stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="200" y1="106" x2="200" y2="84"  stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="217" y1="106" x2="210" y2="84"  stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="237" y1="106" x2="228" y2="84"  stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <!-- Window -->
  <rect x="190" y="91"  width="20" height="14" fill="#3a5070" stroke="#0A0812" stroke-width="2"/>
  <line x1="200" y1="91"  x2="200" y2="105" stroke="#0A0812" stroke-width="1.5"/>
  <line x1="190" y1="98"  x2="210" y2="98"  stroke="#0A0812" stroke-width="1.5"/>

</svg>
