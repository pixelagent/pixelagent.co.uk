<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- LAYER 1 BACKGROUND: Dark ark interior — enveloping darkness -->
  <rect x="0" y="0" width="400" height="300" fill="#0a0812"/>

  <!-- Interior wall — dark wood, left side -->
  <rect x="0" y="0" width="115" height="300" fill="#1e0e04"/>
  <!-- Interior wall — right side -->
  <rect x="265" y="0" width="135" height="300" fill="#1e0e04"/>

  <!-- Overhead beam — strong horizontal dividing dark interior -->
  <rect x="0" y="0" width="115" height="28" rx="0" fill="#2a1608" stroke="#0A0812" stroke-width="2"/>
  <rect x="265" y="0" width="135" height="28" rx="0" fill="#2a1608" stroke="#0A0812" stroke-width="2"/>
  <!-- Beam plank lines -->
  <line x1="0" y1="12" x2="115" y2="12" stroke="#1a0e04" stroke-width="2"/>
  <line x1="265" y1="12" x2="400" y2="12" stroke="#1a0e04" stroke-width="2"/>

  <!-- Interior wall planks — left -->
  <line x1="0" y1="55" x2="115" y2="55" stroke="#2a1608" stroke-width="2"/>
  <line x1="0" y1="88" x2="115" y2="88" stroke="#2a1608" stroke-width="2"/>
  <line x1="0" y1="121" x2="115" y2="121" stroke="#2a1608" stroke-width="2"/>
  <line x1="0" y1="154" x2="115" y2="154" stroke="#2a1608" stroke-width="2"/>
  <line x1="0" y1="187" x2="115" y2="187" stroke="#2a1608" stroke-width="2"/>
  <line x1="0" y1="220" x2="115" y2="220" stroke="#2a1608" stroke-width="2"/>
  <line x1="0" y1="253" x2="115" y2="253" stroke="#2a1608" stroke-width="2"/>
  <!-- Interior wall planks — right -->
  <line x1="265" y1="55" x2="400" y2="55" stroke="#2a1608" stroke-width="2"/>
  <line x1="265" y1="88" x2="400" y2="88" stroke="#2a1608" stroke-width="2"/>
  <line x1="265" y1="121" x2="400" y2="121" stroke="#2a1608" stroke-width="2"/>
  <line x1="265" y1="154" x2="400" y2="154" stroke="#2a1608" stroke-width="2"/>
  <line x1="265" y1="187" x2="400" y2="187" stroke="#2a1608" stroke-width="2"/>
  <line x1="265" y1="220" x2="400" y2="220" stroke="#2a1608" stroke-width="2"/>
  <line x1="265" y1="253" x2="400" y2="253" stroke="#2a1608" stroke-width="2"/>

  <!-- Vertical plank separators — left wall -->
  <line x1="38" y1="0" x2="38" y2="300" stroke="#160a02" stroke-width="1.5"/>
  <line x1="72" y1="0" x2="72" y2="300" stroke="#160a02" stroke-width="1.5"/>
  <!-- Vertical plank separators — right wall -->
  <line x1="300" y1="0" x2="300" y2="300" stroke="#160a02" stroke-width="1.5"/>
  <line x1="338" y1="0" x2="338" y2="300" stroke="#160a02" stroke-width="1.5"/>

  <!-- Floor planks — dark, near the door -->
  <rect x="0" y="265" width="115" height="35" fill="#160a02"/>
  <rect x="265" y="265" width="135" height="35" fill="#160a02"/>
  <line x1="0" y1="278" x2="115" y2="278" stroke="#1e0e04" stroke-width="2"/>
  <line x1="265" y1="278" x2="400" y2="278" stroke="#1e0e04" stroke-width="2"/>
  <line x1="0" y1="290" x2="115" y2="290" stroke="#1e0e04" stroke-width="2"/>
  <line x1="265" y1="290" x2="400" y2="290" stroke="#1e0e04" stroke-width="2"/>

  <!-- ★ FOCAL ELEMENT: Golden doorway — the rectangle of light -->
  <!-- Outer golden glow — spills into dark interior -->
  <polygon points="115,0 265,0 310,300 70,300" fill="#E8B84B" opacity="0.18"/>
  <polygon points="118,0 262,0 298,300 82,300" fill="#E8B84B" opacity="0.22"/>
  <polygon points="122,0 258,0 285,300 95,300" fill="#fff8e0" opacity="0.15"/>

  <!-- The doorway itself — blazing golden exterior light -->
  <!-- Outside sky — warm, bright, dawn -->
  <rect x="115" y="0" width="150" height="300" fill="#c4956a"/>
  <!-- Outside sky bands — warm dawn gradient -->
  <rect x="115" y="0" width="150" height="80" fill="#E8B84B" opacity="0.9"/>
  <rect x="115" y="0" width="150" height="40" fill="#fff8e0" opacity="0.7"/>
  <!-- Outside ground — green new earth -->
  <rect x="115" y="220" width="150" height="80" fill="#4A6A2A"/>
  <rect x="115" y="220" width="150" height="20" fill="#7EC850" opacity="0.7"/>
  <!-- Ground detail — new growth -->
  <ellipse cx="155" cy="238" rx="20" ry="6" fill="#a8d870" opacity="0.8"/>
  <ellipse cx="220" cy="242" rx="18" ry="5" fill="#7EC850" opacity="0.7"/>
  <ellipse cx="248" cy="235" rx="14" ry="4" fill="#a8d870" opacity="0.6"/>

  <!-- Ramp going down diagonally out the door — movement line -->
  <polygon points="148,300 148,230 182,210 215,210 215,300" fill="#8B5E2F" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Ramp plank lines -->
  <line x1="148" y1="248" x2="215" y2="224" stroke="#6b4420" stroke-width="2"/>
  <line x1="148" y1="268" x2="215" y2="242" stroke="#6b4420" stroke-width="2"/>
  <line x1="148" y1="286" x2="215" y2="260" stroke="#6b4420" stroke-width="2"/>

  <!-- Door frame — structural verticals bounding the light -->
  <!-- Left door post -->
  <rect x="107" y="0" width="14" height="300" fill="#6b4420" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Right door post -->
  <rect x="265" y="0" width="14" height="300" fill="#6b4420" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Lintel — top -->
  <rect x="107" y="0" width="172" height="16" fill="#6b4420" stroke="#0A0812" stroke-width="2.5"/>

  <!-- Door panel — open, swung to left, showing thickness -->
  <polygon points="107,16 62,28 62,300 107,300" fill="#8B5E2F" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Door plank lines on open panel -->
  <line x1="107" y1="60" x2="64" y2="64" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="107" y1="100" x2="64" y2="106" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="107" y1="140" x2="64" y2="147" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="107" y1="180" x2="64" y2="188" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="107" y1="220" x2="64" y2="228" stroke="#6b4420" stroke-width="1.5"/>
  <line x1="107" y1="260" x2="64" y2="268" stroke="#6b4420" stroke-width="1.5"/>
  <!-- Door iron hinge -->
  <rect x="94" y="48" width="18" height="8" rx="2" fill="#2a2a2a" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="94" y="148" width="18" height="8" rx="2" fill="#2a2a2a" stroke="#0A0812" stroke-width="1.5"/>
  <rect x="94" y="248" width="18" height="8" rx="2" fill="#2a2a2a" stroke="#0A0812" stroke-width="1.5"/>

  <!-- LAYER 3 FOREGROUND: Silhouetted figures in the doorway -->
  <!-- The light BEHIND them makes them dark — backlit silhouettes -->
  <!-- Noah — front, tallest, slightly left of door centre -->
  <polygon points="167,185 160,300 182,300 178,185" fill="#0a0812"/>
  <rect x="161" y="168" width="20" height="20" rx="2" fill="#0a0812"/>
  <circle cx="171" cy="160" r="12" fill="#0a0812"/>
  <!-- Noah's arm raised — receiving the command, upward diagonal -->
  <line x1="171" y1="172" x2="155" y2="152" stroke="#0a0812" stroke-width="4"/>

  <!-- Person 2 — behind right, smaller (depth) -->
  <polygon points="190,196 184,300 202,300 198,196" fill="#160a02"/>
  <rect x="185" y="181" width="17" height="17" rx="2" fill="#160a02"/>
  <circle cx="193" cy="173" r="10" fill="#160a02"/>

  <!-- Person 3 — behind left, smaller -->
  <polygon points="148,200 143,300 159,300 156,200" fill="#160a02"/>
  <rect x="144" y="186" width="15" height="16" rx="2" fill="#160a02"/>
  <circle cx="151" cy="179" r="9" fill="#160a02"/>

  <!-- Person 4 — further back right, smaller still -->
  <polygon points="210,208 206,300 220,300 217,208" fill="#1e1008"/>
  <circle cx="213" cy="201" r="8" fill="#1e1008"/>

  <!-- Person 5 — further back left, smallest -->
  <polygon points="133,210 130,300 142,300 139,210" fill="#1e1008"/>
  <circle cx="136" cy="203" r="7" fill="#1e1008"/>

  <!-- Warm glow spill on floor in foreground -->
  <ellipse cx="190" cy="295" rx="65" ry="10" fill="#E8B84B" opacity="0.15"/>

</svg>
