<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- DEPTH LAYER 1 — dark sky, primarily night-blue, sombre -->
  <rect width="400" height="300" fill="#0a0e18"/>

  <!-- Sky dark gradient bands -->
  <rect x="0" y="0"   width="400" height="220" fill="#0c1220"/>
  <rect x="0" y="0"   width="400" height="140" fill="#101828"/>
  <rect x="0" y="0"   width="400" height="80"  fill="#141e30"/>
  <!-- Storm clouds — breaking, still dark, still present -->
  <ellipse cx="40"  cy="25"  rx="80"  ry="24" fill="#1a2438"/>
  <ellipse cx="180" cy="14"  rx="120" ry="26" fill="#1e2840"/>
  <ellipse cx="350" cy="28"  rx="100" ry="24" fill="#1a2438"/>
  <ellipse cx="80"  cy="54"  rx="90"  ry="20" fill="#162032"/>
  <ellipse cx="280" cy="48"  rx="110" ry="22" fill="#18223a"/>
  <ellipse cx="400" cy="58"  rx="70"  ry="18" fill="#162032"/>
  <!-- Cloud undersides -->
  <ellipse cx="40"  cy="46"  rx="80"  ry="11" fill="#080c18" opacity="0.65"/>
  <ellipse cx="180" cy="38"  rx="120" ry="12" fill="#060a14" opacity="0.65"/>
  <ellipse cx="350" cy="50"  rx="100" ry="11" fill="#080c18" opacity="0.60"/>

  <!-- THIN PALE HORIZON SLIVER — right edge of sky -->
  <rect x="0" y="220" width="400" height="4" fill="#2a3a4e" opacity="0.45"/>

  <!-- DEPTH LAYER 2 — dark water fills lower portion of frame, far below -->
  <rect x="0" y="224" width="400" height="76" fill="#061020"/>
  <rect x="0" y="222" width="400" height="5"  fill="#0e2040" opacity="0.60"/>
  <!-- Water shimmer — faint -->
  <line x1="0" y1="232" x2="400" y2="232" stroke="#4E9CCD" stroke-width="1"   opacity="0.16"/>
  <line x1="0" y1="248" x2="400" y2="248" stroke="#4E9CCD" stroke-width="1"   opacity="0.12"/>
  <line x1="0" y1="270" x2="400" y2="270" stroke="#4E9CCD" stroke-width="1"   opacity="0.09"/>

  <!-- THE ARK — lower-right, showing hull and window area prominently -->
  <!-- Ark sits low in frame — dark water around it -->
  <!-- Hull bottom -->
  <polygon points="200,248 370,248 382,268 188,268" fill="#8B5E2F" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Hull lower shading -->
  <polygon points="200,260 370,260 382,268 188,268" fill="#6b4420"/>
  <!-- Hull planks horizontal -->
  <line x1="208" y1="256" x2="362" y2="256" stroke="#5a3010" stroke-width="1"/>
  <line x1="205" y1="264" x2="366" y2="264" stroke="#5a3010" stroke-width="1"/>
  <!-- Superstructure -->
  <rect x="214" y="230" width="142" height="18" fill="#a06a35" stroke="#0A0812" stroke-width="2"/>
  <!-- Cabin planks -->
  <line x1="238" y1="230" x2="238" y2="248" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="262" y1="230" x2="262" y2="248" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="286" y1="230" x2="286" y2="248" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="310" y1="230" x2="310" y2="248" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="334" y1="230" x2="334" y2="248" stroke="#8B5E2F" stroke-width="1"/>
  <!-- Cabin roof -->
  <polygon points="202,230 290,210 382,230" fill="#C87050" stroke="#0A0812" stroke-width="2"/>
  <!-- Roof planks -->
  <line x1="222" y1="230" x2="232" y2="210" stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="250" y1="230" x2="256" y2="210" stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="280" y1="230" x2="282" y2="210" stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="310" y1="230" x2="305" y2="210" stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <line x1="340" y1="230" x2="330" y2="210" stroke="#8B5E2F" stroke-width="1" opacity="0.55"/>
  <!-- Ark window — warm amber light spilling out -->
  <rect x="248" y="214" width="30" height="18" fill="#1a0a00" stroke="#0A0812" stroke-width="2"/>
  <rect x="250" y="216" width="26" height="14" fill="#E8B84B" opacity="0.85"/>
  <rect x="252" y="218" width="22" height="10" fill="#fff8e0" opacity="0.50"/>
  <!-- Light spill from window — soft cone outward -->
  <polygon points="248,214 278,214 296,200 295,184 278,196 248,196" fill="#E8B84B" opacity="0.12"/>

  <!-- NOAH'S FOREARM — extends LEFT from window at LEFT EDGE of frame -->
  <!-- Forearm coming from approximately left edge -->
  <rect x="0"  y="176" width="68" height="16" fill="#C87050" rx="6" stroke="#0A0812" stroke-width="2"/>
  <!-- Wrist narrowing -->
  <rect x="50" y="177" width="20" height="14" fill="#D4956A" rx="4" stroke="#0A0812" stroke-width="1.5"/>
  <!-- HAND/PALM — flat, fingers spread upward-right -->
  <ellipse cx="76" cy="183" rx="18" ry="11" fill="#D4956A" stroke="#0A0812" stroke-width="2"/>
  <!-- Fingers — splayed open, dove launching from them, angled upper-right -->
  <line x1="65"  y1="175" x2="55"  y2="164" stroke="#D4956A" stroke-width="5" stroke-linecap="round"/>
  <line x1="72"  y1="173" x2="65"  y2="161" stroke="#D4956A" stroke-width="5" stroke-linecap="round"/>
  <line x1="79"  y1="172" x2="75"  y2="160" stroke="#D4956A" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="85"  y1="173" x2="84"  y2="161" stroke="#D4956A" stroke-width="4"   stroke-linecap="round"/>
  <line x1="90"  y1="176" x2="92"  y2="165" stroke="#D4956A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Thumb -->
  <line x1="78"  y1="192" x2="88"  y2="198" stroke="#D4956A" stroke-width="4" stroke-linecap="round"/>

  <!-- DEPTH LAYER 3 — THE DOVE — primary focal point, pure white, angled up-right -->
  <!-- Dove sits on hand at left, launching diagonal up-right — strong motion diagonal -->
  <!-- Body — elongated, angled ~35° upward right -->
  <ellipse cx="130" cy="144" rx="22" ry="9"  fill="#fff8e0" stroke="#0A0812" stroke-width="2"
           transform="rotate(-35,130,144)"/>
  <!-- Head — rounded, bright -->
  <ellipse cx="112" cy="130" rx="11" ry="10" fill="#fff8e0" stroke="#0A0812" stroke-width="2"/>
  <!-- Beak — small, pointed, angled up-right -->
  <polygon points="102,127 92,122 96,130" fill="#E8B84B" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Eye — dark, precise -->
  <circle cx="107" cy="127" r="3"   fill="#0A0812"/>
  <circle cx="106" cy="126" r="1.2" fill="#fff8e0" opacity="0.80"/>
  <!-- LEFT WING — partially spread, reaching upward, leading edge of flight -->
  <polygon points="122,138 80,106 78,118 112,146" fill="#fff8e0" stroke="#0A0812" stroke-width="2"/>
  <!-- Left wing feathers -->
  <polygon points="80,106 68,112 70,122 78,118"  fill="#f0f2f0" stroke="#0A0812" stroke-width="1.5"/>
  <polygon points="80,106 66,108 67,118 76,116"  fill="#fff8e0" stroke="#0A0812" stroke-width="1.5"/>
  <polygon points="80,106 64,104 66,114 74,114"  fill="#f0f2f0" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Left wing secondary feather lines -->
  <line x1="102" y1="112" x2="114" y2="144" stroke="#d8dada" stroke-width="1"/>
  <line x1="92"  y1="110" x2="106" y2="142" stroke="#d8dada" stroke-width="1"/>
  <!-- RIGHT WING — partially folded, lower, trailing -->
  <polygon points="134,148 168,136 166,148 144,156" fill="#fff8e0" stroke="#0A0812" stroke-width="1.5"/>
  <polygon points="168,136 180,140 178,150 166,148" fill="#f0f2f0" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Tail — short, fanned behind body -->
  <polygon points="148,153 162,164 162,170 156,167 154,172 150,165 148,160"
           fill="#fff8e0" stroke="#0A0812" stroke-width="1.5"/>
  <!-- Dove luminance glow — soft white halo against dark sky -->
  <ellipse cx="120" cy="136" rx="36" ry="26" fill="#fff8e0" opacity="0.08"/>
  <ellipse cx="118" cy="135" rx="22" ry="16" fill="#fff8e0" opacity="0.10"/>

  <!-- DIAGONAL MOTION LINE — strong upward-right trajectory from hand to exit -->
  <!-- Implied flight path from hand toward upper-right -->
  <path d="M82,172 Q100,158 120,138"
        stroke="#8898b0" stroke-width="1.5" fill="none" stroke-dasharray="4,6" opacity="0.45"/>

</svg>
