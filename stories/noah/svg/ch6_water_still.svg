<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">

  <!-- DEPTH LAYER 1 — oppressive sky ceiling, fills upper 50% -->
  <rect width="400" height="300" fill="#0e1420"/>

  <!-- Sky — total sealed grey ceiling, wall-to-wall cloud -->
  <rect x="0" y="0" width="400" height="150" fill="#141c2a"/>
  <rect x="0" y="0" width="400" height="90"  fill="#1a2234"/>
  <rect x="0" y="0" width="400" height="50"  fill="#202a3e"/>
  <!-- Cloud mass — unbroken, uniform, total sky coverage -->
  <ellipse cx="30"  cy="22"  rx="80"  ry="28" fill="#222e42"/>
  <ellipse cx="160" cy="12"  rx="120" ry="30" fill="#283448"/>
  <ellipse cx="330" cy="20"  rx="110" ry="32" fill="#222e42"/>
  <ellipse cx="60"  cy="52"  rx="100" ry="26" fill="#1c2838"/>
  <ellipse cx="220" cy="46"  rx="130" ry="28" fill="#24304a"/>
  <ellipse cx="390" cy="55"  rx="80"  ry="24" fill="#1c2838"/>
  <ellipse cx="110" cy="78"  rx="100" ry="22" fill="#1a2636"/>
  <ellipse cx="300" cy="72"  rx="120" ry="24" fill="#1c2838"/>
  <!-- Cloud undersides — nearly black, pressing down -->
  <ellipse cx="30"  cy="46"  rx="80"  ry="12" fill="#0a1020" opacity="0.75"/>
  <ellipse cx="160" cy="40"  rx="120" ry="14" fill="#080e1c" opacity="0.75"/>
  <ellipse cx="330" cy="48"  rx="110" ry="14" fill="#0a1020" opacity="0.70"/>
  <ellipse cx="200" cy="70"  rx="140" ry="13" fill="#080e1c" opacity="0.65"/>
  <!-- Third tier — lowest cloud layer -->
  <ellipse cx="80"  cy="100" rx="90"  ry="20" fill="#18222e"/>
  <ellipse cx="250" cy="95"  rx="110" ry="20" fill="#18222e"/>
  <ellipse cx="400" cy="105" rx="70"  ry="18" fill="#141c28"/>

  <!-- THE CIRCULAR STAR GAP — FOCAL POINT, one point of hope directly above ark -->
  <!-- Outer glow ring of cloud gap -->
  <ellipse cx="200" cy="92" rx="50"  ry="28" fill="#2a3a52" opacity="0.80"/>
  <ellipse cx="200" cy="92" rx="36"  ry="20" fill="#3a4e6a" opacity="0.75"/>
  <ellipse cx="200" cy="92" rx="26"  ry="14" fill="#485e78" opacity="0.70"/>
  <ellipse cx="200" cy="92" rx="18"  ry="10" fill="#5a7090" opacity="0.70"/>
  <ellipse cx="200" cy="92" rx="12"  ry="7"  fill="#6888a4" opacity="0.75"/>
  <ellipse cx="200" cy="92" rx="7"   ry="4"  fill="#88a8c0" opacity="0.80"/>
  <!-- Stars visible through gap — tiny, precious, the only light -->
  <circle cx="196" cy="88"  r="1.2" fill="#e8eaf0" opacity="0.90"/>
  <circle cx="204" cy="86"  r="1.0" fill="#e8eaf0" opacity="0.85"/>
  <circle cx="200" cy="82"  r="1.4" fill="#fff8e0" opacity="0.95"/>
  <circle cx="193" cy="92"  r="1.0" fill="#e8eaf0" opacity="0.80"/>
  <circle cx="208" cy="93"  r="0.9" fill="#e8eaf0" opacity="0.75"/>
  <circle cx="200" cy="98"  r="1.0" fill="#e8eaf0" opacity="0.80"/>
  <circle cx="196" cy="84"  r="0.7" fill="#fff8e0" opacity="0.70"/>
  <circle cx="205" cy="96"  r="0.7" fill="#e8eaf0" opacity="0.65"/>

  <!-- HORIZON LINE — water meets sealed sky -->
  <rect x="0" y="150" width="400" height="3" fill="#2a4060" opacity="0.50"/>

  <!-- DEPTH LAYER 2 — flat water fills lower 50%, near-total darkness -->
  <rect x="0" y="153" width="400" height="147" fill="#040c18"/>
  <!-- Water surface shimmer — just 3 faint horizontal lines, absolute stillness -->
  <rect x="0" y="153" width="400" height="2"   fill="#0e2a50" opacity="0.40"/>
  <line x1="0" y1="165" x2="400" y2="165" stroke="#4E9CCD" stroke-width="1"   opacity="0.12"/>
  <line x1="0" y1="195" x2="400" y2="195" stroke="#4E9CCD" stroke-width="1"   opacity="0.09"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#4E9CCD" stroke-width="1"   opacity="0.07"/>

  <!-- DEPTH LAYER 3 — THE ARK — tiny, centred, isolated -->
  <!-- Intentionally small — emphasises the vastness around it -->
  <!-- Hull shadow -->
  <polygon points="163,142 237,142 243,153 157,153" fill="#3a1e08" stroke="none"/>
  <!-- Hull main -->
  <polygon points="165,138 235,138 241,151 159,151" fill="#8B5E2F" stroke="#0A0812" stroke-width="2.5"/>
  <!-- Hull lower shading -->
  <polygon points="165,144 235,144 241,151 159,151" fill="#6b4420"/>
  <!-- Hull planks -->
  <line x1="169" y1="141" x2="231" y2="141" stroke="#5a3010" stroke-width="1"/>
  <line x1="167" y1="147" x2="233" y2="147" stroke="#5a3010" stroke-width="1"/>
  <!-- Superstructure -->
  <rect x="172" y="122" width="56" height="16" fill="#a06a35" stroke="#0A0812" stroke-width="2"/>
  <!-- Cabin planks -->
  <line x1="186" y1="122" x2="186" y2="138" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="200" y1="122" x2="200" y2="138" stroke="#8B5E2F" stroke-width="1"/>
  <line x1="214" y1="122" x2="214" y2="138" stroke="#8B5E2F" stroke-width="1"/>
  <!-- Cabin roof -->
  <polygon points="164,122 200,106 236,122" fill="#C87050" stroke="#0A0812" stroke-width="2"/>
  <!-- Tiny window -->
  <rect x="192" y="111" width="16" height="10" fill="#2a3c58" stroke="#0A0812" stroke-width="1.5"/>

  <!-- Ark reflection — faint in still water -->
  <polygon points="163,153 237,153 243,163 157,163" fill="#4a2c10" opacity="0.38"/>
  <rect x="172" y="163" width="56" height="11" fill="#5a3418" opacity="0.30"/>
  <polygon points="164,174 200,182 236,174"     fill="#643c1e" opacity="0.24"/>
  <!-- Reflection shimmer lines -->
  <line x1="157" y1="157" x2="243" y2="157" stroke="#4E9CCD" stroke-width="1" opacity="0.14"/>
  <line x1="154" y1="164" x2="246" y2="165" stroke="#4E9CCD" stroke-width="1" opacity="0.10"/>

  <!-- Vast empty water both sides of ark — open white space (dark) -->
  <!-- These empty zones are intentional — total isolation -->
  <line x1="0"   y1="153" x2="157" y2="153" stroke="#4E9CCD" stroke-width="1" opacity="0.08"/>
  <line x1="243" y1="153" x2="400" y2="153" stroke="#4E9CCD" stroke-width="1" opacity="0.08"/>

</svg>
