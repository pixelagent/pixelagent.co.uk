
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient Nineveh - 3D Model</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            z-index: 10;
        }
        #instructions {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #ddd;
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 10;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1 style="margin: 0; font-size: 1.8rem;">The Great City of Nineveh</h1>
        <p style="margin: 5px 0 0 0; opacity: 0.9;">The Imperial Capital</p>
    </div>
    <div id="instructions">Drag to orbit the city • Scroll to zoom • Explore the walls of Assyria</div>

    <script>
        let scene, camera, renderer, cityGroup;
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0.5, targetRotationY = 0.5;
        let rotationX = 0.5, rotationY = 0.5;

        function init() {
            // Scene & Sky
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.Fog(0x60a0d0, 50, 200);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(40, 30, 60);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lighting - High contrast desert sun
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xfff5e1, 1.2);
            sun.position.set(100, 100, 50);
            scene.add(sun);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
            scene.add(hemiLight);

            cityGroup = new THREE.Group();

            // Sky sphere — inside cityGroup so it rotates with the scene
            const skyGeo = new THREE.SphereGeometry(400, 32, 16);
            const skyMat = new THREE.MeshBasicMaterial({ color: 0x60a0d0, side: THREE.BackSide });
            cityGroup.add(new THREE.Mesh(skyGeo, skyMat));


            // Ground - Dusty Earth
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshPhongMaterial({ color: 0xc2a47c });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            cityGroup.add(ground);

            // River Tigris (Darker Blue)
            const riverGeo = new THREE.PlaneGeometry(40, 300);
            const riverMat = new THREE.MeshPhongMaterial({ color: 0x1e3a5f });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.rotation.x = -Math.PI / 2;
            river.position.set(-60, 0, 0);
            cityGroup.add(river);

            // Materials
            const wallMat = new THREE.MeshPhongMaterial({ color: 0x9c7b6a, flatShading: true });
            const gateMat = new THREE.MeshPhongMaterial({ color: 0x0047ab, shininess: 50 }); // Royal Blue
            const goldMat = new THREE.MeshPhongMaterial({ color: 0xffd700, shininess: 80 });

            // Walls Construction
            const cityRadius = 30;
            const wallHeight = 6;
            const wallThickness = 2.5;

            function createWall(x, z, w, d, rotY = 0) {
                const geo = new THREE.BoxGeometry(w, wallHeight, d);
                const wall = new THREE.Mesh(geo, wallMat);
                wall.position.set(x, wallHeight / 2, z);
                wall.rotation.y = rotY;
                cityGroup.add(wall);
            }

            // Square city walls
            createWall(0, -cityRadius, cityRadius * 2, wallThickness);
            createWall(0, cityRadius, cityRadius * 2, wallThickness);
            createWall(-cityRadius, 0, wallThickness, cityRadius * 2);
            createWall(cityRadius, 0, wallThickness, cityRadius * 2);

            // Corner Guard Towers
            const towerGeo = new THREE.BoxGeometry(4, 10, 4);
            const towerPositions = [
                [-cityRadius, -cityRadius], [cityRadius, -cityRadius],
                [-cityRadius, cityRadius], [cityRadius, cityRadius]
            ];
            towerPositions.forEach(pos => {
                const tower = new THREE.Mesh(towerGeo, wallMat);
                tower.position.set(pos[0], 5, pos[1]);
                cityGroup.add(tower);
            });

            // The King's Gate (Ishtar style)
            const gateGroup = new THREE.Group();
            const gTowerGeo = new THREE.BoxGeometry(4, 12, 5);
            const gTowerL = new THREE.Mesh(gTowerGeo, gateMat);
            gTowerL.position.set(0, 6, 2.5);
            gateGroup.add(gTowerL);
            
            const gTowerR = new THREE.Mesh(gTowerGeo, gateMat);
            gTowerR.position.set(0, 6, -2.5);
            gateGroup.add(gTowerR);

            const gArch = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 6), gateMat);
            gArch.position.set(0, 10, 0);
            gateGroup.add(gArch);

            gateGroup.position.set(-cityRadius, 0, 0);
            cityGroup.add(gateGroup);

            // Central Ziggurat
            for(let i = 0; i < 5; i++) {
                const size = 12 - (i * 2);
                const height = 3;
                const layer = new THREE.Mesh(new THREE.BoxGeometry(size, height, size), wallMat);
                layer.position.set(8, (i * height) + height/2, 8);
                cityGroup.add(layer);
                
                if(i === 4) { // Top Temple
                    const temple = new THREE.Mesh(new THREE.BoxGeometry(size * 0.7, 2, size * 0.7), goldMat);
                    temple.position.set(8, (i * height) + height + 1, 8);
                    cityGroup.add(temple);
                }
            }

            // Population - Small Adobe Houses
            const houseGeo = new THREE.BoxGeometry(2, 2, 2);
            for(let i = 0; i < 60; i++) {
                const house = new THREE.Mesh(houseGeo, wallMat);
                const rx = (Math.random() - 0.5) * (cityRadius * 1.6);
                const rz = (Math.random() - 0.5) * (cityRadius * 1.6);
                
                // Keep center clear for Ziggurat
                if (Math.abs(rx - 8) > 8 || Math.abs(rz - 8) > 8) {
                    house.position.set(rx, 1, rz);
                    cityGroup.add(house);
                }
            }

            scene.add(cityGroup);

            // Controls
            window.addEventListener('resize', onResize);
            document.addEventListener('mousedown', () => isMouseDown = true);
            document.addEventListener('mouseup', () => isMouseDown = false);
            document.addEventListener('mousemove', (e) => {
                if (isMouseDown) {
                    targetRotationY += e.movementX * 0.005;
                    targetRotationX += e.movementY * 0.005;
                }
            });
            document.addEventListener('wheel', (e) => {
                camera.position.z += e.deltaY * 0.05;
                camera.position.z = Math.max(15, Math.min(camera.position.z, 150));
            });

            animate();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            cityGroup.rotation.x = rotationX;
            cityGroup.rotation.y = rotationY;

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
