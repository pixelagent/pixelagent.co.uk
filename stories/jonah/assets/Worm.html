<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonah and the Wilted Plant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffcc33; font-family: sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #4a3728;
            z-index: 10;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #d35400;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }
        button:hover { background: #e67e22; }
        #status {
            color: #4a3728;
            font-weight: bold;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1 style="margin:0;">Jonah's Shade</h1>
        <p>Chapter 4: The Gourd and the Worm</p>
    </div>
    <div id="controls">
        <div id="status">The plant provides shade.</div>
        <button id="wormBtn">Send the Worm</button>
    </div>

    <script>
        let scene, camera, renderer, plant, leaves = [], trunk, sun, heatHaze;
        let isDying = false;
        let deathProgress = 0;
        let isMouseDown = false;
        let mouseX = 0, targetRotationY = 0.5, rotationY = 0.5;

        // Helper: build a capsule-like shape from a cylinder + two spheres merged into a Group
        function makeCapsuleGroup(radius, height, mat) {
            const group = new THREE.Group();
            const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 8), mat);
            group.add(cyl);
            const topSphere = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 8), mat);
            topSphere.position.y = height / 2;
            group.add(topSphere);
            const botSphere = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 8), mat);
            botSphere.position.y = -height / 2;
            group.add(botSphere);
            return group;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffaa33);
            scene.fog = new THREE.Fog(0xffaa33, 10, 50);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 12);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            sun = new THREE.DirectionalLight(0xffffff, 1.5);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshPhongMaterial({ color: 0xedc9af });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Jonah (Sitting) — CapsuleGeometry replaced with cylinder+spheres groups
            const jonahGroup = new THREE.Group();
            const skinMat = new THREE.MeshPhongMaterial({ color: 0xd2b48c });
            const robeMat = new THREE.MeshPhongMaterial({ color: 0x7b3f00 });

            const body = makeCapsuleGroup(0.4, 0.6, robeMat);
            body.position.y = 0.5;
            jonahGroup.add(body);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), skinMat);
            head.position.y = 1.3;
            jonahGroup.add(head);

            // Legs (crossed)
            const legL = makeCapsuleGroup(0.15, 0.5, robeMat);
            legL.rotation.z = Math.PI / 2.5;
            legL.position.set(-0.4, 0.2, 0.3);
            jonahGroup.add(legL);

            const legR = makeCapsuleGroup(0.15, 0.5, robeMat);
            legR.rotation.z = -Math.PI / 2.5;
            legR.position.set(0.4, 0.2, 0.3);
            jonahGroup.add(legR);

            jonahGroup.position.set(0, 0, 0);
            scene.add(jonahGroup);

            // The Plant
            plant = new THREE.Group();
            
            const trunkGeo = new THREE.CylinderGeometry(0.1, 0.15, 4, 8);
            const trunkMat = new THREE.MeshPhongMaterial({ color: 0x4a3728 });
            trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            trunk.rotation.z = -0.2;
            plant.add(trunk);

            // Large Broad Leaves
            const leafGeo = new THREE.IcosahedronGeometry(0.8, 1);
            const leafMat = new THREE.MeshPhongMaterial({ color: 0x2d5a27 });
            
            for(let i = 0; i < 8; i++) {
                const leaf = new THREE.Mesh(leafGeo, leafMat.clone());
                const angle = (i / 8) * Math.PI * 2;
                leaf.position.set(Math.cos(angle) * 1.2 - 0.5, 4 + Math.random(), Math.sin(angle) * 1.2);
                leaf.scale.set(1.5, 0.3, 1.5);
                leaf.rotation.x = Math.random();
                leaves.push(leaf);
                plant.add(leaf);
            }

            plant.position.set(1.5, 0, 0);
            scene.add(plant);

            // Heat Haze Particles
            const pGeo = new THREE.BufferGeometry();
            const pCount = 200;
            const pPos = new Float32Array(pCount * 3);
            for(let i=0; i<pCount*3; i++) pPos[i] = (Math.random()-0.5) * 20;
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            heatHaze = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.2 }));
            scene.add(heatHaze);

            // Events
            window.addEventListener('resize', onResize);
            document.addEventListener('mousedown', () => isMouseDown = true);
            document.addEventListener('mouseup', () => isMouseDown = false);
            document.addEventListener('mousemove', (e) => {
                if(isMouseDown) targetRotationY += e.movementX * 0.01;
            });
            
            document.getElementById('wormBtn').onclick = () => {
                isDying = true;
                document.getElementById('status').innerText = "A worm attacks the root...";
                document.getElementById('wormBtn').disabled = true;
            };

            animate();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            rotationY += (targetRotationY - rotationY) * 0.1;
            scene.rotation.y = rotationY;

            // Heat Haze Animation
            const positions = heatHaze.geometry.attributes.position.array;
            for(let i=1; i<positions.length; i+=3) {
                positions[i] += Math.sin(time + positions[i-1]) * 0.01;
                if(positions[i] > 10) positions[i] = -2;
            }
            heatHaze.geometry.attributes.position.needsUpdate = true;

            // Death Animation
            if(isDying && deathProgress < 1) {
                deathProgress += 0.005;
                
                // Change leaf color to brown
                leaves.forEach((leaf) => {
                    leaf.material.color.lerpColors(new THREE.Color(0x2d5a27), new THREE.Color(0x8b7355), deathProgress);
                    // Droop and shrink
                    leaf.rotation.x += 0.01;
                    leaf.scale.y = 0.3 * (1 - deathProgress * 0.8);
                    leaf.position.y -= 0.005;
                });

                // Trunk withers
                trunk.scale.x = 1 - (deathProgress * 0.3);
                trunk.scale.z = 1 - (deathProgress * 0.3);
                trunk.rotation.z = -0.2 - (deathProgress * 0.5);

                // Background gets harsher
                scene.background.lerpColors(new THREE.Color(0xffaa33), new THREE.Color(0xff6600), deathProgress * 0.5);

                if(deathProgress >= 1) {
                    document.getElementById('status').innerText = "The plant is dead. Jonah is faint from the heat.";
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
