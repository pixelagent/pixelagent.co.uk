<svg viewBox="0 0 600 400"
     xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="100%">

  <defs>

    <linearGradient id="desertSky"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5b31"/>
      <stop offset="45%" stop-color="#c78a53"/>
      <stop offset="100%" stop-color="#f3d09c"/>
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#fff3c7"/>
      <stop offset="100%" stop-color="#fff3c7" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- SKY -->

  <rect width="600"
        height="400"
        fill="url(#desertSky)"/>

  <!-- SUN -->

  <circle cx="470"
          cy="80"
          r="45"
          fill="#FFD84D"
          stroke="#0A0812"
          stroke-width="3"/>

  <circle cx="470"
          cy="80"
          r="110"
          fill="url(#sunGlow)"
          opacity="0.45"/>

  <!-- DISTANT DUNES -->

  <path d="
      M0 180
      Q120 140 240 180
      T480 170
      T600 160
      L600 260
      L0 260 Z"
      fill="#c08a55"/>

  <path d="
      M0 220
      Q150 190 300 220
      T600 200
      L600 280
      L0 280 Z"
      fill="#a96d3a"/>

  <!-- NINEVEH ON THE HORIZON -->

  <g transform="translate(220 75)"
     opacity="0.9">

    <!-- City glow -->
    <ellipse cx="140"
             cy="105"
             rx="130"
             ry="60"
             fill="#ffd98a"
             opacity="0.25"/>

    <!-- Walls -->
    <rect x="90"
          y="40"
          width="120"
          height="80"
          fill="#c48a56"
          stroke="#0A0812"
          stroke-width="3"/>

    <!-- Main tower -->
    <rect x="125"
          y="-20"
          width="50"
          height="140"
          fill="#d69d67"
          stroke="#0A0812"
          stroke-width="3"/>

    <polygon points="125,-20 150,-50 175,-20"
             fill="#8c592d"
             stroke="#0A0812"
             stroke-width="3"/>

    <!-- Side towers -->
    <rect x="55"
          y="15"
          width="35"
          height="105"
          fill="#b87b46"
          stroke="#0A0812"
          stroke-width="3"/>

    <rect x="210"
          y="20"
          width="35"
          height="100"
          fill="#b87b46"
          stroke="#0A0812"
          stroke-width="3"/>

    <!-- Great arch -->
    <path d="
      M130 120
      L130 80
      Q150 55 170 80
      L170 120 Z"
      fill="#4b2e17"
      stroke="#0A0812"
      stroke-width="3"/>

  </g>

  <!-- CURVED ROAD -->

  <path d="
      M210 400
      Q190 340 240 300
      Q290 255 285 220
      Q280 190 300 150
      Q320 120 340 150
      Q350 175 360 210
      Q375 260 420 400
      Z"
      fill="#d8b07a"
      stroke="#0A0812"
      stroke-width="4"/>

  <!-- Road highlight -->

  <path d="
      M300 400
      Q285 335 295 285
      Q305 235 300 150"
      fill="none"
      stroke="#eac99a"
      stroke-width="3"
      opacity="0.6"/>

  <!-- Worn tracks -->

  <path d="
      M255 400
      Q245 330 270 270
      Q290 220 280 160"
      fill="none"
      stroke="#b58855"
      stroke-width="2.5"/>

  <path d="
      M345 400
      Q340 330 320 270
      Q305 220 320 160"
      fill="none"
      stroke="#b58855"
      stroke-width="2.5"/>

  <!-- Rocks -->

  <g fill="#8f633a">

    <ellipse cx="170" cy="310" rx="9" ry="5"/>
    <ellipse cx="195" cy="275" rx="7" ry="4"/>
    <ellipse cx="420" cy="315" rx="8" ry="5"/>
    <ellipse cx="395" cy="255" rx="6" ry="3"/>

  </g>

  <!-- JONAH WALKING -->

  <g transform="translate(245 285) scale(0.7)">

    <!-- shadow -->
    <ellipse cx="20"
             cy="120"
             rx="28"
             ry="8"
             fill="#000"
             opacity="0.15"/>

    <!-- head -->
    <circle cx="15"
            cy="0"
            r="14"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="3"/>

    <!-- robe -->
    <path d="
       M-8 18
       L38 18
       L45 85
       L-15 85 Z"
       fill="#56748d"
       stroke="#0A0812"
       stroke-width="3"/>

    <!-- left arm -->
    <line x1="-5"
          y1="35"
          x2="-30"
          y2="50"
          stroke="#0A0812"
          stroke-width="5"
          stroke-linecap="round"/>

    <!-- right arm -->
    <line x1="35"
          y1="35"
          x2="55"
          y2="25"
          stroke="#0A0812"
          stroke-width="5"
          stroke-linecap="round"/>

    <!-- walking legs -->

    <line x1="10"
          y1="85"
          x2="-5"
          y2="115"
          stroke="#0A0812"
          stroke-width="5"
          stroke-linecap="round"/>

    <line x1="25"
          y1="85"
          x2="45"
          y2="115"
          stroke="#0A0812"
          stroke-width="5"
          stroke-linecap="round"/>

    <!-- Walking staff -->

    <line x1="55"
          y1="10"
          x2="65"
          y2="105"
          stroke="#6b4425"
          stroke-width="5"
          stroke-linecap="round"/>

  </g>

  <!-- DUST TRAIL -->

  <g opacity="0.4"
     fill="#f5d7aa">

    <ellipse cx="250" cy="325" rx="18" ry="7"/>
    <ellipse cx="232" cy="340" rx="14" ry="6"/>
    <ellipse cx="275" cy="350" rx="12" ry="5"/>

  </g>

  <!-- BIRDS -->

  <g fill="none"
     stroke="#fff8de"
     stroke-width="2">

    <path d="M120 90 q8 -8 16 0"/>
    <path d="M136 90 q8 -8 16 0"/>

    <path d="M190 70 q8 -8 16 0"/>
    <path d="M206 70 q8 -8 16 0"/>

    <path d="M320 85 q8 -8 16 0"/>
    <path d="M336 85 q8 -8 16 0"/>

  </g>

</svg>
