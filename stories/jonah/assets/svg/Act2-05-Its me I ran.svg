<svg viewBox="0 0 600 400"
     xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="100%">

  <defs>

    <linearGradient id="stormSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050912"/>
      <stop offset="50%" stop-color="#14263d"/>
      <stop offset="100%" stop-color="#223d5c"/>
    </linearGradient>

    <radialGradient id="lanternGlow">
      <stop offset="0%" stop-color="#fff4c7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff4c7" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Storm Sky -->
  <rect width="600" height="400"
        fill="url(#stormSky)"/>

  <!-- Lightning -->
  <path d="M120 0
           L85 80
           L125 80
           L75 170
           L160 70
           L120 70 Z"
        fill="#fff6b2"
        opacity="0.9"/>

  <!-- Ship Deck -->
  <g transform="rotate(-7 300 250)">

    <path d="M-50 260
             L650 260
             L650 430
             L-50 430 Z"
          fill="#6f5338"
          stroke="#0A0812"
          stroke-width="7"/>

    <!-- Deck planks -->
    <g stroke="#503823"
       stroke-width="2">
      <line x1="-50" y1="300" x2="650" y2="300"/>
      <line x1="-50" y1="340" x2="650" y2="340"/>
      <line x1="-50" y1="380" x2="650" y2="380"/>
    </g>

    <!-- Mast -->
    <rect x="282"
          y="-40"
          width="36"
          height="420"
          fill="#4a4f56"
          stroke="#0A0812"
          stroke-width="6"/>

    <!-- Damaged rope -->
    <path d="M300 40
             C250 90 250 140 290 190"
          fill="none"
          stroke="#2b1b11"
          stroke-width="6"/>

  </g>

  <!-- Lantern Glow -->
  <circle cx="300"
          cy="225"
          r="95"
          fill="url(#lanternGlow)"
          opacity="0.75"/>

  <!-- Sailor Left -->
  <g opacity="0.9">

    <circle cx="165" cy="220"
            r="14"
            fill="#f3d3b0"
            stroke="#0A0812"
            stroke-width="3"/>

    <path d="M145 235
             L185 235
             L190 300
             L140 300 Z"
          fill="#243345"
          stroke="#0A0812"
          stroke-width="4"/>

  </g>

  <!-- Sailor Right -->
  <g opacity="0.9">

    <circle cx="435" cy="220"
            r="14"
            fill="#f3d3b0"
            stroke="#0A0812"
            stroke-width="3"/>

    <path d="M415 235
             L455 235
             L460 300
             L410 300 Z"
          fill="#243345"
          stroke="#0A0812"
          stroke-width="4"/>

  </g>

  <!-- Jonah Central Focus -->
  <g>

    <!-- Head -->
    <circle cx="300"
            cy="190"
            r="18"
            fill="#f3d3b0"
            stroke="#0A0812"
            stroke-width="3"/>

    <!-- Hair -->
    <path d="M282 185
             Q300 160 320 183"
          fill="none"
          stroke="#1b1b1b"
          stroke-width="5"
          stroke-linecap="round"/>

    <!-- Eyes lowered -->
    <path d="M292 192
             Q296 190 300 192"
          fill="none"
          stroke="#0A0812"
          stroke-width="2"/>

    <path d="M302 192
             Q306 190 310 192"
          fill="none"
          stroke="#0A0812"
          stroke-width="2"/>

    <!-- Mouth -->
    <path d="M295 203
             Q300 207 305 203"
          fill="none"
          stroke="#0A0812"
          stroke-width="2"/>

    <!-- Body -->
    <path d="M275 210
             L325 210
             L332 315
             L268 315 Z"
          fill="#2f4056"
          stroke="#0A0812"
          stroke-width="4"/>

    <!-- Open confession gesture -->
    <line x1="275" y1="240"
          x2="235" y2="225"
          stroke="#0A0812"
          stroke-width="6"
          stroke-linecap="round"/>

    <line x1="325" y1="240"
          x2="365" y2="225"
          stroke="#0A0812"
          stroke-width="6"
          stroke-linecap="round"/>

  </g>

  <!-- Rain converging toward Jonah -->
  <g stroke="#73d9ff"
     stroke-width="2.5"
     opacity="0.45">

    <line x1="40" y1="0" x2="180" y2="250"/>
    <line x1="100" y1="0" x2="220" y2="250"/>
    <line x1="180" y1="0" x2="260" y2="250"/>

    <line x1="560" y1="0" x2="420" y2="250"/>
    <line x1="500" y1="0" x2="380" y2="250"/>
    <line x1="420" y1="0" x2="340" y2="250"/>

  </g>

  <!-- Wave tops visible behind deck -->
  <g fill="none"
     stroke="#6fd7ff"
     stroke-width="4"
     opacity="0.7">

    <path d="M0 175
             Q40 150 80 175
             T160 175
             T240 175
             T320 175
             T400 175
             T480 175
             T560 175"/>

  </g>

</svg>