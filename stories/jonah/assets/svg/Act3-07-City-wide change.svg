<svg viewBox="0 0 600 400"
     xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="100%">

  <defs>

    <linearGradient id="sky"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#6f4b26"/>
      <stop offset="100%" stop-color="#d6a466"/>
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#ffe89a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffe89a" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Sky -->

  <rect width="600"
        height="400"
        fill="url(#sky)"/>

  <!-- Sun -->

  <circle cx="480"
          cy="75"
          r="55"
          fill="#FFD84D"
          stroke="#0A0812"
          stroke-width="3"/>

  <circle cx="480"
          cy="75"
          r="90"
          fill="url(#sunGlow)"
          opacity="0.3"/>

  <!-- City Walls -->

  <path d="
        M40 240
        L40 170
        L560 170
        L560 240
        Z"
        fill="#b67c48"
        stroke="#0A0812"
        stroke-width="5"/>

  <!-- Towers -->

  <g stroke="#0A0812"
     stroke-width="4"
     stroke-linejoin="round">

    <rect x="80"
          y="90"
          width="70"
          height="150"
          fill="#9c6030"/>

    <rect x="250"
          y="60"
          width="100"
          height="180"
          fill="#aa703d"/>

    <rect x="450"
          y="100"
          width="70"
          height="140"
          fill="#c08955"/>

  </g>

  <!-- Archways -->

  <path d="M280 240
           L280 190
           Q300 160 320 190
           L320 240 Z"
        fill="#3f2a16"
        stroke="#0A0812"
        stroke-width="4"/>

  <!-- City Square -->

  <rect x="0"
        y="240"
        width="600"
        height="160"
        fill="#7e512a"/>

  <!-- Positive Action Groups -->

  <!-- Group 1 Helping -->
  <g transform="translate(90 285)">

    <circle cx="0" cy="0" r="10"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="2"/>

    <circle cx="35" cy="0" r="10"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="2"/>

    <line x1="0" y1="12"
          x2="0" y2="38"
          stroke="#0A0812"
          stroke-width="4"/>

    <line x1="35" y1="12"
          x2="35" y2="38"
          stroke="#0A0812"
          stroke-width="4"/>

    <line x1="0" y1="20"
          x2="35" y2="20"
          stroke="#0A0812"
          stroke-width="4"/>

  </g>

  <!-- Group 2 Sharing -->

  <g transform="translate(220 300)">

    <circle cx="0" cy="0" r="10"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="2"/>

    <circle cx="40" cy="0" r="10"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="2"/>

    <rect x="10"
          y="12"
          width="20"
          height="14"
          fill="#c98b4d"
          stroke="#0A0812"
          stroke-width="2"/>

  </g>

  <!-- Group 3 Sweeping -->

  <g transform="translate(360 295)">

    <circle cx="0" cy="0" r="10"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="2"/>

    <line x1="0"
          y1="10"
          x2="0"
          y2="35"
          stroke="#0A0812"
          stroke-width="4"/>

    <line x1="10"
          y1="15"
          x2="32"
          y2="42"
          stroke="#0A0812"
          stroke-width="4"/>

  </g>

  <!-- Group 4 Family -->

  <g transform="translate(500 300)">

    <circle cx="0" cy="0" r="10"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="2"/>

    <circle cx="25" cy="5" r="7"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="2"/>

    <circle cx="45" cy="0" r="10"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="2"/>

  </g>

  <!-- Sackcloth Banners -->

  <g opacity="0.85">

    <path d="M70 140
             Q115 170 160 140
             L160 190
             L70 190 Z"
          fill="#2a3243"/>

    <path d="M250 120
             Q300 160 350 120
             L350 190
             L250 190 Z"
          fill="#2a3243"/>

    <path d="M440 145
             Q480 175 520 145
             L520 190
             L440 190 Z"
          fill="#2a3243"/>

  </g>

  <!-- Path leading into city -->

  <path d="
        M260 400
        L340 400
        L320 240
        L280 240
        Z"
        fill="#c89b67"
        opacity="0.8"/>

  <!-- Birds of hope -->

  <g fill="none"
     stroke="#fff8d8"
     stroke-width="2">

    <path d="M160 80 q8 -8 16 0"/>
    <path d="M176 80 q8 -8 16 0"/>

    <path d="M215 60 q8 -8 16 0"/>
    <path d="M231 60 q8 -8 16 0"/>

    <path d="M310 95 q8 -8 16 0"/>
    <path d="M326 95 q8 -8 16 0"/>

  </g>

</svg>