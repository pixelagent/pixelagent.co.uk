<svg viewBox="0 0 600 400"
     xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="100%">

  <defs>

    <!-- Evening Sky -->
    <linearGradient id="twilightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18364d"/>
      <stop offset="35%" stop-color="#2b5876"/>
      <stop offset="100%" stop-color="#f0b46c"/>
    </linearGradient>

    <!-- City Glow -->
    <radialGradient id="cityGlow">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Sky -->
  <rect width="600"
        height="400"
        fill="url(#twilightSky)"/>

  <!-- Setting Sun -->
  <circle cx="490"
          cy="90"
          r="45"
          fill="#ffd84d"
          stroke="#0A0812"
          stroke-width="3"/>

  <circle cx="490"
          cy="90"
          r="90"
          fill="url(#cityGlow)"
          opacity="0.4"/>

  <!-- Birds -->
  <g fill="none"
     stroke="#fff5d8"
     stroke-width="2">

    <path d="M140 80 q8 -8 16 0"/>
    <path d="M156 80 q8 -8 16 0"/>

    <path d="M220 60 q8 -8 16 0"/>
    <path d="M236 60 q8 -8 16 0"/>

  </g>

  <!-- Distant Hills -->
  <path d="
       M0 260
       Q120 210 240 250
       T480 240
       T600 250
       L600 400
       L0 400 Z"
       fill="#304756"/>

  <!-- Nineveh -->
  <g transform="translate(310 135)"
     opacity="0.95">

    <!-- glow -->
    <ellipse cx="120"
             cy="110"
             rx="130"
             ry="70"
             fill="url(#cityGlow)"/>

    <!-- city wall -->
    <rect x="20"
          y="100"
          width="220"
          height="55"
          fill="#9e6c3f"
          stroke="#0A0812"
          stroke-width="4"/>

    <!-- towers -->
    <rect x="40"
          y="30"
          width="50"
          height="125"
          fill="#c28a52"
          stroke="#0A0812"
          stroke-width="4"/>

    <polygon points="40,30 65,0 90,30"
             fill="#8e5b30"
             stroke="#0A0812"
             stroke-width="4"/>

    <rect x="105"
          y="10"
          width="70"
          height="145"
          fill="#d1975d"
          stroke="#0A0812"
          stroke-width="4"/>

    <rect x="190"
          y="50"
          width="40"
          height="105"
          fill="#b47e4d"
          stroke="#0A0812"
          stroke-width="4"/>

    <!-- gate -->
    <path d="
          M120 155
          L120 115
          Q130 95 140 115
          L140 155 Z"
          fill="#4a2a10"
          stroke="#0A0812"
          stroke-width="3"/>

    <!-- city lights -->
    <circle cx="60" cy="95" r="3" fill="#fff7d8"/>
    <circle cx="150" cy="80" r="3" fill="#fff7d8"/>
    <circle cx="210" cy="105" r="3" fill="#fff7d8"/>

  </g>

  <!-- Curving hillside -->
  <path d="
       M0 285
       Q130 240 250 275
       Q350 305 600 250
       L600 400
       L0 400 Z"
       fill="#18252f"
       stroke="#0A0812"
       stroke-width="4"/>

  <!-- Withered plant remains -->
  <g transform="translate(80 255)">

    <path d="
      M0 90
      L10 20
      M10 35
      L-15 10
      M10 45
      L35 15
      M15 60
      L-5 35"
      fill="none"
      stroke="#5c3a22"
      stroke-width="6"
      stroke-linecap="round"/>

  </g>

  <!-- Jonah seated -->
  <g transform="translate(135 255)">

    <!-- head -->
    <circle cx="0"
            cy="0"
            r="14"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="3"/>

    <!-- body -->
    <path d="
      M-18 18
      L18 18
      L22 65
      L-22 65 Z"
      fill="#49627a"
      stroke="#0A0812"
      stroke-width="3"/>

    <!-- seated legs -->
    <line x1="-5"
          y1="65"
          x2="-25"
          y2="82"
          stroke="#0A0812"
          stroke-width="4"
          stroke-linecap="round"/>

    <line x1="8"
          y1="65"
          x2="30"
          y2="78"
          stroke="#0A0812"
          stroke-width="4"
          stroke-linecap="round"/>

    <!-- arm resting -->
    <line x1="10"
          y1="35"
          x2="28"
          y2="48"
          stroke="#0A0812"
          stroke-width="4"
          stroke-linecap="round"/>

  </g>

  <!-- Path toward city -->
  <path d="
      M120 400
      Q180 340 260 315
      Q340 285 420 220"
      fill="none"
      stroke="#cfa674"
      stroke-width="8"
      stroke-linecap="round"
      opacity="0.7"/>

  <!-- First stars -->
  <g fill="#ffffff"
     opacity="0.8">

    <circle cx="90" cy="35" r="1.5"/>
    <circle cx="180" cy="25" r="1.3"/>
    <circle cx="310" cy="50" r="1.5"/>
    <circle cx="560" cy="35" r="1.3"/>

  </g>

</svg>