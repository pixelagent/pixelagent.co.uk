<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <rect width="600" height="400" fill="#050912"/>

  <!-- Tilted, Endangered Ship Vessel -->
  <g transform="translate(190, 150) rotate(35)">
    <line x1="90" y1="90" x2="90" y2="-30" stroke="#0A0812" stroke-width="7"/>
    <!-- Snapped Sail -->
    <path d="M90 20 L150 50 L90 80 Z" fill="#6c757d" stroke="#0A0812" stroke-width="4"/>
    <path d="M10 80 L170 80 L190 115 L25 115 Z" fill="#6c757d" stroke="#0A0812" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- Giant "Eating" Wave Overtaking -->
  <path d="M-20 450 C30 150, 200 50, 350 150 C400 180, 380 250, 280 250 C230 250, 180 300, 200 400 Z" fill="#1d3557" stroke="#0A0812" stroke-width="6" stroke-linejoin="round"/>
  <!-- Wave Teeth / Foam Foam -->
  <path d="M350 150 L320 180 L360 190 L330 210 L370 230 L340 240 L380 250" fill="none" stroke="#4ecdc4" stroke-width="5" stroke-linejoin="round"/>
  <path d="M180 120 L220 150 L190 180 L230 200" fill="none" stroke="#4ecdc4" stroke-width="5" stroke-linejoin="round"/>

  <!-- Dramatic Ambient Lightning Bolt Matrix -->
  <path d="M420 -10 L370 110 L410 110 L330 220 L360 220 L280 320 L305 200 L270 200 L330 90 L300 90 Z" fill="#FFD84D" stroke="#FFF7E8" stroke-width="3.5" stroke-linejoin="miter"/>

  <!-- Foreground Wave Block -->
  <path d="M-20 300 C200 220, 400 350, 640 250 L640 400 L-20 400 Z" fill="#0f1f34" stroke="#0A0812" stroke-width="6"/>

  <line x1="80" y1="0" x2="10" y2="300" stroke="#4ecdc4" opacity="0.4" stroke-width="3"/>
  <line x1="510" y1="0" x2="440" y2="300" stroke="#4ecdc4" opacity="0.4" stroke-width="3"/>
</svg>
