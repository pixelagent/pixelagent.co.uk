<svg viewBox="0 0 600 400"
     xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="100%">

  <defs>

    <linearGradient id="harbourSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#112233"/>
      <stop offset="50%" stop-color="#1c3651"/>
      <stop offset="100%" stop-color="#405b75"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17314b"/>
      <stop offset="100%" stop-color="#08111c"/>
    </linearGradient>

    <linearGradient id="dockWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bc462e"/>
      <stop offset="100%" stop-color="#8a2e1c"/>
    </linearGradient>

  </defs>

  <!-- Sky -->

  <rect width="600"
        height="400"
        fill="url(#harbourSky)"/>

  <!-- Moon -->

  <circle cx="510"
          cy="60"
          r="32"
          fill="#FFF7E8"/>

  <circle cx="510"
          cy="60"
          r="60"
          fill="#FFF7E8"
          opacity="0.12"/>

  <!-- Harbour Warehouses -->

  <g opacity="0.9">

    <rect x="0"
          y="90"
          width="90"
          height="55"
          fill="#472819"/>

    <rect x="70"
          y="75"
          width="120"
          height="70"
          fill="#63371f"/>

    <rect x="170"
          y="85"
          width="115"
          height="60"
          fill="#58311c"/>

    <rect x="275"
          y="65"
          width="150"
          height="80"
          fill="#704123"/>

    <rect x="420"
          y="85"
          width="105"
          height="60"
          fill="#5f341d"/>

  </g>

  <!-- Water -->

  <rect x="0"
        y="145"
        width="600"
        height="135"
        fill="url(#water)"/>

  <!-- Water reflections -->

  <g stroke="#5d7894"
     stroke-width="2"
     opacity="0.25">

    <line x1="0" y1="175" x2="600" y2="175"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="250" x2="600" y2="250"/>

  </g>

  <!-- Harbour Ships -->

  <g stroke="#0A0812"
     stroke-width="3">

    <!-- Ship 1 -->

    <line x1="120" y1="35"
          x2="120" y2="155"/>

    <path d="M60 155
             L180 155
             L165 180
             L75 180 Z"
          fill="#20160f"/>

    <path d="M120 55
             L160 80
             L120 105 Z"
          fill="#ddd5c7"/>

    <!-- Ship 2 -->

    <line x1="260" y1="25"
          x2="260" y2="165"/>

    <path d="M180 165
             L340 165
             L320 195
             L200 195 Z"
          fill="#20160f"/>

    <path d="M260 45
             L320 85
             L260 125 Z"
          fill="#ddd5c7"/>

    <!-- Ship 3 (Jonah's ship) -->

    <line x1="430" y1="15"
          x2="430" y2="190"/>

    <line x1="465" y1="40"
          x2="465" y2="190"/>

    <path d="M340 180
             L540 180
             L515 220
             L365 220 Z"
          fill="#27180f"/>

    <path d="M430 40
             L520 95
             L430 150 Z"
          fill="#e8e0d1"/>

    <path d="M465 70
             L520 105
             L465 140 Z"
          fill="#d3cab9"/>

  </g>

  <!-- Gangplank -->

  <line x1="370"
        y1="220"
        x2="300"
        y2="270"
        stroke="#8a5a2e"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- Dock -->

  <path d="
      M-80 420
      L120 280
      L680 280
      L760 420
      Z"
      fill="url(#dockWood)"
      stroke="#0A0812"
      stroke-width="5"/>

  <!-- Dock boards -->

  <g stroke="#0A0812"
     stroke-width="3"
     opacity="0.7">

    <line x1="60" y1="420" x2="210" y2="280"/>
    <line x1="180" y1="420" x2="290" y2="280"/>
    <line x1="310" y1="420" x2="370" y2="280"/>
    <line x1="450" y1="420" x2="440" y2="280"/>
    <line x1="590" y1="420" x2="520" y2="280"/>

  </g>

  <!-- Cargo Area -->

  <g>

    <!-- Crates -->

    <rect x="55" y="225"
          width="45"
          height="45"
          fill="#e2d4b9"
          stroke="#0A0812"
          stroke-width="4"/>

    <line x1="55" y1="225"
          x2="100" y2="270"
          stroke="#0A0812"
          stroke-width="3"/>

    <line x1="100" y1="225"
          x2="55" y2="270"
          stroke="#0A0812"
          stroke-width="3"/>

    <rect x="95" y="205"
          width="55"
          height="55"
          fill="#f2e8d4"
          stroke="#0A0812"
          stroke-width="4"/>

    <!-- Barrels -->

    <ellipse cx="210"
             cy="248"
             rx="12"
             ry="15"
             fill="#8a5a2e"
             stroke="#0A0812"
             stroke-width="2"/>

    <ellipse cx="235"
             cy="248"
             rx="12"
             ry="15"
             fill="#8a5a2e"
             stroke="#0A0812"
             stroke-width="2"/>

  </g>

  <!-- Dock Worker -->

  <g transform="translate(165 245) scale(0.45)">

    <circle cx="50"
            cy="35"
            r="16"
            fill="#FFAD87"
            stroke="#0A0812"
            stroke-width="4"/>

    <path d="M15 70
             Q50 55 85 70
             L75 115
             L25 115 Z"
          fill="#6e3f16"
          stroke="#0A0812"
          stroke-width="4"/>

  </g>

  <!-- Jonah (small, slipping away) -->

  <g transform="translate(285 245) scale(0.42)">

    <circle cx="50"
            cy="35"
            r="16"
            fill="#FFAD87"
            stroke="#0A0812"
            stroke-width="4"/>

    <path d="M15 70
             Q50 55 85 70
             L75 115
             L25 115 Z"
          fill="#6e3f16"
          stroke="#0A0812"
          stroke-width="4"/>

    <line x1="25"
          y1="65"
          x2="0"
          y2="120"
          stroke="#0A0812"
          stroke-width="5"
          stroke-linecap="round"/>

  </g>

  <!-- Rope and moorings -->

  <g stroke="#5a371d"
     stroke-width="4"
     fill="none">

    <path d="M520 220 Q550 230 565 280"/>
    <path d="M380 220 Q350 235 300 270"/>

  </g>

  <!-- Seagulls -->

  <g fill="none"
     stroke="#FFF7E8"
     stroke-width="2">

    <path d="M70 50 q8 -8 16 0"/>
    <path d="M86 50 q8 -8 16 0"/>

    <path d="M280 40 q8 -8 16 0"/>
    <path d="M296 40 q8 -8 16 0"/>

    <path d="M420 55 q8 -8 16 0"/>
    <path d="M436 55 q8 -8 16 0"/>

  </g>

</svg>