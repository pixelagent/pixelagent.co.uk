<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <rect width="600" height="400" fill="#050912"/>

  <!-- Jonah Sinking (very small now) -->
  <circle cx="300" cy="100" r="10" fill="#1b2333" stroke="#4ecdc4" stroke-width="2"/>
  <path d="M300 80 Q320 50, 300 20" fill="none" stroke="#4ecdc4" stroke-width="3" stroke-dasharray="5 10"/>

  <!-- Massive Looming Shadow from below -->
  <path d="M-100 500 C100 200, 500 200, 700 500 Z" fill="#0A0812" stroke="#121824" stroke-width="10"/>
  
  <!-- One giant glowing eye slit -->
  <path d="M400 320 C420 310, 450 310, 470 320 C450 330, 420 330, 400 320 Z" fill="#FFD84D"/>
  
  <!-- Subtle Baleen/Teeth ridges in the dark -->
  <path d="M150 250 L140 300 M200 230 L195 290 M250 220 L245 285 M300 220 L295 285" stroke="#121824" stroke-width="5" stroke-linecap="round"/>
</svg>
