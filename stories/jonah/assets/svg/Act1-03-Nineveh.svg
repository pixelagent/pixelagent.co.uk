<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="angrySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2e1c"/>
      <stop offset="60%" stop-color="#bc462e"/>
      <stop offset="100%" stop-color="#e65c40"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#angrySky)"/>

  <!-- Chaotic Cityscape Silhouette (Nineveh) -->
  <path d="M0 400 L0 250 L40 250 L60 180 L90 220 L120 150 L160 230 L210 120 L250 210 L300 160 L340 240 L390 140 L430 220 L480 180 L520 260 L560 200 L600 270 L600 400 Z" fill="#0A0812" stroke="#FFF7E8" stroke-width="2"/>
  
  <!-- Glaring city windows (rude/loud representation) -->
  <rect x="50" y="270" width="15" height="15" fill="#FFF7E8"/>
  <rect x="220" y="160" width="15" height="40" fill="#FFF7E8"/>
  <rect x="400" y="250" width="20" height="15" fill="#FFF7E8"/>
  <circle cx="120" cy="190" r="8" fill="#FFF7E8"/>

  <!-- Giant Comic "NO" / Cross Over It -->
  <line x1="150" y1="80" x2="450" y2="320" stroke="#112233" stroke-width="40" stroke-linecap="round"/>
  <line x1="450" y1="80" x2="150" y2="320" stroke="#112233" stroke-width="40" stroke-linecap="round"/>
  
  <line x1="150" y1="80" x2="450" y2="320" stroke="#0A0812" stroke-width="25" stroke-linecap="round"/>
  <line x1="450" y1="80" x2="150" y2="320" stroke="#0A0812" stroke-width="25" stroke-linecap="round"/>
</svg>
