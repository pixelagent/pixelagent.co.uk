<svg viewBox="0 0 600 400"
     xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="100%">

  <defs>

    <linearGradient id="sky"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a2d"/>
      <stop offset="100%" stop-color="#d8a05f"/>
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#ffe5a3"/>
      <stop offset="100%" stop-color="#ffe5a3" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Sky -->

  <rect width="600"
        height="400"
        fill="url(#sky)"/>

  <!-- Sun -->

  <circle cx="500"
          cy="70"
          r="45"
          fill="#FFD84D"
          stroke="#0A0812"
          stroke-width="3"/>

  <circle cx="500"
          cy="70"
          r="90"
          fill="url(#sunGlow)"
          opacity="0.4"/>

  <!-- City backdrop -->

  <g transform="translate(170 40)"
     stroke="#0A0812"
     stroke-width="4">

    <rect x="0"
          y="100"
          width="260"
          height="140"
          fill="#b77b46"/>

    <rect x="90"
          y="20"
          width="80"
          height="220"
          fill="#ca915b"/>

    <polygon points="90,20 130,-20 170,20"
             fill="#8e592d"/>

    <rect x="15"
          y="70"
          width="50"
          height="170"
          fill="#be844f"/>

    <rect x="195"
          y="90"
          width="50"
          height="150"
          fill="#be844f"/>

  </g>

  <!-- Palace platform -->

  <rect x="120"
        y="240"
        width="360"
        height="40"
        fill="#8f5a2b"
        stroke="#0A0812"
        stroke-width="4"/>

  <!-- Throne -->

  <g transform="translate(295 160)">

    <path d="
         M-40 80
         L-40 0
         L40 0
         L40 80"
         fill="#9a6232"
         stroke="#0A0812"
         stroke-width="4"/>

    <rect x="-55"
          y="70"
          width="110"
          height="15"
          fill="#71431f"/>

  </g>

  <!-- Crown abandoned -->

  <g transform="translate(250 235) rotate(-15)">

    <path d="
          M0 20
          L10 0
          L20 15
          L30 0
          L40 20
          Z"
          fill="#FFD84D"
          stroke="#0A0812"
          stroke-width="2"/>

    <circle cx="10" cy="0" r="3" fill="#4ecdc4"/>
    <circle cx="30" cy="0" r="3" fill="#e85d75"/>

  </g>

  <!-- King kneeling -->

  <g transform="translate(320 250)">

    <!-- head -->

    <circle cx="0"
            cy="-45"
            r="16"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="3"/>

    <!-- sackcloth robe -->

    <path d="
         M-26 -25
         L26 -25
         L36 45
         L-36 45 Z"
         fill="#6f6757"
         stroke="#0A0812"
         stroke-width="3"/>

    <!-- kneeling legs -->

    <line x1="-10" y1="45"
          x2="-35" y2="65"
          stroke="#0A0812"
          stroke-width="5"
          stroke-linecap="round"/>

    <line x1="10" y1="45"
          x2="35" y2="65"
          stroke="#0A0812"
          stroke-width="5"
          stroke-linecap="round"/>

    <!-- bowed head cue -->

    <line x1="-16" y1="-10"
          x2="-40" y2="0"
          stroke="#0A0812"
          stroke-width="5"
          stroke-linecap="round"/>

    <line x1="16" y1="-10"
          x2="40" y2="0"
          stroke="#0A0812"
          stroke-width="5"
          stroke-linecap="round"/>

  </g>

  <!-- Ashes -->

  <ellipse cx="320"
           cy="315"
           rx="70"
           ry="20"
           fill="#54606c"
           opacity="0.7"/>

  <!-- Citizens -->

  <g stroke="#0A0812"
     stroke-width="3">

    <circle cx="170" cy="265" r="10" fill="#f3d3b0"/>
    <line x1="170" y1="275" x2="170" y2="310"/>

    <circle cx="210" cy="260" r="10" fill="#f3d3b0"/>
    <line x1="210" y1="270" x2="210" y2="305"/>

    <circle cx="430" cy="260" r="10" fill="#f3d3b0"/>
    <line x1="430" y1="270" x2="430" y2="305"/>

    <circle cx="470" cy="265" r="10" fill="#f3d3b0"/>
    <line x1="470" y1="275" x2="470" y2="310"/>

  </g>

  <!-- Jonah -->

  <g transform="translate(90 250)">

    <circle cx="0"
            cy="0"
            r="15"
            fill="#f2d1aa"
            stroke="#0A0812"
            stroke-width="3"/>

    <!-- shocked expression -->

    <circle cx="-4" cy="-2" r="2"/>
    <circle cx="4" cy="-2" r="2"/>

    <circle cx="0" cy="8" r="4"
            fill="#0A0812"/>

    <path d="
          M-20 18
          L20 18
          L28 85
          L-28 85 Z"
          fill="#4f6c84"
          stroke="#0A0812"
          stroke-width="3"/>

    <!-- surprised arm -->

    <line x1="20" y1="35"
          x2="55" y2="15"
          stroke="#0A0812"
          stroke-width="5"
          stroke-linecap="round"/>

  </g>

  <!-- Sight line -->
  <path d="
      M125 245
      Q200 210 280 225
      Q315 235 320 250"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      opacity="0.2"
      stroke-dasharray="6 8"/>

</svg>