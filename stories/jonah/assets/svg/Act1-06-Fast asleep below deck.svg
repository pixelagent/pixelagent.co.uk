<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7E8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff8a73" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Interior -->
  <rect width="600" height="400" fill="#0a1520"/>

  <!-- Lantern Light -->
  <circle cx="300" cy="150" r="250" fill="url(#lanternGlow)"/>

  <!-- Wooden Beams (Ship Ribs) -->
  <path d="M50 -50 Q100 200, 50 450 L-50 450 L-50 -50 Z" fill="#8a2e1c" stroke="#0A0812" stroke-width="6"/>
  <path d="M550 -50 Q500 200, 550 450 L650 450 L650 -50 Z" fill="#8a2e1c" stroke="#0A0812" stroke-width="6"/>
  
  <!-- Top Beam -->
  <rect x="0" y="-10" width="600" height="60" fill="#bc462e" stroke="#0A0812" stroke-width="6"/>

  <!-- Lantern -->
  <line x1="300" y1="50" x2="300" y2="100" stroke="#0A0812" stroke-width="4"/>
  <rect x="285" y="100" width="30" height="40" fill="#FFF7E8" stroke="#0A0812" stroke-width="4"/>
  <path d="M275 100 L325 100 L315 85 L285 85 Z" fill="#0A0812"/>
  <rect x="275" y="140" width="50" height="10" fill="#0A0812"/>

  <!-- Hammock & Sleeping Jonah (Silhouette bundle) -->
  <path d="M95 220 Q300 350, 505 220" fill="none" stroke="#e3d5ba" stroke-width="20" stroke-linecap="round"/>
  <path d="M95 220 Q300 350, 505 220" fill="none" stroke="#0A0812" stroke-width="6" stroke-linecap="round"/>
  
  <ellipse cx="300" cy="275" rx="90" ry="40" fill="#1c436d" stroke="#0A0812" stroke-width="5"/>
  <circle cx="230" cy="265" r="25" fill="#0A0812"/>

  <!-- Zzz -->
  <path d="M210 200 L240 200 L210 230 L240 230" fill="none" stroke="#FFF7E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 170 L190 170 L170 190 L190 190" fill="none" stroke="#FFF7E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
