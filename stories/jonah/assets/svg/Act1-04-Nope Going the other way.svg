<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="dustSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4e0"/>
      <stop offset="100%" stop-color="#e3d5ba"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#dustSky)"/>

  <!-- Desert Horizon -->
  <path d="M0 250 Q150 230, 300 260 T600 240 L600 400 L0 400 Z" fill="#bc462e" stroke="#0A0812" stroke-width="4"/>
  <path d="M0 280 Q200 260, 400 300 T600 270 L600 400 L0 400 Z" fill="#8a2e1c" stroke="#0A0812" stroke-width="4"/>

  <!-- Signpost -->
  <line x1="300" y1="120" x2="300" y2="350" stroke="#0A0812" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Pointing to Nineveh (Right) -->
  <path d="M290 140 L420 140 L450 165 L420 190 L290 190 Z" fill="#1c436d" stroke="#0A0812" stroke-width="4" stroke-linejoin="round"/>
  <!-- Scribble text -->
  <line x1="310" y1="165" x2="400" y2="165" stroke="#FFF7E8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pointing away (Left) -->
  <path d="M310 200 L180 200 L150 225 L180 250 L310 250 Z" fill="#e65c40" stroke="#0A0812" stroke-width="4" stroke-linejoin="round"/>
  <line x1="200" y1="225" x2="290" y2="225" stroke="#FFF7E8" stroke-width="4" stroke-linecap="round"/>

  <!-- Dust cloud from running away (Left side) -->
  <circle cx="80" cy="300" r="40" fill="#FFF7E8" opacity="0.6" stroke="#0A0812" stroke-width="3"/>
  <circle cx="140" cy="320" r="30" fill="#FFF7E8" opacity="0.6" stroke="#0A0812" stroke-width="3"/>
  <circle cx="40" cy="330" r="25" fill="#FFF7E8" opacity="0.6" stroke="#0A0812" stroke-width="3"/>
</svg>
