<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside the Great Fish - 3D Model</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050a14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffcc80;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255,150,0,0.5);
            z-index: 10;
        }
        #instructions {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #4a6fa5;
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 10;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1 style="margin: 0; font-size: 1.5rem;">Inside the Great Fish</h1>
        <p style="margin: 5px 0 0 0; opacity: 0.8;">Jonah's Prayer by Candlelight</p>
    </div>
    <div id="instructions">Drag to look around • Scroll to zoom • The flame flickers in the deep</div>

    <script>
        let scene, camera, renderer, environment, Jonah, candleFlame, candleLight, bellyMesh;
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0.5, targetRotationY = 0;
        let rotationX = 0.5, rotationY = 0;

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050a14);
            
            // Camera Setup - Looking down at Jonah
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, -4, 0);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lighting - Brightened for visibility
            const ambient = new THREE.AmbientLight(0x203050, 1.2);
            scene.add(ambient);

            // Faint Blue Bioluminescence
            const biolume = new THREE.PointLight(0x00ffff, 1.5, 30);
            biolume.position.set(5, 5, -5);
            scene.add(biolume);

            // Warm Candle Light
            candleLight = new THREE.PointLight(0xffaa44, 4, 15);
            candleLight.position.set(1.2, -3.8, 1);
            scene.add(candleLight);

            environment = new THREE.Group();

            // The Belly Walls (Flesh color)
            const bellyGeo = new THREE.CylinderGeometry(8, 8, 40, 32, 1, true);
            const bellyMat = new THREE.MeshPhongMaterial({ 
                color: 0x4a1a1a, 
                side: THREE.DoubleSide,
                flatShading: true,
                shininess: 10
            });
            bellyMesh = new THREE.Mesh(bellyGeo, bellyMat);
            bellyMesh.rotation.z = Math.PI / 2;
            environment.add(bellyMesh);

            // Ribs (Whale Bone color)
            const ribMat = new THREE.MeshPhongMaterial({ color: 0x553333, shininess: 5 });
            for (let i = -18; i <= 18; i += 4) {
                const ribGeo = new THREE.TorusGeometry(7.8, 0.2, 12, 100);
                const rib = new THREE.Mesh(ribGeo, ribMat);
                rib.rotation.y = Math.PI / 2;
                rib.position.x = i;
                environment.add(rib);
            }

            // Jonah - Simple Figure
            Jonah = new THREE.Group();
            const robeMat = new THREE.MeshPhongMaterial({ color: 0x8d7b6b });
            const bodyGeo = new THREE.CapsuleGeometry(0.4, 0.8, 4, 8);
            const body = new THREE.Mesh(bodyGeo, robeMat);
            body.position.y = 0.5;
            Jonah.add(body);

            const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const head = new THREE.Mesh(headGeo, robeMat);
            head.position.y = 1.3;
            Jonah.add(head);

            Jonah.position.set(0, -6, 0); 
            environment.add(Jonah);

            // The Candle
            const candleGroup = new THREE.Group();
            const waxGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.4, 8);
            const waxMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
            const wax = new THREE.Mesh(waxGeo, waxMat);
            wax.position.y = 0.2;
            candleGroup.add(wax);

            const flameGeo = new THREE.SphereGeometry(0.05, 8, 8);
            flameGeo.scale(1, 2, 1);
            const flameMat = new THREE.MeshBasicMaterial({ color: 0xffdd44 });
            candleFlame = new THREE.Mesh(flameGeo, flameMat);
            candleFlame.position.y = 0.45;
            candleGroup.add(candleFlame);

            candleGroup.position.set(1.2, -6.2, 1);
            environment.add(candleGroup);

            // Dark Water at the bottom
            const waterGeo = new THREE.PlaneGeometry(50, 20, 32, 32);
            const waterMat = new THREE.MeshPhongMaterial({ 
                color: 0x000a1a, 
                transparent: true, 
                opacity: 0.8,
                flatShading: true
            });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -6.5;
            environment.add(water);

            scene.add(environment);

            // Floating Particles (Marine Snow)
            const particlesGeo = new THREE.BufferGeometry();
            const particlesCount = 500;
            const posArray = new Float32Array(particlesCount * 3);
            for(let i=0; i<particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 30;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({ size: 0.05, color: 0x88ccff, transparent: true, opacity: 0.5 });
            const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particlesMesh);

            // Listeners
            window.addEventListener('resize', onResize);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('wheel', onWheel);

            animate();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseDown(e) { isMouseDown = true; }
        function onMouseUp(e) { isMouseDown = false; }

        function onMouseMove(e) {
            if (isMouseDown) {
                targetRotationY += e.movementX * 0.005;
                targetRotationX += e.movementY * 0.005;
            }
        }

        function onWheel(e) {
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(3, Math.min(camera.position.z, 20));
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            rotationX += (targetRotationX - rotationX) * 0.05;
            rotationY += (targetRotationY - rotationY) * 0.05;

            environment.rotation.x = rotationX;
            environment.rotation.y = rotationY;

            // Flicker logic
            const flicker = Math.sin(time * 20) * 0.1 + Math.random() * 0.1;
            candleLight.intensity = 4 + flicker;
            candleFlame.scale.set(1 + flicker, 1 + flicker * 1.5, 1 + flicker);

            // Environment pulse
            if (bellyMesh) {
                bellyMesh.scale.set(
                    1 + Math.sin(time * 0.5) * 0.02,
                    1 + Math.sin(time * 0.5) * 0.02,
                    1 + Math.sin(time * 0.5) * 0.02
                );
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
