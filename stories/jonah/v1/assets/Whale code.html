<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Whale Model</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #001a33;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            pointer-events: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>The Great Fish</h1>
        <p>3D Interactive Model</p>
    </div>
    <div id="instructions">Drag to rotate • Scroll to zoom</div>

    <script>
        let scene, camera, renderer, whale;
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0.2, targetRotationY = -0.5;
        let rotationX = 0, rotationY = 0;

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x001220);
            scene.fog = new THREE.FogExp2(0x001220, 0.05);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 10;

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0x0077ff, 2, 50);
            pointLight.position.set(-5, -5, -5);
            scene.add(pointLight);

            // Create Whale Group
            whale = new THREE.Group();

            // Body
            const bodyGeo = new THREE.SphereGeometry(1, 32, 32);
            bodyGeo.scale(3.5, 1.5, 1.8);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x2c3e50, shininess: 30 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            whale.add(body);

            // Tail Base
            const tailBaseGeo = new THREE.SphereGeometry(0.8, 32, 32);
            tailBaseGeo.scale(2, 0.6, 0.8);
            const tailBase = new THREE.Mesh(tailBaseGeo, bodyMat);
            tailBase.position.x = -3.5;
            whale.add(tailBase);

            // Tail Fluke
            const flukeGeo = new THREE.BoxGeometry(1.5, 0.1, 3);
            const fluke = new THREE.Mesh(flukeGeo, bodyMat);
            fluke.position.x = -5.2;
            fluke.rotation.z = 0.2;
            whale.add(fluke);

            // Fins
            const finGeo = new THREE.BoxGeometry(1, 0.1, 1.5);
            const leftFin = new THREE.Mesh(finGeo, bodyMat);
            leftFin.position.set(0, -0.5, 1.8);
            leftFin.rotation.set(0.4, 0, -0.4);
            whale.add(leftFin);

            const rightFin = new THREE.Mesh(finGeo, bodyMat);
            rightFin.position.set(0, -0.5, -1.8);
            rightFin.rotation.set(-0.4, 0, -0.4);
            whale.add(rightFin);

            scene.add(whale);

            // Floating particles for ocean effect
            const particlesGeo = new THREE.BufferGeometry();
            const particlesCount = 1000;
            const posArray = new Float32Array(particlesCount * 3);
            for(let i=0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 40;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({ size: 0.05, color: 0x88ccff, transparent: true, opacity: 0.6 });
            const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particlesMesh);

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousedown', onDocumentMouseDown, false);
            document.addEventListener('touchstart', onDocumentTouchStart, { passive: false });
            document.addEventListener('mousemove', onDocumentMouseMove, false);
            document.addEventListener('touchmove', onDocumentTouchMove, { passive: false });
            document.addEventListener('mouseup', onDocumentMouseUp, false);
            document.addEventListener('touchend', onDocumentMouseUp, false);
            document.addEventListener('wheel', onDocumentWheel, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentMouseDown(event) {
            isMouseDown = true;
            mouseX = event.clientX;
            mouseY = event.clientY;
        }

        function onDocumentTouchStart(event) {
            if (event.touches.length === 1) {
                isMouseDown = true;
                mouseX = event.touches[0].pageX;
                mouseY = event.touches[0].pageY;
            }
        }

        function onDocumentMouseMove(event) {
            if (isMouseDown) {
                const deltaX = event.clientX - mouseX;
                const deltaY = event.clientY - mouseY;
                targetRotationY += deltaX * 0.01;
                targetRotationX += deltaY * 0.01;
                mouseX = event.clientX;
                mouseY = event.clientY;
            }
        }

        function onDocumentTouchMove(event) {
            if (isMouseDown && event.touches.length === 1) {
                const deltaX = event.touches[0].pageX - mouseX;
                const deltaY = event.touches[0].pageY - mouseY;
                targetRotationY += deltaX * 0.01;
                targetRotationX += deltaY * 0.01;
                mouseX = event.touches[0].pageX;
                mouseY = event.touches[0].pageY;
                event.preventDefault();
            }
        }

        function onDocumentMouseUp() {
            isMouseDown = false;
        }

        function onDocumentWheel(event) {
            camera.position.z += event.deltaY * 0.01;
            camera.position.z = Math.max(5, Math.min(camera.position.z, 25));
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth rotation
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;
            
            whale.rotation.x = rotationX;
            whale.rotation.y = rotationY;

            // Idle swimming movement
            const time = Date.now() * 0.001;
            whale.position.y = Math.sin(time) * 0.2;
            
            // Tail wiggle
            const tail = whale.children[1];
            const fluke = whale.children[2];
            tail.rotation.y = Math.sin(time * 2) * 0.1;
            fluke.position.y = Math.sin(time * 2) * 0.2;

            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>
