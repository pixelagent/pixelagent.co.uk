

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonah's Ship - 3D Model</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #instructions {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 0.9rem;
            opacity: 0.8;
            pointer-events: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1 style="margin: 0; font-size: 1.5rem;">Ship to Tarshish</h1>
        <p style="margin: 5px 0 0 0; opacity: 0.9;">Interactive 3D Simulation</p>
    </div>
    <div id="instructions">Drag to rotate • Scroll to zoom • Watch the storm brew</div>

    <script>
        let scene, camera, renderer, ship, ocean;
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0.3, targetRotationY = 0.5;
        let rotationX = 0.3, rotationY = 0.5;

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffd485, 1.2);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Ship Group
            ship = new THREE.Group();

            // Materials
            const woodMat = new THREE.MeshPhongMaterial({ color: 0x5d4037, shininess: 10 });
            const sailMat = new THREE.MeshPhongMaterial({ color: 0xf5f5dc, side: THREE.DoubleSide });

            // Hull
            const hullGeo = new THREE.BoxGeometry(2, 1.5, 6);
            const hull = new THREE.Mesh(hullGeo, woodMat);
            hull.position.y = 0.5;
            // Taper the hull
            hull.geometry.verticesNeedUpdate = true;
            ship.add(hull);

            // Bow (front)
            const bowGeo = new THREE.ConeGeometry(1.2, 2, 3);
            const bow = new THREE.Mesh(bowGeo, woodMat);
            bow.rotation.x = Math.PI / 2;
            bow.rotation.z = Math.PI;
            bow.position.set(0, 0.5, 3.8);
            bow.scale.set(1, 0.8, 1);
            ship.add(bow);

            // Stern (back)
            const sternGeo = new THREE.BoxGeometry(2, 1.8, 1.5);
            const stern = new THREE.Mesh(sternGeo, woodMat);
            stern.position.set(0, 0.65, -3);
            ship.add(stern);

            // Mast
            const mastGeo = new THREE.CylinderGeometry(0.1, 0.15, 7, 8);
            const mast = new THREE.Mesh(mastGeo, woodMat);
            mast.position.y = 4;
            ship.add(mast);

            // Crossbar
            const barGeo = new THREE.CylinderGeometry(0.08, 0.08, 4, 8);
            const bar = new THREE.Mesh(barGeo, woodMat);
            bar.rotation.z = Math.PI / 2;
            bar.position.y = 6;
            ship.add(bar);

            // Main Sail
            const sailGeo = new THREE.PlaneGeometry(3.8, 4.5);
            const sail = new THREE.Mesh(sailGeo, sailMat);
            sail.position.set(0, 4, 0.1);
            // Give sail a slight curve
            ship.add(sail);

            scene.add(ship);

            // Ocean
            const oceanGeo = new THREE.PlaneGeometry(100, 100, 40, 40);
            const oceanMat = new THREE.MeshPhongMaterial({ 
                color: 0x004d7a, 
                transparent: true, 
                opacity: 0.8, 
                wireframe: false,
                flatShading: true
            });
            ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -0.5;
            scene.add(ocean);

            // Event Listeners
            window.addEventListener('resize', onResize);
            document.addEventListener('mousedown', () => isMouseDown = true);
            document.addEventListener('mouseup', () => isMouseDown = false);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('wheel', onWheel);
            document.addEventListener('touchstart', (e) => { isMouseDown = true; mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; });
            document.addEventListener('touchend', () => isMouseDown = false);
            document.addEventListener('touchmove', onTouchMove);

            animate();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(e) {
            if (isMouseDown) {
                targetRotationY += e.movementX * 0.005;
                targetRotationX += e.movementY * 0.005;
            }
        }

        function onTouchMove(e) {
            if (isMouseDown) {
                const deltaX = e.touches[0].clientX - mouseX;
                const deltaY = e.touches[0].clientY - mouseY;
                targetRotationY += deltaX * 0.005;
                targetRotationX += deltaY * 0.005;
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
            }
        }

        function onWheel(e) {
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(5, Math.min(camera.position.z, 30));
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Smooth interaction rotation
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;
            ship.rotation.x = rotationX + Math.sin(time) * 0.05; // Gentle rocking
            ship.rotation.y = rotationY;
            ship.rotation.z = Math.cos(time * 0.5) * 0.03;

            // Ship bobbing
            ship.position.y = Math.sin(time) * 0.2;

            // Animate Ocean Waves
            const vertices = ocean.geometry.attributes.position.array;
            for (let i = 0; i < vertices.length; i += 3) {
                const x = vertices[i];
                const y = vertices[i + 1];
                vertices[i + 2] = Math.sin(x * 0.5 + time) * 0.5 + Math.cos(y * 0.5 + time) * 0.5;
            }
            ocean.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
