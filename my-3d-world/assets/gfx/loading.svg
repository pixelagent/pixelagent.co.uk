<svg width="140" height="140" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gold gradient -->
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5a12"/>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">

    <!-- Outer rotating ring -->
    <circle cx="50" cy="50" r="38"
            fill="none"
            stroke="url(#gold)"
            stroke-width="2"
            stroke-dasharray="5 4">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="8s"
        repeatCount="indefinite"/>
    </circle>

    <!-- Star of David -->
    <g>
      <!-- Upward triangle -->
      <polygon points="50,18 68,58 32,58"
               fill="none"
               stroke="url(#gold)"
               stroke-width="2"
               stroke-linejoin="round">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 50 50"
          to="360 50 50"
          dur="12s"
          repeatCount="indefinite"/>
      </polygon>

      <!-- Downward triangle -->
      <polygon points="32,42 68,42 50,82"
               fill="none"
               stroke="url(#gold)"
               stroke-width="2"
               stroke-linejoin="round">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="360 50 50"
          to="0 50 50"
          dur="12s"
          repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Center pulse -->
    <circle cx="50" cy="50" r="4" fill="url(#gold)">
      <animate
        attributeName="r"
        values="3;6;3"
        dur="2.5s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.5;1;0.5"
        dur="2.5s"
        repeatCount="indefinite"/>
    </circle>

  </g>

</svg>