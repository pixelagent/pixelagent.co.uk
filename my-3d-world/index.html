<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Globe Starter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luxurious+Roman&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/images/pixelicon.png-96x96.png" type="image/png">
</head>
<body>

  <!-- HUD Buttons -->
  <div  id="hud-top" style="display:none;"> 
  <button id="checklist-btn" class="hud-btn" title="Checklist">
    <img src="assets/gfx/list.svg" alt="Checklist">
  </button>
  </div>  

  <div id="hud-bottom" style="display:none;">
    <button id="audio-btn" class="hud-btn" title="Toggle Music">
      <img src="assets/gfx/music_off.svg" alt="Audio">
    </button>
    <button id="inventory-btn" class="hud-btn" title="Inventory">
    <img src="assets/gfx/inventory.svg" alt="Inventory">
    </button>
  </div>

  <!-- Panels -->
  <div id="checklist-panel" class="panel" style="display:none;">
    <h2>Checklist</h2>
    <ul id="tasks-list"></ul>
  </div>

  <div id="inventory-panel" class="panel" style="display:none;">
    <h2>Inventory</h2>
    <ul id="inventory-list"></ul>
  </div>

   <!-- Audio element -->
   <audio id="bg-music" src="assets/audio/c-style-963hz-energie-arcturienne-463699.mp3" loop preload="auto"></audio>

   <script type="module" src="./main.js"></script>
</body>
</html>
