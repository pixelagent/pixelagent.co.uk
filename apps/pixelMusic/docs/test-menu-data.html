<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Data Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>Menu Data Test</h1>
    
    <div id="test-results"></div>

    <script>
        // Test if menu data is available
        function testMenuData() {
            const results = document.getElementById('test-results');
            
            // Test 1: Check if menuLoader exists
            const menuLoaderExists = !!window.menuLoader;
            const menuLoaderResult = document.createElement('div');
            menuLoaderResult.className = menuLoaderExists ? 'test-result success' : 'test-result error';
            menuLoaderResult.innerHTML = `<strong>MenuLoader Exists:</strong> ${menuLoaderExists ? '✓' : '✗'}`;
            results.appendChild(menuLoaderResult);
            
            // Test 2: Check if menuData exists
            const menuDataExists = !!window.menuLoader?.menuData;
            const menuDataResult = document.createElement('div');
            menuDataResult.className = menuDataExists ? 'test-result success' : 'test-result error';
            menuDataResult.innerHTML = `<strong>MenuData Exists:</strong> ${menuDataExists ? '✓' : '✗'}`;
            results.appendChild(menuDataResult);
            
            // Test 3: Check menu structure
            if (menuDataExists) {
                const menuData = window.menuLoader.menuData;
                const menusCount = menuData.menus?.length || 0;
                const menusResult = document.createElement('div');
                menusResult.className = 'test-result info';
                menusResult.innerHTML = `<strong>Menus Count:</strong> ${menusCount}`;
                results.appendChild(menusResult);
                
                // Test 4: Check instruments menu
                const instrumentsMenu = menuData.menus?.find(m => m.id === 'instruments');
                const instrumentsResult = document.createElement('div');
                instrumentsResult.className = instrumentsMenu ? 'test-result success' : 'test-result error';
                instrumentsResult.innerHTML = `<strong>Instruments Menu:</strong> ${instrumentsMenu ? '✓ Found' : '✗ Not Found'}`;
                results.appendChild(instrumentsResult);
                
                if (instrumentsMenu) {
                    const groupsCount = instrumentsMenu.groups?.length || 0;
                    const groupsResult = document.createElement('div');
                    groupsResult.className = 'test-result info';
                    groupsResult.innerHTML = `<strong>Instrument Groups:</strong> ${groupsCount}`;
                    results.appendChild(groupsResult);
                    
                    // Test 5: Check drum group
                    const drumGroup = instrumentsMenu.groups?.find(g => g.id === 'drums');
                    const drumResult = document.createElement('div');
                    drumResult.className = drumGroup ? 'test-result success' : 'test-result error';
                    drumResult.innerHTML = `<strong>Drum Group:</strong> ${drumGroup ? '✓ Found' : '✗ Not Found'}`;
                    results.appendChild(drumResult);
                    
                    if (drumGroup) {
                        const drumItems = drumGroup.items?.length || 0;
                        const drumItemsResult = document.createElement('div');
                        drumItemsResult.className = 'test-result info';
                        drumItemsResult.innerHTML = `<strong>Drum Items:</strong> ${drumItems}`;
                        results.appendChild(drumItemsResult);
                    }
                }
            }
            
            // Test 6: Try to load instruments with the same logic as NodeFactory
            if (menuDataExists) {
                const menuData = window.menuLoader.menuData;
                const instrumentsMenu = menuData.menus.find(m => m.id === 'instruments');
                
                if (instrumentsMenu) {
                    let instruments = [];
                    instrumentsMenu.groups.forEach(group => {
                        group.items.forEach(item => {
                            if (typeof item === 'string') {
                                instruments.push(item);
                            } else if (typeof item === 'object' && item.id) {
                                instruments.push(item.id);
                            }
                        });
                    });
                    
                    const instrumentsResult = document.createElement('div');
                    instrumentsResult.className = 'test-result success';
                    instrumentsResult.innerHTML = `<strong>Extracted Instruments:</strong> ${instruments.join(', ')}`;
                    results.appendChild(instrumentsResult);
                }
            }
        }

        // Run test when page loads
        window.onload = testMenuData;
    </script>
</body>
</html>
