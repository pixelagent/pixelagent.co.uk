<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optgroup Instrument Selection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .test-section h3 { margin-top: 0; }
        select { width: 100%; padding: 10px; margin: 10px 0; font-size: 14px; }
        optgroup { font-weight: bold; color: #666; }
        option { font-weight: normal; padding-left: 10px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>Optgroup Instrument Selection Test</h1>
    
    <div class="test-section">
        <h3>Test Node: Drum Symbol (sd)</h3>
        <p>Category: source (should show instruments with optgroups from JSON structure)</p>
        <select id="drum-instrument"></select>
        <div id="drum-result"></div>
    </div>

    <div class="test-section">
        <h3>Test Node: Pattern Function (note)</h3>
        <p>Category: structural (should show pattern functions with optgroups)</p>
        <select id="pattern-instrument"></select>
        <div id="pattern-result"></div>
    </div>

    <script>
        // Mock the menu loader with the actual JSON structure from strudel-node-instruments.json
        window.menuLoader = {
            menuData: {
                menus: [
                    {
                        id: 'instruments',
                        label: 'Instruments',
                        groups: [
                            {
                                id: 'drums',
                                label: 'Drum Kit',
                                nodeType: 'DrumSymbol',
                                color: '#00d9ff',
                                items: [
                                    { id: 'bd', label: 'Bass Drum', value: 'bd' },
                                    { id: 'sd', label: 'Snare Drum', value: 'sd' },
                                    { id: 'hh', label: 'Hi-Hat', value: 'hh' },
                                    { id: 'oh', label: 'Open Hat', value: 'oh' },
                                    { id: 'rim', label: 'Rimshot', value: 'rim' }
                                ]
                            },
                            {
                                id: 'percussion',
                                label: 'Percussion',
                                nodeType: 'Instrument',
                                color: '#00d9ff',
                                items: [
                                    'clap', 'conga', 'bongo', 'cowbell', 'shaker_large', 'shaker_small'
                                ]
                            }
                        ]
                    },
                    {
                        id: 'patternFunctions',
                        label: 'Pattern Functions',
                        groups: [
                            {
                                id: 'soundFunctions',
                                label: 'Sound Functions',
                                nodeType: 's',
                                color: '#8b5cf6',
                                items: [
                                    { id: 'bd', label: 'Bass Drum', value: 'bd' },
                                    { id: 'sd', label: 'Snare Drum', value: 'sd' },
                                    { id: 'hh', label: 'Hi-Hat', value: 'hh' },
                                    { id: 'oh', label: 'Open Hat', value: 'oh' },
                                    { id: 'rim', label: 'Rimshot', value: 'rim' },
                                    { id: 'custom', label: 'Custom Sound', value: 'custom' }
                                ]
                            },
                            {
                                id: 'noteFunctions',
                                label: 'Note Functions',
                                nodeType: 'note',
                                color: '#00ff41',
                                items: [
                                    { id: 'c4', label: 'C4', value: 'c4' },
                                    { id: 'd4', label: 'D4', value: 'd4' },
                                    { id: 'e4', label: 'E4', value: 'e4' },
                                    { id: 'f4', label: 'F4', value: 'f4' },
                                    { id: 'g4', label: 'G4', value: 'g4' },
                                    { id: 'a4', label: 'A4', value: 'a4' },
                                    { id: 'b4', label: 'B4', value: 'b4' },
                                    { id: 'custom_note', label: 'Custom Note', value: 'custom' }
                                ]
                            },
                            {
                                id: 'bankFunctions',
                                label: 'Bank Selection',
                                nodeType: 'bank',
                                color: '#ff006e',
                                items: [
                                    { id: 'tr909', label: 'Roland TR-909', value: 'tr909' },
                                    { id: 'tr808', label: 'Roland TR-808', value: 'tr808' },
                                    { id: 'tr707', label: 'Roland TR-707', value: 'tr707' },
                                    { id: 'linn', label: 'Akai Linn', value: 'linn' }
                                ]
                            }
                        ]
                    }
                ]
            }
        };

        // Mock NodeFactory methods
        class TestNodeFactory {
            constructor() {
                this.nodeSchema = {
                    nodes: {
                        'DrumSymbol': { category: 'source' },
                        'LPF': { category: 'effect' },
                        'Stack': { category: 'structural' }
                    }
                };
            }

            getNodeCategory(node) {
                return this.nodeSchema.nodes[node.type]?.category || 'unknown';
            }

            addInstrumentsWithGroups(selectElement, menuType, currentInstrument) {
                // Try to get instruments from the menu loader's data
                if (window.menuLoader && window.menuLoader.menuData) {
                    const menuData = window.menuLoader.menuData;
                    
                    // Find the menu that corresponds to this panel type
                    const menu = menuData.menus.find(m => m.id === menuType);
                    if (menu) {
                        let foundCurrent = false;
                        
                        // Create optgroups for each group in the menu
                        menu.groups.forEach(group => {
                            const optgroup = document.createElement('optgroup');
                            optgroup.label = group.label;
                            optgroup.dataset.groupId = group.id;
                            optgroup.dataset.nodeType = group.nodeType;
                            
                            // Add items to this optgroup
                            group.items.forEach(item => {
                                const option = document.createElement('option');
                                
                                if (typeof item === 'string') {
                                    option.value = item;
                                    option.textContent = this.formatInstrumentLabel(item);
                                } else if (typeof item === 'object' && item.id) {
                                    option.value = item.id;
                                    option.textContent = item.label || this.formatInstrumentLabel(item.id);
                                }
                                
                                // Check if this is the current instrument
                                if (currentInstrument && option.value.toLowerCase() === currentInstrument.toLowerCase()) {
                                    option.selected = true;
                                    foundCurrent = true;
                                }
                                
                                optgroup.appendChild(option);
                            });
                            
                            // Only add optgroup if it has options
                            if (optgroup.children.length > 0) {
                                selectElement.appendChild(optgroup);
                            }
                        });
                        
                        // If current instrument not found in groups, add as custom option
                        if (currentInstrument && !foundCurrent) {
                            const customOption = document.createElement('option');
                            customOption.value = currentInstrument;
                            customOption.textContent = currentInstrument;
                            customOption.selected = true;
                            selectElement.appendChild(customOption);
                        }
                        
                        return;
                    }
                }
                
                // Fallback: use defaults without groups
                const defaultOptions = ['sine', 'square', 'sawtooth', 'triangle', 'piano', 'violin'];
                defaultOptions.forEach(optionText => {
                    const option = document.createElement('option');
                    option.value = optionText;
                    option.textContent = optionText;
                    if (currentInstrument && option.value.toLowerCase() === currentInstrument.toLowerCase()) {
                        option.selected = true;
                    }
                    selectElement.appendChild(option);
                });
                
                // If current instrument not found, add as custom option
                if (currentInstrument && !selectElement.querySelector(`option[value="${currentInstrument}"]`)) {
                    const customOption = document.createElement('option');
                    customOption.value = currentInstrument;
                    customOption.textContent = currentInstrument;
                    customOption.selected = true;
                    selectElement.appendChild(customOption);
                }
            }
            
            formatInstrumentLabel(instrumentId) {
                // Convert instrument IDs to readable labels (same as menuLoader.js)
                return instrumentId
                    .split('_')
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(' ');
            }

            updateInstrumentSelector(node, selectId) {
                const instrumentSelect = document.getElementById(selectId);
                if (!instrumentSelect) return;
                
                // Clear existing options
                instrumentSelect.innerHTML = '';
                
                // Get the node category
                const category = this.getNodeCategory(node);
                
                // Add category-specific options based on the JSON structure with optgroups
                if (category === 'source') {
                    // Instrument nodes - get from the instruments menu
                    this.addInstrumentsWithGroups(instrumentSelect, 'instruments', node.instrument);
                } else if (category === 'effect') {
                    // Effect nodes - get from the effects menu
                    this.addInstrumentsWithGroups(instrumentSelect, 'effects', node.instrument);
                } else if (category === 'structural') {
                    // Pattern nodes - get from the pattern functions menu
                    this.addInstrumentsWithGroups(instrumentSelect, 'patternFunctions', node.instrument);
                } else if (category === 'wrapper') {
                    // Wrapper nodes - get from the pattern functions menu
                    this.addInstrumentsWithGroups(instrumentSelect, 'patternFunctions', node.instrument);
                } else if (category === 'control') {
                    // Control nodes - get from the control nodes
                    this.addInstrumentsWithGroups(instrumentSelect, 'control', node.instrument);
                } else if (category === 'utility') {
                    // Utility nodes - get from the pattern functions menu
                    this.addInstrumentsWithGroups(instrumentSelect, 'patternFunctions', node.instrument);
                } else {
                    // Default options for other categories
                    const defaultOptions = ['sine', 'square', 'sawtooth', 'triangle', 'piano', 'violin'];
                    defaultOptions.forEach(optionText => {
                        const option = document.createElement('option');
                        option.value = optionText;
                        option.textContent = optionText;
                        instrumentSelect.appendChild(option);
                    });
                    
                    // Set the current instrument
                    if (node.instrument) {
                        const options = Array.from(instrumentSelect.options);
                        const currentOption = options.find(option =>
                            option.value.toLowerCase() === node.instrument.toLowerCase()
                        );
                        if (currentOption) {
                            instrumentSelect.value = currentOption.value;
                        } else {
                            // If instrument not found, add it as a custom option
                            const customOption = document.createElement('option');
                            customOption.value = node.instrument;
                            customOption.textContent = node.instrument;
                            instrumentSelect.appendChild(customOption);
                            instrumentSelect.value = node.instrument;
                        }
                    }
                }
            }
        }

        // Test the implementation
        window.onload = () => {
            const factory = new TestNodeFactory();

            // Test Drum Symbol node (sd)
            const drumNode = {
                type: 'DrumSymbol',
                instrument: 'sd'
            };
            factory.updateInstrumentSelector(drumNode, 'drum-instrument');
            
            const drumResult = document.getElementById('drum-result');
            drumResult.innerHTML = `
                <div class="test-result success">
                    <strong>✓ Drum Symbol Test</strong><br>
                    Category: ${factory.getNodeCategory(drumNode)}<br>
                    Selected: ${drumNode.instrument}<br>
                    Instruments loaded from 'instruments' menu with optgroups:<br>
                    - Drum Kit (bd, sd, hh, oh, rim)<br>
                    - Percussion (clap, conga, bongo, cowbell, shaker_large, shaker_small)
                </div>
            `;

            // Test Pattern Function node
            const patternNode = {
                type: 'Stack',
                instrument: 'c4'
            };
            factory.updateInstrumentSelector(patternNode, 'pattern-instrument');
            
            const patternResult = document.getElementById('pattern-result');
            patternResult.innerHTML = `
                <div class="test-result success">
                    <strong>✓ Pattern Function Test</strong><br>
                    Category: ${factory.getNodeCategory(patternNode)}<br>
                    Selected: ${patternNode.instrument}<br>
                    Instruments loaded from 'patternFunctions' menu with optgroups:<br>
                    - Sound Functions (bd, sd, hh, oh, rim, custom)<br>
                    - Note Functions (c4, d4, e4, f4, g4, a4, b4, custom_note)<br>
                    - Bank Selection (tr909, tr808, tr707, linn)
                </div>
            `;
        };
    </script>
</body>
</html>
