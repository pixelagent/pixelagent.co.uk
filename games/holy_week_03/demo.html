<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A 3D interactive experience with modular architecture and dynamic lighting.">
    <title>Miracle Maker</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Source+Code+Pro:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <!-- Howler.js for audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/dialogue.css">
    <link rel="stylesheet" href="css/panels.css">
    <link rel="stylesheet" href="css/actions.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        :root {
            --bg-main: #010105;
            --panel-bg: rgba(0, 10, 20, 0.88);
            --accent-primary: #00f2ff;
            --accent-secondary: #ffaa00;
            --accent-success: #00ffaa;
            --text-main: #ffffff;
            --glow-soft: 0 0 10px rgba(0, 242, 255, 0.3);
            --glow-strong: 0 0 20px rgba(0, 242, 255, 0.6);
            --shadow-panel: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg-main);
            font-family: 'Courier New', monospace;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .ui-toggle {
            width: 48px;
            height: 48px;
            padding: 0;
            background: rgba(0, 10, 20, 0.8);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            cursor: pointer;
            font-size: 1.2em;
            border-radius: 4px;
            transition: transform 0.12s ease, background 0.2s, box-shadow 0.2s;
            box-shadow: var(--glow-soft);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #btn-quest-toggle, #btn-inv-toggle, #btn-actions-toggle, #btn-sound-toggle, #btn-cycle-toggle {
            width: 48px;
            height: 48px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ui-toggle:hover {
            background: rgba(0, 242, 255, 0.2);
            box-shadow: var(--glow-strong);
        }

        .ui-toggle:active {
            transform: scale(0.9);
        }

        .ui-toggle.active {
            background: rgba(0, 242, 255, 0.3);
            border-color: var(--accent-success);
            color: var(--accent-success);
        }

        #right-sidebar {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
            z-index: 500;
        }

        #sidebar-top, #sidebar-bottom {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: auto;
            margin-bottom: 40px;
        }

        .sidebar-row {
            display: flex;
            gap: 8px;
        }

        h3 {
            margin: 0 0 10px 0;
            font-size: 0.8em;
            color: var(--accent-secondary);
            opacity: 0.6;
            border-bottom: 1px solid #333;
        }

        .item {
            font-size: 0.8em;
            margin: 5px 0;
            color: var(--accent-secondary);
            border-left: 2px solid var(--accent-secondary);
            padding-left: 5px;
        }

        .q-item {
            font-size: 0.8em;
            margin: 12px 0;
            border-bottom: 1px solid #111;
            padding-bottom: 5px;
        }

        .q-done {
            color: var(--accent-success);
            text-decoration: line-through;
            opacity: 0.4;
        }

        #loc-box {
            position: absolute;
            bottom: 20%;
            left: 5%;
            text-align: center;
            pointer-events: none;
            display: none;
            z-index: 150;
        }

        #loc-name {
            font-size: 2.8em;
            color: var(--accent-secondary);
            margin: 0;
            text-shadow: 0 0 20px #000;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
            text-align: center;
            background: rgba(0, 0, 0, 0.95);
        }

        #start-screen h1 {
            color: var(--accent-secondary);
            font-size: 4em;
            margin: 0;
            letter-spacing: 10px;
        }

        #start-screen p {
            color: var(--accent-secondary);
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.6;
            letter-spacing: 3px;
        }

        button#btn-start, button#btn-replay {
            background: #ffaa00;
            border: none;
            padding: 15px 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2em;
            color: black;
        }

        #win-screen h1 {
            color: var(--accent-success);
            font-size: 4em;
            margin: 0;
            letter-spacing: 10px;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            color: white;
            z-index: 1000;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid var(--accent-secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .npc-bubble {
            position: absolute;
            background: rgba(0, 5, 10, 0.95);
            color: #00f2ff;
            padding: 12px 18px;
            border: 1px solid #00f2ff;
            border-radius: 2px;
            font-size: 0.85em;
            text-align: center;
            transform: translate(-50%, -100%);
            display: none;
            width: 220px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
            z-index: 150;
        }

        .interact-prompt {
            position: absolute;
            transform: translate(-50%, -50%);
            background: rgba(0, 10, 20, 0.9);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 10px 20px;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            box-shadow: var(--glow-soft);
            white-space: nowrap;
            display: none;
            pointer-events: auto;
            cursor: pointer;
            z-index: 1000;
        }

        #wipe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.7s ease;
            z-index: 1200;
        }

        #wipe-overlay.active {
            opacity: 1;
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="overlay">
        <div class="spinner"></div>
        <p>INITIALIZING...</p>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay" style="display:none;">
        <h1>Miracle Maker</h1>
        <p>WHO WAS HE?</p>
        <button id="btn-start">START</button>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="overlay hidden" style="display:none;">
        <h1>MISSION COMPLETE</h1>
        <p>All objectives fulfilled.</p>
        <button id="btn-replay">REINITIALIZE</button>
    </div>

    <!-- Sidebar -->
    <div id="right-sidebar">
        <div id="sidebar-top">
            <div class="sidebar-row">
                <button id="btn-quest-toggle" class="ui-toggle"><i class="fas fa-list-check"></i></button>
            </div>
            <div class="sidebar-row">
                <button id="btn-inv-toggle" class="ui-toggle"><i class="fas fa-boxes-stacked"></i></button>
            </div>
        </div>
        <div id="sidebar-bottom">
            <div class="sidebar-row">
                <button id="btn-sound-toggle" class="ui-toggle"><i class="fas fa-volume-up"></i></button>
            </div>
            <div class="sidebar-row">
                <button id="btn-cycle-toggle" class="ui-toggle"><i class="fas fa-sun"></i></button>
            </div>
        </div>
    </div>

    <!-- Quest Panel -->
    <div id="panel-quest" class="panel">
        <h3>QUEST LOG</h3>
        <div id="quest-list"></div>
    </div>

    <!-- Inventory Panel -->
    <div id="panel-inv" class="panel">
        <h3>EVIDENCE</h3>
        <div id="inv-list">NO EVIDENCE COLLECTED</div>
    </div>

    <!-- Status Location -->
    <div id="loc-box">
        <h2 id="loc-name">LOC_NAME</h2>
    </div>

    <!-- NPC Bubble -->
    <div id="npc-bubble" class="npc-bubble"></div>

    <!-- Interact Prompt -->
    <div id="world-prompt" class="interact-prompt">CONNECT_TO_ECHO</div>

    <!-- Dialogue Box -->
    <div id="local-dialogue-box">
        <div class="chat-hdr">
            <div>
                <div class="chr" id="npc-name-display">UNIT-01</div>
                <div class="st">● ONLINE</div>
            </div>
        </div>
        <div id="bub-scroll"></div>
        <div id="bar-choices" class="hide"></div>
    </div>

    <!-- Wipe overlay -->
    <div id="wipe-overlay"></div>

    <!-- Ink runtime -->
    <script src="https://unpkg.com/inkjs@2.2.1/dist/ink.js"></script>

    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010105);
        scene.fog = new THREE.FogExp2(0x050a1a, 0.005);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 250, 280);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadow;
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambient = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambient);
        const sun = new THREE.PointLight(0xffffff, 1.5);
        sun.position.set(100, 100, 100);
        scene.add(sun);

        // Planet
        const planetR = 100;
        const planetGeom = new THREE.IcosahedronGeometry(planetR, 5);
        const planetMat = new THREE.MeshToonMaterial({ color: 0x00ff88 });
        const planet = new THREE.Mesh(planetGeom, planetMat);
        scene.add(planet);

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < 1500; i++) {
            const v = new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 2000 + 100);
            starPos.push(v.x, v.y, v.z);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
            color: 0x88ccff,
            size: 1.5,
            transparent: true,
            opacity: 0.8
        }));
        scene.add(stars);

        // Player
        let pBody, playerMesh;
        let canJump = true;
        const keys = {};
        const camHeading = new THREE.Vector3(0, 0, 1);

        function setupPlayer() {
            pBody = { velocity: new THREE.Vector3() };
            playerMesh = new THREE.Group();
            const geom = new THREE.CapsuleGeometry(0.5, 1.6, 4, 8);
            const mat = new THREE.MeshToonMaterial({ color: 0xff0000 });
            const mesh = new THREE.Mesh(geom, mat);
            playerMesh.add(mesh);
            scene.add(playerMesh);
            playerMesh.position.set(0, planetR + 1.0, 0);
        }

        // Items (4 cells + 4 shards)
        const items = [];
        const COLORS = { orange: 0xffaa00, shard: 0xa020f0 };

        function setupItems() {
            for (let i = 0; i < 4; i++) {
                const g = new THREE.SphereGeometry(1);
                const m = new THREE.MeshToonMaterial({ color: COLORS.orange });
                const mesh = new THREE.Mesh(g, m);
                mesh.name = 'CELL_' + (i + 1);
                mesh.position.setFromSphericalCoords(planetR + 1.2, Math.random() * Math.PI, Math.random() * Math.PI * 2);
                scene.add(mesh);
                items.push(mesh);
            }
            for (let i = 0; i < 4; i++) {
                const g = new THREE.OctahedronGeometry(0.9);
                const m = new THREE.MeshToonMaterial({ color: COLORS.shard });
                const mesh = new THREE.Mesh(g, m);
                mesh.name = 'SHARD_' + (i + 1);
                mesh.position.setFromSphericalCoords(planetR + 1.2, Math.random() * Math.PI, Math.random() * Math.PI * 2);
                scene.add(mesh);
                items.push(mesh);
            }
        }

        // Input
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Game state
        let started = false;
        let inventory = [];
        const quests = [{ name: 'COLLECT CELLS', task: 'Gather data cells', cur: 0, tar: 4 }];

        // UI updates
        function updateUI() {
            document.getElementById('inv-list').innerHTML = inventory.length
                ? inventory.map(i => '<div class="item">' + i.replace(/_/g, ' ') + '</div>').join('')
                : 'NO EVIDENCE COLLECTED';

            document.getElementById('quest-list').innerHTML = quests.map(q => {
                const done = q.cur >= q.tar;
                return '<div class="q-item ' + (done ? 'q-done' : '') + '"><b>' + q.name + '</b><br><small>' + q.task + ' [' + q.cur + '/' + q.tar + ']</small></div>';
            }).join('');
        }

        // Start button
        document.getElementById('btn-start').onclick = () => {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'none';
            started = true;
            updateUI();
            animate();
        };

        // Simple particle system
        const MAX_PARTICLES = 500;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(MAX_PARTICLES * 3).fill(99999);
        const lifetimes = new Float32Array(MAX_PARTICLES);
        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 0.6,
            color: 0xaa8855,
            transparent: true,
            opacity: 0.7,
            depthWrite: false
        });
        const particleSystem = new THREE.Points(particles, particleMat);
        scene.add(particleSystem);

        function spawnParticle(pos, vel, life) {
            const i = Math.floor(Math.random() * MAX_PARTICLES);
            lifetimes[i] = life;
            positions[i * 3] = pos.x;
            positions[i * 3 + 1] = pos.y;
            positions[i * 3 + 2] = pos.z;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            if (!started) {
                renderer.render(scene, camera);
                return;
            }

            // Movement
            const pPos = playerMesh.position;
            const up = pPos.clone().normalize();
            const forward = new THREE.Vector3(0, 0, -1);
            forward.applyQuaternion(playerMesh.quaternion);
            const right = new THREE.Vector3().crossVectors(up, forward);

            const speed = 0.5;
            if (keys['KeyW'] || keys['ArrowUp']) pBody.velocity.add(forward.multiplyScalar(speed));
            if (keys['KeyS'] || keys['ArrowDown']) pBody.velocity.add(forward.multiplyScalar(-speed));
            if (keys['KeyA'] || keys['ArrowLeft']) pBody.velocity.add(right.multiplyScalar(-speed));
            if (keys['KeyD'] || keys['ArrowRight']) pBody.velocity.add(right.multiplyScalar(speed));
            
            // Apply gravity
            const gravity = -0.05;
            pBody.velocity.add(up.clone().multiplyScalar(gravity));

            // Jump
            if (keys['Space'] && canJump) {
                pBody.velocity.add(up.clone().multiplyScalar(2));
                canJump = false;
            }

            // Update position
            pPos.add(pBody.velocity);

            // Dampen velocity
            pBody.velocity.multiplyScalar(0.9);

            // Grounded check
            const groundHeight = planetR + 1.0;
            if (pPos.length() < planetR + 1.6) {
                pPos.setLength(groundHeight);
                // Project velocity onto the tangent plane
                const radialComponent = pBody.velocity.dot(up);
                if (radialComponent < 0) {
                    pBody.velocity.sub(up.clone().multiplyScalar(radialComponent));
                }
                canJump = true;
            }

            // Sync mesh
            playerMesh.up.copy(up);
            playerMesh.lookAt(pPos.clone().add(camHeading.clone().projectOnPlane(up).normalize()));

            // Camera follow
            const camOffset = new THREE.Vector3(0, 4, -8);
            camOffset.applyQuaternion(playerMesh.quaternion);
            camera.position.copy(pPos).add(camOffset);
            camera.lookAt(pPos.clone().add(forward.multiplyScalar(5)));

            // Item collection
            for (let i = items.length - 1; i >= 0; i--) {
                if (pPos.distanceTo(items[i].position) < 3) {
                    scene.remove(items[i]);
                    items.splice(i, 1);
                    inventory.push('COLLECTED_ITEM_' + items.length);
                    updateUI();
                }
            }

            // Update particles
            let needsUpdate = false;
            for (let i = 0; i < lifetimes.length; i++) {
                if (lifetimes[i] > 0) {
                    lifetimes[i] -= 1/60;
                    if (lifetimes[i] <= 0) {
                        positions[i * 3] = 99999;
                    } else {
                        needsUpdate = true;
                    }
                }
            }
            if (needsUpdate) particles.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // Init
        document.getElementById('loading-screen').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        }, 1000);

        setupPlayer();
        setupItems();
        // Initial render before starting
        renderer.render(scene, camera);
        updateUI();
    </script>
</body>

</html>
