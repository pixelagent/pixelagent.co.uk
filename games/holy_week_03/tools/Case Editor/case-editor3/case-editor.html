<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miracle Maker - Case Editor</title>
    <link rel="stylesheet" href="case-editor.css">
</head>
<body>
    <div class="editor-container">
        <h1>Miracle Maker Case Editor</h1>

        <div class="io-section">
            <div class="field">
                <label for="file-input">Load Case Files</label>
                <input type="file" id="file-input" accept=".js" multiple>
            </div>

            <div class="field">
                <label for="act-select">Act</label>
                <select id="act-select">
                    <option value="">-- Load files first --</option>
                </select>
            </div>

            <div class="field">
                <label for="case-select">Case</label>
                <select id="case-select">
                    <option value="">-- Select an Act first --</option>
                </select>
            </div>

            <div class="field search-field">
                <label for="search-input">Search sections</label>
                <input type="text" id="search-input" placeholder="e.g. prophecy, npc, truth...">
            </div>

            <div class="field export-field">
                <label>&nbsp;</label>
                <button id="export-btn" class="hidden">Export as JSON</button>
            </div>
        </div>

        <div id="status">Load act1_case.js, act2_case.js, act3_case.js and act4_case.js to begin (you can select all four at once, or add them one at a time).</div>

        <nav id="toc" class="toc hidden" aria-label="Section table of contents"></nav>

        <div id="sections-container"></div>
    </div>

    <script src="case-editor.js"></script>
</body>
</html>
