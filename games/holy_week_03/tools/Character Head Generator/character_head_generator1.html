<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Head Generator — Front View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --parchment:#ede2c6;
    --parchment-dark:#ddceA5;
    --panel:#241a12;
    --panel-2:#2f2318;
    --ink:#2b2118;
    --cream:#f2e9d3;
    --cream-dim:#c9bb9a;
    --accent:#8c2f2f;
    --accent-2:#b5453b;
    --gold:#b8934a;
    --border:#4a3b2b;
    --radius:6px;
    --font-display:'Cormorant Garamond', serif;
    --font-body:'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:0; height:100vh; overflow:hidden;
    font-family:var(--font-body);
    background:var(--panel);
    color:var(--cream);
    display:flex;
  }
  .workspace{ display:flex; width:100%; height:100%; }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:360px; min-width:360px;
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:22px 20px 18px;
    overflow-y:auto;
    display:flex; flex-direction:column; gap:18px;
  }
  .sidebar::-webkit-scrollbar{ width:8px; }
  .sidebar::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  .brand{
    font-family:var(--font-display);
    font-size:1.55rem; font-weight:600; letter-spacing:.02em;
    color:var(--cream);
    border-bottom:1px solid var(--border);
    padding-bottom:12px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .brand small{ font-family:var(--font-body); font-size:.62rem; text-transform:uppercase; letter-spacing:.14em; color:var(--gold); font-weight:600; }

  h3.section-title{
    font-family:var(--font-display);
    font-size:1.02rem; font-weight:600; color:var(--gold);
    margin:0 0 2px; letter-spacing:.03em;
    display:flex; align-items:center; gap:8px;
  }
  h3.section-title::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--border),transparent); }

  .control-group{ display:flex; flex-direction:column; gap:10px; padding-bottom:14px; border-bottom:1px solid var(--border); }
  .control-group:last-of-type{ border-bottom:none; }

  label.field{ font-size:.78rem; color:var(--cream-dim); display:flex; flex-direction:column; gap:4px; }
  label.field span.val{ color:var(--gold); font-weight:600; }
  label.row{ flex-direction:row; align-items:center; justify-content:space-between; }

  select, input[type="range"]{
    width:100%; padding:7px 8px;
    background:var(--panel-2); color:var(--cream);
    border:1px solid var(--border); border-radius:4px;
    font-family:var(--font-body); font-size:.82rem;
  }
  select:focus, input:focus{ outline:2px solid var(--accent-2); outline-offset:1px; }

  .color-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .color-field{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:.76rem; color:var(--cream-dim); }
  input[type="color"]{
    width:38px; height:28px; padding:0; border:1px solid var(--border); border-radius:4px;
    background:none; cursor:pointer;
  }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--cream-dim); }
  input[type="checkbox"]{ accent-color:var(--accent); width:15px; height:15px; }

  button{
    font-family:var(--font-body); font-weight:600; font-size:.8rem;
    background:var(--accent); color:var(--cream);
    border:1px solid var(--accent-2); padding:10px 12px; border-radius:4px;
    cursor:pointer; letter-spacing:.02em;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{ background:var(--accent-2); }
  button:active{ transform:translateY(1px); }
  button.secondary{ background:var(--panel-2); border-color:var(--border); color:var(--cream); }
  button.secondary:hover{ background:#3a2c1e; }
  button.wide{ width:100%; }

  .preset-row{ display:flex; gap:8px; }
  .preset-row select{ flex:1; }
  .preset-row button{ flex:0 0 auto; }

  .action-buttons{ display:flex; flex-direction:column; gap:8px; margin-top:auto; padding-top:14px; }

  /* ---------- CANVAS AREA ---------- */
  .canvas-area{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(184,147,74,.10), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(140,47,47,.08), transparent 40%),
      var(--parchment);
    position:relative;
    gap:18px;
  }
  .medallion{
    width:380px; height:380px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #f7f0dc 0%, var(--parchment-dark) 78%, #cbb886 100%);
    border:3px solid var(--ink);
    box-shadow:
      0 0 0 6px var(--parchment),
      0 0 0 9px var(--gold),
      0 18px 40px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .medallion::before{
    content:""; position:absolute; inset:14px; border-radius:50%;
    border:1px solid rgba(43,33,24,.35);
  }
  #svg-container{ width:78%; height:78%; }
  #svg-container svg{ width:100%; height:100%; display:block; }

  .caption{
    text-align:center; font-family:var(--font-display); color:var(--ink);
  }
  .caption .name{ font-size:1.5rem; font-weight:600; letter-spacing:.02em; }
  .caption .name::before, .caption .name::after{ content:"✦"; color:var(--accent); font-size:.85rem; margin:0 10px; vertical-align:middle; }
  .caption .sub{ font-family:var(--font-body); font-size:.7rem; text-transform:uppercase; letter-spacing:.16em; color:var(--border); margin-top:2px; }

  @media (max-width:820px){
    .sidebar{ width:290px; min-width:290px; }
    .medallion{ width:280px; height:280px; }
  }
</style>
</head>
<body>

<div class="workspace">

  <!-- ============ SIDEBAR ============ -->
  <div class="sidebar">
    <div class="brand">Head Forge <small>Front View</small></div>

    <!-- Presets -->
    <div class="control-group">
      <h3 class="section-title">Character Presets</h3>
      <div class="preset-row">
        <select id="preset-select"></select>
        <button id="load-preset">Load</button>
      </div>
    </div>

    <!-- Face features -->
    <div class="control-group">
      <h3 class="section-title">Face</h3>
      <label class="field">Eye Shape
        <select id="eye-shape">
          <option value="almond">Almond</option>
          <option value="round">Round</option>
          <option value="narrow">Narrow</option>
          <option value="downturned">Downturned</option>
          <option value="upturned">Upturned</option>
          <option value="hooded">Hooded</option>
        </select>
      </label>
      <label class="field">Eyebrows
        <select id="eyebrow-style">
          <option value="arched">Arched</option>
          <option value="straight">Straight</option>
          <option value="thick">Thick</option>
          <option value="thin">Thin</option>
          <option value="furrowed">Furrowed</option>
        </select>
      </label>
      <label class="field">Nose Shape
        <select id="nose-shape">
          <option value="straight">Straight</option>
          <option value="aquiline">Aquiline / Hooked</option>
          <option value="wide">Wide</option>
          <option value="button">Button</option>
        </select>
      </label>
      <label class="field row">Nose Size <span class="val" id="nose-scale-val">1.0×</span>
        <input type="range" id="nose-scale" min="0.75" max="1.4" step="0.05" value="1">
      </label>
      <label class="field">Mouth
        <select id="mouth-style">
          <option value="neutral">Neutral</option>
          <option value="smile">Smile</option>
          <option value="frown">Frown</option>
          <option value="small">Small</option>
          <option value="open">Open / Speaking</option>
        </select>
      </label>
    </div>

    <!-- Hair / Beard / Hat -->
    <div class="control-group">
      <h3 class="section-title">Hair &amp; Covering</h3>
      <label class="field">Hair Style
        <select id="hair-style">
          <option value="bald">Bald</option>
          <option value="short">Short Crop</option>
          <option value="buzz">Buzz</option>
          <option value="wavy">Wavy</option>
          <option value="curly">Curly</option>
          <option value="afro">Full &amp; Rounded</option>
          <option value="receding">Receding</option>
          <option value="flowing">Long / Flowing</option>
        </select>
      </label>
      <label class="field">Beard
        <select id="beard-style">
          <option value="none">Clean Shaven</option>
          <option value="stubble">Stubble</option>
          <option value="short">Short</option>
          <option value="medium">Medium</option>
          <option value="long">Long / Patriarch</option>
          <option value="full_round">Full &amp; Rounded</option>
        </select>
      </label>
      <label class="field">Head Covering
        <select id="hat-style">
          <option value="none">None</option>
          <option value="turban">Turban</option>
          <option value="hood">Mantle / Hood</option>
          <option value="skullcap">Skullcap</option>
          <option value="headscarf">Headscarf</option>
          <option value="helmet">Roman Helmet</option>
        </select>
      </label>
    </div>

    <!-- Colors -->
    <div class="control-group">
      <h3 class="section-title">Colors</h3>
      <div class="color-grid">
        <div class="color-field">Face <input type="color" id="color-skin" value="#d2a679"></div>
        <div class="color-field">Eyes <input type="color" id="color-eye" value="#4a3b32"></div>
        <div class="color-field">Lips <input type="color" id="color-lip" value="#a85d5d"></div>
        <div class="color-field">Hair <input type="color" id="color-hair" value="#2a2a2a"></div>
        <div class="color-field">Beard <input type="color" id="color-beard" value="#2a2a2a"></div>
        <div class="color-field">Dress <input type="color" id="color-garment" value="#6b5b50"></div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="dual-stripe">
        <label for="dual-stripe">Dual-color dress (sash stripe)</label>
      </div>
      <div class="color-field" id="garment2-row" style="display:none;">Sash Color <input type="color" id="color-garment2" value="#d4af37"></div>
    </div>

    <!-- Actions -->
    <div class="action-buttons">
      <button class="wide" id="export-svg">Download .SVG</button>
      <button class="wide secondary" id="export-json">Save .JSON</button>
      <button class="wide secondary" id="export-batch">Batch Download All Presets</button>
    </div>
  </div>

  <!-- ============ CANVAS ============ -->
  <div class="canvas-area">
    <div class="medallion">
      <div id="svg-container"></div>
    </div>
    <div class="caption">
      <div class="name" id="caption-name">Custom Character</div>
      <div class="sub" id="caption-sub">unsaved configuration</div>
    </div>
  </div>

</div>

<script>
/* ==========================================================
   CORE RENDER LOGIC — pure functions, no DOM dependency.
   Builds a front-view (emoji-style) portrait entirely from
   solid-fill SVG paths (no strokes / line art).
   ========================================================== */

function mirror(inner){
  return `<g transform="translate(200,0) scale(-1,1)">${inner}</g>`;
}

/* ---------- EYEBROWS ---------- */
function eyebrowPath(style){
  switch(style){
    case "straight":  return "M63,77 L90,74 L90,77.5 L63,80 Z";
    case "thick":     return "M62,80 C69,68 84,67 91,75 C84,70 69,71 62,80 Z";
    case "thin":      return "M64,77 L90,75 L90,76.3 L64,78.3 Z";
    case "furrowed":  return "M63,71 L90,81 L90,84.5 L63,74.5 Z";
    case "arched":
    default:          return "M64,78 C70,68 84,67 90,76 C84,71 70,72 64,78 Z";
  }
}

/* ---------- EYES ---------- */
function eyeMarkup(style, colorEye, colorSkin){
  const cx = 77, cy = 93;
  let white, irisR = 5, irisCx = cx, irisCy = cy, lid = "";
  switch(style){
    case "round":
      white = `<circle cx="${cx}" cy="${cy}" r="9" fill="#fdfaf1"/>`;
      irisR = 5.5;
      break;
    case "narrow":
      white = `<ellipse cx="${cx}" cy="${cy}" rx="13" ry="4.2" fill="#fdfaf1"/>`;
      irisR = 3.6;
      break;
    case "downturned":
      white = `<path d="M63,90 C68,85 87,86 91,93 C86,101 68,100 63,90 Z" fill="#fdfaf1"/>`;
      irisCx = cx + 1; irisCy = cy + 2;
      break;
    case "upturned":
      white = `<path d="M63,95 C69,84 88,84 91,90 C85,98 68,99 63,95 Z" fill="#fdfaf1"/>`;
      irisCx = cx + 1; irisCy = cy - 2;
      break;
    case "hooded":
      white = `<path d="M64,92 C69,85 85,85 90,92 C85,99 69,99 64,92 Z" fill="#fdfaf1"/>`;
      lid = `<path d="M61,85 C68,80 86,80 93,86 C86,84 70,84 61,85 Z" fill="${colorSkin}"/>`;
      break;
    case "almond":
    default:
      white = `<path d="M64,92 C69,85 85,85 90,92 C85,99 69,99 64,92 Z" fill="#fdfaf1"/>`;
  }
  const iris  = `<circle cx="${irisCx}" cy="${irisCy}" r="${irisR}" fill="${colorEye}"/>`;
  const pupil = `<circle cx="${irisCx}" cy="${irisCy}" r="${irisR*0.4}" fill="#1a1410"/>`;
  const glint = `<circle cx="${irisCx+1.4}" cy="${irisCy-1.4}" r="${irisR*0.22}" fill="#ffffff"/>`;
  return `${white}${iris}${pupil}${glint}${lid}`;
}

/* ---------- NOSE ---------- */
function noseMarkup(shape, scale, shadeColor){
  let path;
  switch(shape){
    case "aquiline":
      path = `M99,93 C104,100 108,108 105,116 C109,118 111,122 109,125 L91,125 C89,122 91,118 95,116 C92,108 96,100 99,93 Z`;
      break;
    case "wide":
      path = `M97,94 C94,104 89,113 87,119 C86,124 90,127 96,128 L104,128 C110,127 114,124 113,119 C111,113 106,104 103,94 Z`;
      break;
    case "button":
      path = `M99,100 C96,107 93,112 93,116 C93,121 106,121 106,116 C106,112 103,107 100,100 Z`;
      break;
    case "straight":
    default:
      path = `M97,94 C95,104 91,114 89,119 C88,123 91,126 96,127 L104,127 C109,126 112,123 111,119 C109,114 105,104 103,94 Z`;
  }
  const nostrils =
    `<ellipse cx="94.5" cy="122" rx="2" ry="1.4" fill="${shadeColor}" opacity="0.85"/>` +
    `<ellipse cx="105.5" cy="122" rx="2" ry="1.4" fill="${shadeColor}" opacity="0.85"/>`;
  const body = `<path d="${path}" fill="${shadeColor}" opacity="0.32"/>${nostrils}`;
  return `<g transform="translate(100,110) scale(${scale}) translate(-100,-110)">${body}</g>`;
}

/* ---------- MOUTH ---------- */
function mouthPath(style, colorLip){
  let d, extra = "";
  switch(style){
    case "smile":  d = "M78,140 C85,152 115,152 122,140 C115,148 85,148 78,140 Z"; break;
    case "frown":  d = "M78,150 C85,140 115,140 122,150 C115,144 85,144 78,150 Z"; break;
    case "small":  d = "M88,142 C92,146 108,146 112,142 C108,146.5 92,146.5 88,142 Z"; break;
    case "open":
      d = "M80,139 C88,144 112,144 120,139 C115,150 85,150 80,139 Z";
      extra = `<path d="M85,141 C90,145 110,145 115,141 C112,144 88,144 85,141 Z" fill="#3a1f1f"/>`;
      break;
    case "neutral":
    default:       d = "M82,142 C90,146 110,146 118,142 C110,150 90,150 82,142 Z";
  }
  return `<path d="${d}" fill="${colorLip}"/>${extra}`;
}

/* ---------- EARS ---------- */
function earsMarkup(colorSkin){
  const left = `<path d="M43,95 C34,93 30,104 33,116 C35,124 42,128 48,124 C46,112 45,102 43,95 Z" fill="${colorSkin}"/>`;
  return left + mirror(left);
}

/* ---------- HAIR ---------- */
function hairBack(style, colorHair){
  if(style === "flowing"){
    return `<path d="M100,25 C60,22 38,50 40,90 C41,130 35,175 30,215 C28,228 34,238 46,238 L64,238 C58,200 58,150 62,110 C64,80 78,55 100,50
      C122,55 136,80 138,110 C142,150 142,200 136,238 L154,238 C166,238 172,228 170,215 C165,175 159,130 160,90 C162,50 140,22 100,25 Z"
      fill="${colorHair}"/>`;
  }
  return "";
}
function hairFront(style, colorHair){
  switch(style){
    case "bald": return "";
    case "buzz":
      return `<path d="M100,26 C132,26 148,48 147,76 C147,66 142,57 135,52 C136,58 134,63 131,65 C127,50 114,40 100,40 C86,40 73,50 69,65 C66,63 64,58 65,52 C58,57 53,66 53,76 C52,48 68,26 100,26 Z" fill="${colorHair}"/>`;
    case "wavy":
      return `<path d="M100,22 C136,22 154,46 152,80 C151,68 145,56 136,50 C138,58 136,64 132,66 C129,48 114,36 100,36 C86,36 71,48 68,66 C64,64 62,58 64,50 C55,56 49,68 48,80 C46,46 64,22 100,22 Z" fill="${colorHair}"/>
        <path d="M48,78 C50,84 46,90 50,96 C52,88 54,84 50,78 Z" fill="${colorHair}"/>
        <path d="M152,78 C150,84 154,90 150,96 C148,88 146,84 150,78 Z" fill="${colorHair}"/>`;
    case "curly":
      return `<path d="M100,28 C130,28 146,48 145,72 C145,64 140,56 133,52 C134,57 132,61 129,63 C126,48 113,38 100,38 C87,38 74,48 71,63 C68,61 66,57 67,52 C60,56 55,64 55,72 C54,48 70,28 100,28 Z" fill="${colorHair}"/>
        <circle cx="52" cy="60" r="7" fill="${colorHair}"/><circle cx="60" cy="45" r="7" fill="${colorHair}"/>
        <circle cx="76" cy="33" r="7" fill="${colorHair}"/><circle cx="100" cy="28" r="7.5" fill="${colorHair}"/>
        <circle cx="124" cy="33" r="7" fill="${colorHair}"/><circle cx="140" cy="45" r="7" fill="${colorHair}"/>
        <circle cx="148" cy="60" r="7" fill="${colorHair}"/>`;
    case "receding":
      return `<path d="M100,40 C126,38 145,52 148,78 C148,66 142,58 135,53 C136,59 134,64 131,66 C129,52 118,44 108,42 C112,46 112,50 108,52 C102,44 96,44 92,52 C88,50 88,46 92,42 C82,44 71,52 69,66 C66,64 64,59 65,53 C58,58 52,66 52,78 C55,52 74,42 100,40 Z" fill="${colorHair}"/>`;
    case "afro":
      return `<path d="M100,15 C145,15 168,45 165,85 C165,68 158,54 148,48 C150,58 147,66 141,69 C137,45 118,30 100,30 C82,30 63,45 59,69 C53,66 50,58 52,48 C42,54 35,68 35,85 C32,45 55,15 100,15 Z" fill="${colorHair}"/>`;
    case "flowing":
      return `<path d="M100,26 C132,26 148,46 147,72 C147,62 142,54 135,50 C136,56 134,61 131,63 C127,48 114,38 100,38 C86,38 73,48 69,63 C66,61 64,56 65,50 C58,54 53,62 53,72 C52,46 68,26 100,26 Z" fill="${colorHair}"/>`;
    case "short":
    default:
      return `<path d="M100,22 C138,22 156,48 154,85 C154,70 148,58 140,52 C142,60 140,66 136,68 C132,50 112,38 100,38 C88,38 68,50 64,68 C60,66 58,60 60,52 C52,58 46,70 46,85 C44,48 62,22 100,22 Z" fill="${colorHair}"/>`;
  }
}

/* ---------- BEARD ---------- */
function beardMarkup(style, colorBeard){
  switch(style){
    case "none": return "";
    case "stubble": {
      const pts = [
        [72,132],[80,138],[88,144],[96,150],[104,150],[112,144],[120,138],[128,132],
        [76,140],[84,146],[92,152],[100,154],[108,152],[116,146],[124,140],
        [80,148],[90,156],[100,159],[110,156],[120,148]
      ];
      return pts.map(([x,y]) => `<circle cx="${x}" cy="${y}" r="1.1" fill="${colorBeard}" opacity="0.45"/>`).join("");
    }
    case "short":
      return `<path d="M70,130 C64,142 66,158 76,168 C84,175 92,178 100,178 C108,178 116,175 124,168 C134,158 136,142 130,130 C126,144 118,152 100,154 C82,152 74,144 70,130 Z" fill="${colorBeard}"/>`;
    case "medium":
      return `<path d="M69,129 C61,144 62,162 73,176 C82,186 91,190 100,190 C109,190 118,186 127,176 C138,162 139,144 131,129 C127,146 118,156 100,158 C82,156 73,146 69,129 Z" fill="${colorBeard}"/>`;
    case "full_round":
      return `<path d="M66,120 C58,130 58,148 62,160 C55,158 50,150 50,140 C50,155 56,172 70,182 C82,192 92,195 100,195 C108,195 118,192 130,182 C144,172 150,155 150,140 C150,150 145,158 138,160 C142,148 142,130 134,120 C132,140 122,152 100,154 C78,152 68,140 66,120 Z" fill="${colorBeard}"/>`;
    case "long":
    default:
      return `<path d="M70,128 C60,140 58,165 68,185 C78,198 92,204 100,205 C108,204 122,198 132,185 C142,165 140,140 130,128 C126,148 118,160 100,162 C82,160 74,148 70,128 Z" fill="${colorBeard}"/>`;
  }
}

/* ---------- HEAD COVERING ---------- */
function hatMarkup(style, colorCloth){
  switch(style){
    case "none": return "";
    case "turban":
      return `<path d="M55,55 C55,30 75,15 100,15 C125,15 145,30 145,55 C145,65 140,70 133,68 C136,50 122,32 100,32 C78,32 64,50 67,68 C60,70 55,65 55,55 Z" fill="${colorCloth}"/>
        <path d="M62,42 C78,36 122,36 138,42 C138,46 134,48 128,46 C112,42 88,42 72,46 C66,48 62,46 62,42 Z" fill="${colorCloth}" opacity="0.6"/>
        <path d="M95,15 C90,20 90,28 96,32 L104,32 C110,28 110,20 105,15 Z" fill="${colorCloth}"/>`;
    case "hood":

/* ---------- GARMENT ---------- */
function garmentMarkup(color1, color2, dual){
  const shoulder = `M40,240 L40,202 C40,178 66,168 100,168 C134,168 160,178 160,202 L160,240 Z`;
  let stripe = "";
  if(dual){
    stripe = `<clipPath id="garmentClip"><path d="${shoulder}"/></clipPath>
      <g clip-path="url(#garmentClip)">
        <path d="M55,168 L80,168 L58,240 L33,240 Z" fill="${color2}"/>
      </g>`;
  }
  return `<path d="${shoulder}" fill="${color1}"/>${stripe}`;
}
function neckMarkup(colorSkin){
  return `<path d="M85,158 L85,186 C90,193 110,193 115,186 L115,158 Z" fill="${colorSkin}"/>`;
}

/* ---------- FACE ---------- */
function facePath(colorSkin){
  return `<path d="M100,25 C132,25 152,52 152,92 C152,128 142,152 128,166 C117,176 108,180 100,180 C92,180 83,176 72,166 C58,152 48,128 48,92 C48,52 68,25 100,25 Z" fill="${colorSkin}"/>`;
}

/* ---------- COLOR SHADE HELPER ---------- */
function shadeColor(hex, amt){
  let c = hex.replace('#','');
  if(c.length === 3) c = c.split('').map(x => x+x).join('');
  const num = parseInt(c,16);
  let r=(num>>16)+amt, g=((num>>8)&0xff)+amt, b=(num&0xff)+amt;
  r=Math.max(Math.min(255,r),0); g=Math.max(Math.min(255,g),0); b=Math.max(Math.min(255,b),0);
  return "#" + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

/* ---------- ASSEMBLE FULL SVG ---------- */
function buildSVG(state){
  const shade = shadeColor(state.colorSkin, -28);
  const parts = [
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">`,
    garmentMarkup(state.colorGarment, state.colorGarment2, state.dualStripe),
    neckMarkup(state.colorSkin),
    hairBack(state.hairStyle, state.colorHair),
    earsMarkup(state.colorSkin),
    facePath(state.colorSkin),
    beardMarkup(state.beardStyle, state.colorBeard),
    mouthPath(state.mouthStyle, state.colorLip),
    noseMarkup(state.noseShape, state.noseScale, shade),
    eyebrowPath(state.eyebrowStyle),
    mirror(eyebrowPath(state.eyebrowStyle)),
    eyeMarkup(state.eyeStyle, state.colorEye, state.colorSkin),
    mirror(eyeMarkup(state.eyeStyle, state.colorEye, state.colorSkin)),
    hairFront(state.hairStyle, state.colorHair),
    hatMarkup(state.hatStyle, state.colorGarment),
    `</svg>`
  ];
  return parts.join("");
}

/* ==========================================================

   ========================================================== */
let state = {
  label: "Custom Character",
  eyeStyle:"almond", eyebrowStyle:"arched", noseShape:"straight", noseScale:1.0, mouthStyle:"neutral",
  hairStyle:"short", beardStyle:"none", hatStyle:"none",
  colorSkin:"#d2a679", colorEye:"#4a3b32", colorLip:"#a85d5d",
  colorHair:"#2a2a2a", colorBeard:"#2a2a2a",
  colorGarment:"#6b5b50", colorGarment2:"#d4af37", dualStripe:false

const ids = ["eye-shape:eyeStyle","eyebrow-style:eyebrowStyle","nose-shape:noseShape",
  "mouth-style:mouthStyle","hair-style:hairStyle","beard-style:beardStyle","hat-style:hatStyle"];
const colorIds = ["color-skin:colorSkin","color-eye:colorEye","color-lip:colorLip",
  "color-hair:colorHair","color-beard:colorBeard","color-garment:colorGarment","color-garment2:colorGarment2"];

function slugify(str){
  return str.toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || "custom_character";
}

function render(){
  document.getElementById("svg-container").innerHTML = buildSVG(state);
  document.getElementById("caption-name").textContent = state.label;
  document.getElementById("caption-sub").textContent = slugify(state.label) + ".svg";
}

function readUIIntoState(){
  ids.forEach(pair => {
    const [elId, key] = pair.split(":");
    state[key] = document.getElementById(elId).value;
  });
  colorIds.forEach(pair => {
    const [elId, key] = pair.split(":");
    state[key] = document.getElementById(elId).value;
  });
  state.noseScale = parseFloat(document.getElementById("nose-scale").value);
  state.dualStripe = document.getElementById("dual-stripe").checked;
  document.getElementById("nose-scale-val").textContent = state.noseScale.toFixed(2) + "×";
  document.getElementById("garment2-row").style.display = state.dualStripe ? "flex" : "none";
  state.label = "Custom Character";
  render();
}

function writeStateIntoUI(){
  ids.forEach(pair => {
    const [elId, key] = pair.split(":");

  });
  colorIds.forEach(pair => {

  document.getElementById("nose-scale-val").textContent = state.noseScale.toFixed(2) + "×";

}

/* ==========================================================
   EXPORT FUNCTIONS
   ========================================================== */
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById("export-svg").addEventListener("click", () => {
  const svgContent = '<?xml version="1.0" encoding="UTF-8"?>\n' + buildSVG(state);
  const blob = new Blob([svgContent], { type:"image/svg+xml;charset=utf-8" });
  triggerDownload(blob, slugify(state.label) + ".svg");
});

document.getElementById("export-json").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
  triggerDownload(blob, slugify(state.label) + ".json");
});

document.getElementById("export-batch").addEventListener("click", async () => {
  const btn = document.getElementById("export-batch");
  const originalText = btn.textContent;
  btn.textContent = "Preparing…"; btn.disabled = true;
  try{
    if(typeof JSZip === "undefined") throw new Error("JSZip unavailable");
    const zip = new JSZip();
    Object.entries(presets).forEach(([key, preset]) => {
      const svgContent = '<?xml version="1.0" encoding="UTF-8"?>\n' + buildSVG(preset);
      zip.file(`${key}.svg`, svgContent);
      zip.file(`${key}.json`, JSON.stringify(preset, null, 2));
    });
    const blob = await zip.generateAsync({ type:"blob" });
    triggerDownload(blob, "character_presets.zip");
  }catch(err){
    /* Fallback: sequential individual downloads if the zip library didn't load */
    const entries = Object.entries(presets);
    for(let i = 0; i < entries.length; i++){
      const [key, preset] = entries[i];
      setTimeout(() => {
        const blob = new Blob([JSON.stringify(preset, null, 2)], { type:"application/json" });
        triggerDownload(blob, `${key}.json`);
      }, i * 300);
    }
  }finally{
    setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 500);
  }
});

writeStateIntoUI();
