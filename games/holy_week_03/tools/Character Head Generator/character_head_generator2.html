<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Profile SVG Generator — Front View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- JSZip for bulk exporting -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg-color: #0d0d12;
    --panel-bg: #16161c;
    --panel-2: #1e1e26;
    --text-color: #d1d1d6;
    --text-dim: #9aa0a6;
    --accent: #4a5c78;
    --accent-alt: #3d8f5c;
    --border: #2a2a35;
    --iron: #333340;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; height: 100vh; overflow: hidden;
    font-family: var(--font-body);
    background: var(--bg-color);
    color: var(--text-color);
    display: flex;
  }

  /* Landscape Layout Enforced */
  .workspace { display: flex; flex-direction: row; width: 100%; height: 100%; }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    width: 400px; min-width: 400px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    padding: 22px 20px 18px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .sidebar::-webkit-scrollbar { width: 8px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .brand {
    font-family: var(--font-display);
    font-size: 1.55rem; font-weight: 600; letter-spacing: .02em;
    color: var(--text-color);
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .brand small { font-family: var(--font-body); font-size: .62rem; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); font-weight: 600; }

  h3.section-title {
    font-family: var(--font-display);
    font-size: 1.05rem; font-weight: 600; color: var(--accent);
    margin: 0 0 10px; letter-spacing: .05em; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  h3.section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

  .control-group { display: flex; flex-direction: column; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .control-group:last-of-type { border-bottom: none; }

  label.field { font-size: .78rem; color: var(--text-dim); display: flex; flex-direction: column; gap: 5px; }
  label.field span.val { color: var(--accent); font-weight: 600; }
  label.row { flex-direction: row; align-items: center; justify-content: space-between; }

  select, input[type="range"] {
    width: 100%; padding: 7px 8px;
    background: var(--panel-2); color: var(--text-color);
    border: 1px solid var(--border); border-radius: 4px;
    font-family: var(--font-body); font-size: .82rem;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .color-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .76rem; color: var(--text-dim); min-height: 28px; }
  input[type="color"] {
    width: 40px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: 4px;
    background: none; cursor: pointer; flex-shrink: 0;
  }

  button {
    font-family: var(--font-body); font-weight: 600; font-size: .8rem;
    background: var(--accent); color: #fff;
    border: 1px solid var(--accent); padding: 10px 12px; border-radius: 4px;
    cursor: pointer; letter-spacing: .02em;
    transition: background .15s ease, transform .1s ease;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: translateY(1px); }
  button.secondary { background: var(--panel-2); border-color: var(--border); color: var(--text-color); }
  button.secondary:hover { background: var(--border); }
  button.success { background: var(--accent-alt); border-color: var(--accent-alt); }
  button.wide { width: 100%; }

  .preset-row { display: flex; gap: 8px; }
  .preset-row select { flex: 1; }
  .preset-row button { flex: 0 0 auto; }

  .action-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: auto; padding-top: 14px; }
  .row-buttons { display: flex; gap: 8px; }

  /* ---------- CANVAS AREA ---------- */
  .canvas-area {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 50%, #1e1e26 0%, var(--bg-color) 80%);
    background-image: radial-gradient(var(--border) 1px, transparent 1px);
    background-size: 24px 24px;
    position: relative;
    gap: 24px;
  }
  
  .medallion {
    width: 440px; height: 440px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, #b3b3b3 0%, #666666 50%, #333333 100%);
    border: 4px solid #111;
    box-shadow:
      0 0 0 6px var(--bg-color),
      0 0 0 10px var(--iron),
      0 25px 50px rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .medallion::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.8); pointer-events: none;
  }
  #svg-container { width: 100%; height: 100%; }
  #svg-container svg { width: 100%; height: 100%; display: block; }
  
  /* Strictly enforce solid fills, preventing strokes globally inside SVG */
  #svg-container svg * { stroke: none !important; }

  .caption { text-align: center; font-family: var(--font-display); color: var(--text-color); }
  .caption .name { font-size: 1.8rem; font-weight: 600; letter-spacing: .03em; }
  .caption .name::before, .caption .name::after { content: "✦"; color: var(--iron); font-size: 1rem; margin: 0 14px; vertical-align: middle; }
  .caption .sub { font-family: var(--font-body); font-size: .75rem; text-transform: uppercase; letter-spacing: .2em; color: var(--accent); margin-top: 4px; }

</style>
</head>
<body>

<div class="workspace">
  <!-- ============ SIDEBAR ============ -->
  <div class="sidebar">
    <div class="brand">Head Forge <small>Front View</small></div>

    <div class="control-group">
      <h3 class="section-title">Character Presets</h3>
      <div class="preset-row">
        <select id="preset-select"></select>
        <button id="load-preset">Load</button>
      </div>
    </div>

    <div class="control-group">
      <h3 class="section-title">Facial Structure</h3>
      <label class="field">Face Shape
        <select id="face-shape">
          <option value="oval">Oval</option>
          <option value="square">Square</option>
          <option value="round">Round</option>
          <option value="heart">Heart</option>
        </select>
      </label>
      <label class="field">Forehead Height
        <select id="forehead-height">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>
      <label class="field row">Eye Spacing <span class="val" id="eye-spacing-val">1.0×</span>
        <input type="range" id="eye-spacing" min="0.5" max="1.5" step="0.1" value="1">
      </label>
      <label class="field">Chin Shape
        <select id="chin-shape">
          <option value="rounded">Rounded</option>
          <option value="square">Square</option>
          <option value="pointed">Pointed</option>
          <option value="cleft">Cleft</option>
        </select>
      </label>
    </div>

    <div class="control-group">
      <h3 class="section-title">Facial Features</h3>
      <label class="field">Eye Shape
        <select id="eye-shape">
          <option value="almond">Almond</option>
          <option value="round">Round</option>
          <option value="narrow">Narrow</option>
          <option value="downturned">Downturned</option>
          <option value="upturned">Upturned</option>
          <option value="hooded">Hooded</option>
        </select>
      </label>
      <label class="field">Eyebrows
        <select id="eyebrow-style">
          <option value="arched">Arched</option>
          <option value="straight">Straight</option>
          <option value="thick">Thick</option>
          <option value="thin">Thin</option>
          <option value="furrowed">Furrowed</option>
        </select>
      </label>
      <label class="field">Nose Shape
        <select id="nose-shape">
          <option value="straight">Straight</option>
          <option value="aquiline">Aquiline / Hooked</option>
          <option value="wide">Wide</option>
          <option value="button">Button</option>
        </select>
      </label>
      <label class="field">
        <span class="row">Nose Scale <span class="val" id="nose-scale-val">1.0×</span></span>
        <input type="range" id="nose-scale" min="0.75" max="1.4" step="0.05" value="1">
      </label>
      <label class="field">Mouth
        <select id="mouth-style">
          <option value="neutral">Neutral</option>
          <option value="smile">Smile</option>
          <option value="frown">Frown</option>
          <option value="small">Small</option>
          <option value="open">Open / Speaking</option>
        </select>
      </label>
    </div>

    <div class="control-group">
      <h3 class="section-title">Hair & Assets</h3>
      <label class="field">Hair Style
        <select id="hair-style">
          <option value="bald">Bald</option>
          <option value="buzz">Buzz Cut</option>
          <option value="short">Short</option>
          <option value="wavy">Wavy</option>
          <option value="curly">Curly</option>
          <option value="afro">Afro</option>
          <option value="receding">Receding</option>
          <option value="flowing">Flowing</option>
          <option value="braids">Braids</option>
          <option value="tied_back">Tied Back</option>
        </select>
      </label>
      <label class="field">Beard
        <select id="beard-style">
          <option value="none">Clean Shaven</option>
          <option value="stubble">Stubble</option>
          <option value="short">Short</option>
          <option value="medium">Medium</option>
          <option value="full_round">Full & Rounded</option>
          <option value="pointed">Pointed</option>
          <option value="long">Long / Patriarch</option>
        </select>
      </label>
      <label class="field">Head Covering
        <select id="hat-style">
          <option value="none">None</option>
          <option value="hood">Hood / Mantle</option>
          <option value="turban">Turban</option>
          <option value="skullcap">Skullcap</option>
          <option value="headscarf">Headscarf</option>
          <option value="helmet">Roman Helmet</option>
        </select>
      </label>
    </div>

    <div class="control-group">
      <h3 class="section-title">Wardrobe Setup</h3>
      <label class="field">Clothing Layering
        <select id="clothing-type">
          <option value="tunic">Basic Tunic</option>
          <option value="layered_robe">Layered Robe</option>
          <option value="priestly_ephod">Priestly Ephod</option>
          <option value="military_lorica">Military Lorica</option>
          <option value="merchant_sash">Merchant Sash</option>
          <option value="peasant_rags">Peasant Rags</option>
        </select>
      </label>
    </div>

    <div class="control-group">
      <h3 class="section-title">Wardrobe Colors (4-Tier)</h3>
      <div class="color-grid">
        <div class="color-field">Inner Dress <input type="color" id="color-inner" value="#2a2a2a"></div>
        <div class="color-field">Outer Dress <input type="color" id="color-outer" value="#1a1a1a"></div>
        <div class="color-field">Heavy Cloak <input type="color" id="color-cloak" value="#0d0d0d"></div>
        <div class="color-field">Decorations <input type="color" id="color-accent" value="#8b0000"></div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="dual-stripe">
        <label for="dual-stripe">Dual-color stripe (sash / trim)</label>
      </div>
      <div class="color-field" id="stripe-row" style="display:none;">Stripe Color <input type="color" id="color-garment2" value="#d4af37"></div>
    </div>

    <div class="control-group">
      <h3 class="section-title">Physique Colors</h3>
      <div class="color-grid">
        <div class="color-field">Face / Body <input type="color" id="color-skin" value="#d2a679"></div>
        <div class="color-field">Eyes <input type="color" id="color-eye" value="#4a3b32"></div>
        <div class="color-field">Lips <input type="color" id="color-lip" value="#a85d5d"></div>
        <div class="color-field">Hair / Beard <input type="color" id="color-hair" value="#2a2a2a"></div>
      </div>
    </div>

    <div class="action-buttons">
      <div class="row-buttons">
        <button class="wide" id="export-svg">Download .SVG</button>
        <button class="wide secondary" id="export-json">Save .JSON</button>
      </div>
      <button class="wide success" id="export-batch">Batch Download All Presets (ZIP)</button>
    </div>
  </div>

  <!-- ============ CANVAS ============ -->
  <div class="canvas-area">
    <div class="medallion">
      <div id="svg-container"></div>
    </div>
    <div class="caption">
      <div class="name" id="caption-name">Custom Character</div>
      <div class="sub" id="caption-sub">unsaved configuration</div>
    </div>
  </div>

</div>

<script>
/* ==========================================================
   CORE RENDER LOGIC — Front View SVG Construction
   Strictly solid fills. Pure modular functions.
   ========================================================== */

function shadeColor(hex, amt) {
    let c = hex.replace('#','');
    if (c.length === 3) c = c.split('').map(x => x+x).join('');
    const num = parseInt(c, 16);
    let r = (num>>16)+amt, g = ((num>>8)&0xff)+amt, b = (num&0xff)+amt;
    r = Math.max(Math.min(255,r),0); g = Math.max(Math.min(255,g),0); b = Math.max(Math.min(255,b),0);
    return "#" + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

function mirror(inner) {
    return `<g transform="translate(200,0) scale(-1,1)">${inner}</g>`;
}

/* ---------- ANATOMY ---------- */
function anatomyBase(colorSkin) {
    const neckShadow = shadeColor(colorSkin, -30);
    return `
        <!-- Neck -->
        <path d="M82,145 L82,185 C90,195 110,195 118,185 L118,145 Z" fill="${colorSkin}"/>
        <path d="M82,145 L82,165 C90,175 110,175 118,165 L118,145 Z" fill="${neckShadow}" opacity="0.5"/>
        <!-- Shoulders / Base Torso -->
        <path d="M30,240 C35,190 60,170 82,170 L118,170 C140,170 165,190 170,240 Z" fill="${colorSkin}"/>
    `;
}

/* ---------- EARS ---------- */
function earMarkup(colorSkin, earSize) {
    const leftEar = `<path d="M48,96 C42,92 26,96 28,108 C30,118 38,124 46,120 C48,114 48,105 48,96 Z" fill="${colorSkin}"/>`;
    const rightEar = `<path d="M152,96 C158,92 174,96 172,108 C170,118 162,124 154,120 C152,114 152,105 152,96 Z" fill="${colorSkin}"/>`;
    const scaleLeft = (svg) => `<g transform="translate(48,95) scale(${earSize}) translate(-48,-95)">${svg}</g>`;
    const scaleRight = (svg) => `<g transform="translate(152,95) scale(${earSize}) translate(-152,-95)">${svg}</g>`;
    return scaleLeft(leftEar) + scaleRight(rightEar);
}

/* ---------- FACE SHAPES ---------- */
function faceMarkup(shape, foreHeight, colorSkin, headSize) {
    const shadow = shadeColor(colorSkin, -28);
    let path;
    const fy = foreHeight === "high" ? 18 : (foreHeight === "low" ? 30 : 25);
    switch(shape) {
        case "square":
            path = `M100,${fy} C140,${fy} 158,55 158,95 C158,132 145,162 130,178 L70,178 C55,162 42,132 42,95 C42,55 60,${fy} 100,${fy} Z`;
            break;
        case "round":
            path = `M100,${fy} C142,${fy} 162,58 162,102 C162,132 152,162 142,178 C130,192 116,196 100,196 C84,196 70,192 58,178 C48,162 38,132 38,102 C38,58 58,${fy} 100,${fy} Z`;
            break;
        case "heart":
            path = `M100,${fy} C145,${fy} 163,50 160,92 C157,128 147,158 134,178 L122,186 C112,194 105,197 100,197 C95,197 88,194 78,186 L66,178 C53,158 43,128 40,92 C37,50 55,${fy} 100,${fy} Z`;
            break;
        case "oval":
        default:
            path = `M100,${fy} C132,${fy} 152,52 152,92 C152,128 142,152 128,166 C117,176 108,180 100,180 C92,180 83,176 72,166 C58,152 48,128 48,92 C48,52 68,${fy} 100,${fy} Z`;
    }
    const facePath = `<path d="${path}" fill="${colorSkin}"/>`;
    if (headSize !== 1.0) {
        return `<g transform="translate(100,100) scale(${headSize}) translate(-100,-100)">${facePath}</g>`;
    }
    return facePath;
}

/* ---------- CHIN SHAPES ---------- */
function chinMarkup(shape, colorSkin) {
    const shadow = shadeColor(colorSkin, -28);
    switch(shape) {
        case "square":
            return `<path d="M88,164 L112,164 L112,177 C108,182 92,182 88,177 Z" fill="${shadow}" opacity="0.25"/>`;
        case "pointed":
            return `<path d="M100,162 L90,180 L110,180 Z" fill="${shadow}" opacity="0.25"/>`;
        case "cleft":
            return `<path d="M93,164 L100,174 L107,164 L107,177 C103,182 97,182 93,177 Z" fill="${shadow}" opacity="0.25"/>`;
        case "rounded":
        default:
            return `<path d="M93,164 L107,164 C107,176 107,179 100,181 C93,179 93,176 93,164 Z" fill="${shadow}" opacity="0.25"/>`;
    }
}

/* ---------- WARDROBE ---------- */
function wardrobeMarkup(style, cInner, cOuter, cCloak, cAccent) {
    let result = "";

    if (["layered_robe", "military_lorica", "priestly_ephod"].includes(style)) {
        result += `<path d="M20,240 L30,165 C60,150 140,150 170,165 L180,240 Z" fill="${cCloak}" opacity="0.9"/>`;
    }

    switch (style) {
        case "tunic":
            result += `
                <path d="M80,170 L100,200 L120,170 Z" fill="${cInner}" />
                <path d="M30,240 L45,185 C65,165 135,165 155,185 L170,240 Z" fill="${cOuter}" />
                <path d="M80,170 L100,200 L120,170 C140,175 145,190 170,240 L30,240 C55,190 60,175 80,170 Z" fill="${cOuter}" opacity="0.8"/>
            `;
            break;
        case "layered_robe":
            result += `
                <path d="M50,240 L60,165 L100,210 L140,165 L150,240 Z" fill="${cInner}" />
                <path d="M30,240 L40,180 L80,210 L30,240 Z" fill="${cOuter}" />
                <path d="M170,240 L160,180 L120,210 L170,240 Z" fill="${cOuter}" />
                <path d="M70,240 L80,180 L120,180 L130,240 Z" fill="${cAccent}" opacity="0.6"/>
            `;
            break;
        case "priestly_ephod":
            result += `
                <path d="M30,240 L45,180 C60,165 140,165 155,180 L170,240 Z" fill="${cInner}" />
                <path d="M70,175 L130,175 L130,240 L70,240 Z" fill="${cOuter}" />
                <rect x="85" y="185" width="30" height="30" fill="${cAccent}" rx="4"/>
                <circle cx="92" cy="192" r="3" fill="#ffffff" opacity="0.5"/>
                <circle cx="108" cy="192" r="3" fill="#ffffff" opacity="0.5"/>
                <circle cx="92" cy="208" r="3" fill="#ffffff" opacity="0.5"/>
                <circle cx="108" cy="208" r="3" fill="#ffffff" opacity="0.5"/>
            `;
            break;
        case "military_lorica":
            result += `
                <path d="M50,240 L60,170 L140,170 L150,240 Z" fill="${cInner}" />
                <path d="M45,200 L155,200 L155,215 L45,215 Z" fill="${cOuter}" />
                <path d="M42,220 L158,220 L158,235 L42,235 Z" fill="${cOuter}" />
                <path d="M30,240 C35,190 60,170 80,170 L85,210 C50,210 40,240 30,240 Z" fill="${cOuter}" />
                <path d="M170,240 C165,190 140,170 120,170 L115,210 C150,210 160,240 170,240 Z" fill="${cOuter}" />
                <circle cx="100" cy="185" r="10" fill="${cAccent}" />
            `;
            break;
        case "merchant_sash":
            result += `
                <path d="M30,240 L170,240 L155,175 C120,160 80,160 45,175 Z" fill="${cInner}" />
                <path d="M30,240 L60,170 C100,180 140,200 170,240 Z" fill="${cOuter}" />
                <path d="M40,240 L65,170 L100,190 L160,240 Z" fill="${cAccent}" />
            `;
            break;
        case "peasant_rags":
            result += `
                <path d="M40,240 L50,180 L65,195 L80,175 L100,190 L120,175 L135,195 L150,180 L160,240 Z" fill="${cOuter}" />
                <path d="M35,240 L45,190 L55,200 L70,180 L80,240 Z" fill="${cInner}" opacity="0.7"/>
                <path d="M165,240 L155,190 L145,200 L130,180 L120,240 Z" fill="${cInner}" opacity="0.7"/>
            `;
            break;
    }

    return result;
}

/* ---------- GARMENT STRIPE OVERLAY ---------- */
function garmentStripeMarkup(dual, cStripe) {
    if (!dual) return "";
    return `<clipPath id="garmentClip"><path d="M40,240 L40,202 C40,178 66,168 100,168 C134,168 160,178 160,202 L160,240 Z"/></clipPath>
        <g clip-path="url(#garmentClip)">
            <path d="M55,168 L80,168 L58,240 L33,240 Z" fill="${cStripe}"/>
        </g>`;
}

/* ---------- EYES ---------- */
function eyeMarkup(style, spacing, colorEye, colorSkin) {
    const cx = 77 + (spacing - 1) * 6, cy = 93;
    let white, irisR = 5, irisCx = cx, irisCy = cy, lid = "";
    switch(style) {
        case "round":
            white = `<circle cx="${cx}" cy="${cy}" r="9" fill="#fdfaf1"/>`;
            irisR = 5.5; break;
        case "narrow":
            white = `<ellipse cx="${cx}" cy="${cy}" rx="13" ry="4.2" fill="#fdfaf1"/>`;
            irisR = 3.6; break;
        case "downturned":
            white = `<path d="M63,90 C68,85 87,86 91,93 C86,101 68,100 63,90 Z" fill="#fdfaf1"/>`;
            irisCx = cx + 1; irisCy = cy + 2; break;
        case "upturned":
            white = `<path d="M63,95 C69,84 88,84 91,90 C85,98 68,99 63,95 Z" fill="#fdfaf1"/>`;
            irisCx = cx + 1; irisCy = cy - 2; break;
        case "hooded":
            white = `<path d="M64,92 C69,85 85,85 90,92 C85,99 69,99 64,92 Z" fill="#fdfaf1"/>`;

function buildSVG(s) {

        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">`,
        anatomyBase(s.colorSkin),
        wardrobeMarkup(s.clothingType, s.colorInner, s.colorOuter, s.colorCloak, s.colorAccent),
        garmentStripeMarkup(s.dualStripe, s.colorGarment2),
        earMarkup(s.colorSkin, s.earSize),
        hairBackMarkup(s.hairStyle, s.colorHair),
        faceMarkup(s.faceShape, s.foreheadHeight, s.colorSkin, s.headSize),
        chinMarkup(s.chinShape, s.colorSkin),
        beardMarkup(s.beardStyle, s.colorHair),
        mouthMarkup(s.mouthStyle, s.colorLip),
        noseMarkup(s.noseShape, s.noseScale, s.colorSkin),

        hairFrontMarkup(s.hairStyle, s.colorHair),
        hatMarkup(s.hatStyle, s.colorInner, s.colorOuter),

    ].join("");
}

presets["upset_buyer"].headSize = 1.0; presets["upset_buyer"].earSize = 0.95; presets["upset_buyer"].hairStyle = "short"; presets["upset_buyer"].beardStyle = "stubble"; presets["upset_buyer"].eyebrowStyle = "furrowed"; presets["upset_buyer"].mouthStyle = "frown"; presets["upset_buyer"].noseShape = "wide"; presets["upset_buyer"].faceShape = "square"; presets["upset_buyer"].foreheadHeight = "medium"; presets["upset_buyer"].eyeSpacing = 1.0; presets["upset_buyer"].chinShape = "square";
presets["local_traveler"].headSize = 1.0; presets["local_traveler"].earSize = 1.0; presets["local_traveler"].hairStyle = "wavy"; presets["local_traveler"].beardStyle = "short"; presets["local_traveler"].eyebrowStyle = "straight"; presets["local_traveler"].hatStyle = "none"; presets["local_traveler"].noseShape = "straight"; presets["local_traveler"].faceShape = "oval"; presets["local_traveler"].foreheadHeight = "medium"; presets["local_traveler"].eyeSpacing = 1.0; presets["local_traveler"].chinShape = "rounded";

let state = { ...presets["senior_scribe"], name: "custom_character" };

/* ==========================================================
   UI CONTROLLER
   ========================================================== */
const ids = ["face-shape:faceShape","forehead-height:foreheadHeight","eye-spacing:eyeSpacing","chin-shape:chinShape","eye-shape:eyeShape","eyebrow-style:eyebrowStyle","nose-shape:noseShape","mouth-style:mouthStyle","hair-style:hairStyle","beard-style:beardStyle","hat-style:hatStyle","clothing-type:clothingType"];
const colorIds = ["color-inner:colorInner","color-outer:colorOuter","color-cloak:colorCloak","color-accent:colorAccent","color-skin:colorSkin","color-hair:colorHair","color-eye:colorEye","color-lip:colorLip","color-garment2:colorGarment2"];

function formatName(str) { return str.replace(/_/g, " ").replace(/\b\w/g, l => l.toUpperCase()); }
function slugify(str) { return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "custom_character"; }

function render() {
    document.getElementById("svg-container").innerHTML = buildSVG(state);
    document.getElementById("caption-name").textContent = formatName(state.name);
    document.getElementById("caption-sub").textContent = slugify(state.name) + ".svg";
}

function readUIIntoState() {
    ids.forEach(p => { const [id, k] = p.split(":"); state[k] = document.getElementById(id).value; });
    colorIds.forEach(p => { const [id, k] = p.split(":"); state[k] = document.getElementById(id).value; });
    state.noseScale = parseFloat(document.getElementById("nose-scale").value);
    state.eyeSpacing = parseFloat(document.getElementById("eye-spacing").value);
    state.dualStripe = document.getElementById("dual-stripe").checked;
    document.getElementById("nose-scale-val").textContent = state.noseScale.toFixed(2) + "×";
    document.getElementById("eye-spacing-val").textContent = state.eyeSpacing.toFixed(1) + "×";
    document.getElementById("stripe-row").style.display = state.dualStripe ? "flex" : "none";
    state.name = "Custom Character";
    render();
}

function writeStateIntoUI() {
    ids.forEach(p => { const [id, k] = p.split(":"); document.getElementById(id).value = state[k]; });
    colorIds.forEach(p => { const [id, k] = p.split(":"); document.getElementById(id).value = state[k]; });
    document.getElementById("nose-scale").value = state.noseScale;
    document.getElementById("nose-scale-val").textContent = state.noseScale.toFixed(2) + "×";
    document.getElementById("eye-spacing").value = state.eyeSpacing;
    document.getElementById("eye-spacing-val").textContent = state.eyeSpacing.toFixed(1) + "×";
    document.getElementById("dual-stripe").checked = !!state.dualStripe;
    document.getElementById("stripe-row").style.display = state.dualStripe ? "flex" : "none";
}

const presetSelect = document.getElementById("preset-select");
presetSelect.appendChild(new Option("-- Custom --", "custom"));
Object.keys(presets).forEach(key => presetSelect.appendChild(new Option(formatName(key), key)));

document.getElementById("load-preset").addEventListener("click", () => {
    const key = presetSelect.value;
    if (presets[key]) { state = { ...presets[key] }; writeStateIntoUI(); render(); }
});

document.querySelectorAll(".sidebar input, .sidebar select").forEach(el => {
    if(el.id !== "preset-select") el.addEventListener("input", readUIIntoState);
});

/* ==========================================================
   EXPORTS
   ========================================================== */
function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

document.getElementById("export-svg").addEventListener("click", () => {
    const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + buildSVG(state)], { type:"image/svg+xml;charset=utf-8" });
    triggerDownload(blob, slugify(state.name) + ".svg");
});

document.getElementById("export-json").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
    triggerDownload(blob, slugify(state.name) + ".json");
});

document.getElementById("export-batch").addEventListener("click", async () => {
    const btn = document.getElementById("export-batch");
    const orig = btn.textContent;
    btn.textContent = "Preparing…"; btn.disabled = true;
    try {
        if(typeof JSZip === "undefined") throw new Error("JSZip unavailable");
        const zip = new JSZip();
        Object.entries(presets).forEach(([key, preset]) => {
            zip.file(`${key}.svg`, '<?xml version="1.0" encoding="UTF-8"?>\n' + buildSVG(preset));
            zip.file(`${key}.json`, JSON.stringify(preset, null, 2));
        });
        const blob = await zip.generateAsync({ type:"blob" });
        triggerDownload(blob, "historical_character_profiles.zip");
    } catch(err) {
        Object.entries(presets).forEach(([key, preset], i) => {
            setTimeout(() => {
                triggerDownload(new Blob([JSON.stringify(preset, null, 2)], { type:"application/json" }), `${key}.json`);
            }, i * 300);
        });
    } finally {
        setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 500);
    }
});

/* Initialize */
writeStateIntoUI();
render();
</script>
