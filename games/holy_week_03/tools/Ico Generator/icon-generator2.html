<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phosphor Icon Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg-color: #0b0b0f;
    --panel-bg: #14141a;
    --panel-2: #1c1c24;
    --text-color: #e2e2e6;
    --text-dim: #9aa0a6;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --border: #272730;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh; overflow: hidden;
    font-family: var(--font-body);
    background: var(--bg-color);
    color: var(--text-color);
    display: flex;
  }
  .workspace { display: flex; flex-direction: row; width: 100%; height: 100%; }
  .sidebar {
    width: 400px; min-width: 400px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .brand {
    font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em;
    color: var(--text-color);
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .brand small { font-size: .55rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 600; }
  h3.section-title {
    font-size: .8rem; font-weight: 600; color: var(--text-dim);
    margin: 0 0 8px; letter-spacing: .04em; text-transform: uppercase;
  }
  .control-group { display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .control-group:last-of-type { border-bottom: none; }
  label.field { font-size: .75rem; color: var(--text-dim); display: flex; flex-direction: column; gap: 4px; }
  select, input[type="text"], input[type="range"] {
    width: 100%; padding: 7px 10px;
    background: var(--panel-2); color: var(--text-color);
    border: 1px solid var(--border); border-radius: 4px;
    font-family: var(--font-body); font-size: .8rem;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .color-field { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .72rem; color: var(--text-dim); }
  input[type="color"] {
    width: 34px; height: 26px; padding: 0; border: 1px solid var(--border); border-radius: 4px;
    background: none; cursor: pointer; flex-shrink: 0;
  }
  button {
    font-family: var(--font-body); font-weight: 600; font-size: .8rem;
    background: var(--accent); color: #fff;
    border: 1px solid var(--accent); padding: 9px 12px; border-radius: 4px;
    cursor: pointer; transition: background .15s ease;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: var(--panel-2); border-color: var(--border); color: var(--text-color); }
  button.secondary:hover { background: var(--border); }
  button.wide { width: 100%; }
  .action-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: auto; padding-top: 10px; }
  .row-buttons { display: flex; gap: 8px; }
  .canvas-area {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 50%, #181822 0%, var(--bg-color) 80%);
    position: relative; gap: 20px;
  }
  .preview-stage {
    width: 260px; height: 260px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    position: relative; padding: 36px;
  }
  #svg-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #svg-container svg { width: 100%; height: 100%; display: block; }
  .caption { text-align: center; }
  .caption .emoji-lg { font-size: 2.2rem; margin-bottom: 4px; }
  .caption .name { font-size: 1.1rem; font-weight: 600; }
  .caption .sub { font-size: .72rem; color: var(--text-dim); margin-top: 2px; font-family: monospace; }
  .icon-list { display: flex; flex-wrap: wrap; gap: 4px; max-height: 200px; overflow-y: auto; }
  .icon-chip {
    font-size: .65rem; padding: 3px 6px; border-radius: 3px;
    background: var(--panel-2); border: 1px solid var(--border);
    cursor: pointer; transition: border-color .15s;
    display: flex; align-items: center; gap: 2px;
  }
  .icon-chip:hover { border-color: var(--accent); }
  .icon-chip.active { border-color: var(--accent); background: var(--accent); color: #fff; }
  .icon-chip .chip-emoji { margin-right: 1px; }
  .icon-chip .chip-name { color: var(--text-dim); margin-left: 2px; }
  .icon-chip.active .chip-name { color: #fff; }
  .filter-input {
    width: 100%; padding: 6px 10px;
    background: var(--panel-2); color: var(--text-color);
    border: 1px solid var(--border); border-radius: 4px;
    font-family: var(--font-body); font-size: .75rem;
  }
  .no-icon { color: var(--text-dim); font-style: italic; font-size: .85rem; }
  .usage-badge {
    display: inline-block; font-size: .58rem; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; padding: 1px 5px; border-radius: 3px; margin-left: 4px;
    vertical-align: middle;
  }
  .usage-badge.evidence { background: #78350f; color: #fde68a; }
  .usage-badge.menu { background: #14532d; color: #bbf7d0; }
  .caption .usage-line { margin-top: 4px; }
  .icon-chip .chip-badges { display: inline-flex; gap: 2px; margin-left: 2px; }
  .icon-chip .usage-badge { font-size: .52rem; padding: 0 4px; }
</style>
</head>
<body>

<div class="workspace">
  <div class="sidebar">
    <div class="brand">Phosphor Icon Forge <small>SVG Forge</small></div>

    <div class="control-group">
      <h3 class="section-title">Icon Browser</h3>
      <input type="text" class="filter-input" id="iconFilter" placeholder="Filter icons..." value="">
      <div class="icon-list" id="iconList"></div>
    </div>

    <div class="control-group">
      <h3 class="section-title">Preview</h3>
      <div id="iconPreview"></div>
    </div>

    <div class="control-group">
      <h3 class="section-title">Display Options</h3>
      <label class="field">Color Mode
        <select id="colorMode">
          <option value="duotone">Duotone (Primary / Secondary)</option>
          <option value="fill">Fill (Solid Color)</option>
          <option value="original">Original (as-is from SVG)</option>
          <option value="emoji">Full Colour (Emoji)</option>
        </select>
      </label>
      <label class="field">Corner Roundness <span id="radiusVal">0</span>px
        <input type="range" id="iconRadius" min="0" max="12" value="0">
      </label>
    </div>

    <div class="control-group" id="duotoneOptions" style="display:none;">
      <h3 class="section-title">Duotone Palette</h3>
      <div class="color-grid">
        <div class="color-field">Primary <input type="color" id="colorPrimary" value="#ffffff"></div>
        <div class="color-field">Secondary <input type="color" id="colorSecondary" value="#87ceeb"></div>
      </div>
    </div>

    <div class="control-group" id="fillOptions" style="display:none;">
      <h3 class="section-title">Fill Color</h3>
      <div class="color-field">Color <input type="color" id="fillColor" value="#3b82f6"></div>
    </div>

    <div class="action-buttons">
      <div class="row-buttons">
        <button class="wide" id="exportSvg">Download .SVG</button>
        <button class="wide secondary" id="copySvg">Copy SVG to Clipboard</button>
      </div>
      <button class="wide" style="background:#10b981; border-color:#10b981;" id="exportBatch">Batch Export All (ZIP)</button>
      <div style="font-size:.62rem; color:var(--text-dim); text-align:center; padding-top:4px;">
        Full Colour presets use <a href="https://openmoji.org" target="_blank" rel="noopener" style="color:var(--accent);">OpenMoji</a> artwork, CC BY-SA 4.0
      </div>
    </div>
  </div>

  <div class="canvas-area">
    <div class="preview-stage">
      <div id="svg-container"></div>
    </div>
    <div class="caption">
      <div class="emoji-lg" id="captionEmoji"></div>
      <div class="name" id="captionName"></div>
      <div class="sub" id="captionSub"></div>
      <div class="usage-line" id="captionUsage"></div>
    </div>
  </div>
</div>

// Cross-referenced from Miracle_Maker.md "Appendix: Emoji Reference" Usage column.
// "evidence"  = sourced from a case's evidencePool (rendered in the evidence grid)
// "menu"      = used on the investigation nav tabs (Scene/People/Lab/Codex/Accuse)
const USAGE_TAGS = {
  "balance-scale-duotone.svg": ["evidence", "menu"],
  "scroll-duotone.svg": ["evidence", "menu"],
  "magnifying-glass-duotone.svg": ["menu"],
  "bird-duotone.svg": ["evidence"],
  "bone-duotone.svg": ["evidence"],
  "book-open-duotone.svg": ["evidence"],
  "bowl-duotone.svg": ["evidence"],
  "bread-duotone.svg": ["evidence"],
  "building-columns-duotone.svg": ["evidence"],
  "chain-duotone.svg": ["evidence"],
  "circle-duotone.svg": ["evidence"],
  "clipboard-duotone.svg": ["evidence"],
  "coins-duotone.svg": ["evidence"],
  "cup-duotone.svg": ["evidence"],
  "currency-dollar-duotone.svg": ["evidence"],
  "dice-duotone.svg": ["evidence"],
  "ear-duotone.svg": ["evidence"],
  "envelope-duotone.svg": ["evidence"],
  "eye-duotone.svg": ["evidence"],
  "feather-duotone.svg": ["evidence"],
  "fish-duotone.svg": ["evidence"],
  "flame-duotone.svg": ["evidence"],
  "headstone-duotone.svg": ["evidence"],
  "horse-duotone.svg": ["evidence"],
  "jar-duotone.svg": ["evidence"],
  "leaf-duotone.svg": ["evidence"],
  "leaves-duotone.svg": ["evidence"],
  "link-duotone.svg": ["evidence"],
  "log-duotone.svg": ["evidence"],
  "rock-duotone.svg": ["evidence"],
  "sparkles-duotone.svg": ["evidence"],
  "stars-duotone.svg": ["evidence"],
  "sun-duotone.svg": ["evidence"],
  "sword-duotone.svg": ["evidence"],
  "text-align-left-duotone.svg": ["evidence"],
  "tree-duotone.svg": ["evidence"],
  "user-duotone.svg": ["evidence"],
  "water-drop-duotone.svg": ["evidence"],
  "wine-duotone.svg": ["evidence"],
};

function getUsageTags(icon) {
  return USAGE_TAGS[icon.file] || [];
}

function usageBadgeHtml(tags) {
  return tags.map(function(t) {
    return '<span class="usage-badge ' + t + '">' + (t === 'evidence' ? 'Evidence' : 'Menu') + '</span>';
  }).join('');
}

let currentIcon = null;

function buildIconSVG(icon, mode) {
  let svg = icon.svgContent;
  const rx = parseInt(document.getElementById('iconRadius').value) || 0;

  if (mode === 'original') {
    return svg.replace('<svg', '<svg rx="' + rx + '"');
  }

  if (mode === 'emoji') {
    // Full-colour SVG: uses genuine OpenMoji vector artwork (CC BY-SA 4.0,
    // openmoji.org) when we have a matching asset for this icon, so the
    // preset actually looks like the emoji rather than a recoloured line
    // icon. Falls back to rendering the native glyph via <text> (system
    // colour emoji font) for the handful of icons OpenMoji doesn't cover.
    if (icon.openmoji) {
      return icon.openmoji.replace('<svg', '<svg rx="' + rx + '"');
    }
    var bgRect = rx > 0
      ? '<rect x="0" y="0" width="256" height="256" rx="' + rx + '" fill="none"/>'
      : '';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">' +
      bgRect +
      '<text x="128" y="128" text-anchor="middle" dominant-baseline="central" ' +
      'font-size="200" font-family="\'Apple Color Emoji\',\'Segoe UI Emoji\',' +
      '\'Noto Color Emoji\',\'Twemoji Mozilla\',sans-serif">' +
      icon.emoji + '</text></svg>';
  }

  var primary = document.getElementById('colorPrimary').value;
  var secondary = document.getElementById('colorSecondary').value;
  var fillColor = document.getElementById('fillColor').value;

  // For duotone mode: replace fill attributes on shape elements only (not background rects)
  // Background rects use fill="none" or fill="transparent" - preserve these
  if (mode === 'fill') {
    svg = svg.replace(/fill="(?!none|transparent)[^"]*"/g, 'fill="' + fillColor + '"');
    svg = svg.replace(/stroke="(?!none|transparent)[^"]*"/g, 'stroke="' + fillColor + '"');
  } else {
    svg = svg.replace(/fill="(?!none|transparent)[^"]*"/g, 'fill="currentColor"');
    svg = svg.replace(/stroke="(?!none|transparent)[^"]*"/g, 'stroke="currentColor"');
  }

  svg = svg.replace('<svg', '<svg rx="' + rx + '"');

  var colorStyle = '';
  if (mode === 'duotone') {
    colorStyle = '<style>svg{color:' + secondary + '}path[opacity],circle[opacity],rect[opacity],ellipse[opacity],polygon[opacity],polyline[opacity],line[opacity]{fill:' + primary + '}</style>';
  } else {
    colorStyle = '<style>svg{color:' + fillColor + '}</style>';
  }

  svg = svg.replace('</svg>', colorStyle + '</svg>');
  return svg;
}

function renderIconList(filter) {
  var container = document.getElementById('iconList');
  var f = (filter || '').toLowerCase();
  var filtered = ICON_CATALOG.filter(function(i) {
    return (i.name + ' ' + i.file + ' ' + i.emoji).toLowerCase().indexOf(f) >= 0;
  });
  container.innerHTML = filtered.map(function(i) {
    var active = currentIcon && currentIcon.file === i.file ? ' active' : '';
    var badges = usageBadgeHtml(getUsageTags(i));
    return '<div class="icon-chip' + active + '" data-file="' + i.file + '">' +
      '<span class="chip-emoji">' + i.emoji + '</span><span class="chip-name">' + i.name + '</span>' +
      (badges ? '<span class="chip-badges">' + badges + '</span>' : '') + '</div>';
  }).join('');
  container.querySelectorAll('.icon-chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      selectIcon(chip.dataset.file);
    });
  });
}

function selectIcon(file) {
  currentIcon = ICON_CATALOG.find(function(i) { return i.file === file; });
  if (!currentIcon) return;
  // Menu tab and evidence-grid icons default to Full Colour, per design decision.
  var tags = getUsageTags(currentIcon);
  if (tags.length > 0) {
    document.getElementById('colorMode').value = 'emoji';
  }
  updatePreview();
  renderIconList(document.getElementById('iconFilter').value);
}

function updatePreview() {
  if (!currentIcon) return;
  var mode = document.getElementById('colorMode').value;
  document.getElementById('duotoneOptions').style.display = mode === 'duotone' ? 'block' : 'none';
  document.getElementById('fillOptions').style.display = mode === 'fill' ? 'block' : 'none';
  document.getElementById('svg-container').innerHTML = buildIconSVG(currentIcon, mode);
  document.getElementById('captionEmoji').textContent = currentIcon.emoji;
  document.getElementById('captionName').textContent = currentIcon.name;
  document.getElementById('captionSub').textContent = currentIcon.file +
    (mode === 'emoji' ? (currentIcon.openmoji ? '  ·  OpenMoji vector' : '  ·  system emoji font (no OpenMoji match)') : '');
  document.getElementById('captionUsage').innerHTML = usageBadgeHtml(getUsageTags(currentIcon));
}

document.getElementById('iconFilter').addEventListener('input', function(e) { renderIconList(e.target.value); });
document.getElementById('colorMode').addEventListener('change', updatePreview);
document.getElementById('iconRadius').addEventListener('input', function(e) {
  document.getElementById('radiusVal').textContent = e.target.value;
  updatePreview();
});
document.getElementById('colorPrimary').addEventListener('input', updatePreview);
document.getElementById('colorSecondary').addEventListener('input', updatePreview);
document.getElementById('fillColor').addEventListener('input', updatePreview);

document.getElementById('exportSvg').addEventListener('click', function() {
  if (!currentIcon) return;
  var svg = buildIconSVG(currentIcon, document.getElementById('colorMode').value);
  var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = currentIcon.file;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('copySvg').addEventListener('click', function() {
  if (!currentIcon) return;
  var svg = buildIconSVG(currentIcon, document.getElementById('colorMode').value);
  navigator.clipboard.writeText(svg).then(function() { alert('SVG copied to clipboard!'); });
});

document.getElementById('exportBatch').addEventListener('click', async function() {
  if (typeof JSZip === 'undefined') { alert('JSZip not loaded'); return; }
  var zip = new JSZip();
  var mode = document.getElementById('colorMode').value;
  ICON_CATALOG.forEach(function(icon) {
    zip.file(icon.file, buildIconSVG(icon, mode));
  });
  var blob = await zip.generateAsync({ type: 'blob' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'phosphor_icons_export.zip';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Load first icon on startup
if (ICON_CATALOG.length > 0) {
  selectIcon(ICON_CATALOG[0].file);
  renderIconList();
}
</script>
</body>
</html>
